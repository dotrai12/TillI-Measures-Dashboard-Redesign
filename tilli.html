<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures — Internal</title>
<link rel="stylesheet" href="_ds/tilli/tokens/fonts.css?v=20261020nb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css?v=20261020nb">
<style>
  /* ============================================================
     Tilli Measures — INTERNAL managing platform chrome.
     Shared chrome/components (side, header, cards, chips, tables,
     tabs, modals, toast…) come from the ui-* classes in tilli.css.
     This block only holds what is unique to the Platform Admin.
     A calm, operational cross-school surface for the Tilli Team.
     ============================================================ */
  :root { --tl-side-w: var(--side-w); --tl-header-h: 66px; --tl-maxw: 1200px; }
  body { background: var(--white); }   /* pure white, same as the teacher dashboard — cards keep their 1px border */

  .tl-app { min-height: 100dvh; display: grid; grid-template-columns: var(--tl-side-w) 1fr; }
  /* Mono text sits slightly smaller than the surrounding copy on this page */
  .tl-app .mono, #tl-modal-root .mono { font-size: .92em; }

  /* ---- Sidebar (ui-side + page bits) ---- */
  .tl-side .lockup { padding: 4px 8px 6px; }
  .tl-badge-int { margin: 0 8px 12px; align-self: flex-start; padding: 5px 12px; }
  .ui-nav-item.sub { padding: 8px 12px 8px 40px; font-size: var(--fs-sm); font-weight: 600; }
  .ui-nav-item.sub.on { font-weight: 700; }
  .tl-nav-head { display: flex; align-items: center; gap: 10px; margin: 12px 6px 2px; font-family: var(--font-body); font-weight: 700; font-size: var(--fs-xs); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-300); }
  .tl-nav-head .ic { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-450); }
  .tl-nav-head .ic svg { width: 16px; height: 16px; }
  .tl-nav-badge { margin-left: auto; background: var(--pink-400); color: var(--white); font-size: var(--fs-xs); font-weight: 700; border-radius: var(--radius-pill); padding: 1px 7px; min-width: 18px; text-align: center; }
  .ui-nav-item.on .tl-nav-badge { background: var(--green-500); }

  /* ---- Header (ui-header + search + account menu position) ---- */
  .tl-search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 9px; background: var(--surface-100); border: 1px solid var(--line-200); border-radius: var(--radius-pill); padding: 8px 15px; }
  .tl-search:focus-within { border-color: var(--focus); background: var(--white); }
  .tl-search .ic { color: var(--ink-300); display: grid; place-items: center; }
  .tl-search .ic svg { width: 17px; height: 17px; }
  .tl-search { position: relative; }
  /* School typeahead (#12) — top-bar search + Control Room finder */
  .tl-ta-menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40; max-height: 360px; overflow-y: auto; }
  .tl-ta-item { flex-direction: column; align-items: flex-start; gap: 2px; }
  .tl-ta-name { color: var(--ink-900); }
  .tl-ta-sub { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  .tl-ta-all { color: var(--accent-ink); border-top: 1px solid var(--line-200); border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
  .tl-ta-empty { padding: 10px; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); }
  .tl-findschool { position: relative; display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--line-200); border-radius: var(--radius-pill); padding: 12px 18px; margin-bottom: var(--page-gap); box-shadow: var(--shadow-card); }
  .tl-findschool:focus-within { border-color: var(--focus); }
  .tl-findschool .ic { color: var(--ink-300); display: grid; place-items: center; }
  .tl-findschool .ic svg { width: 19px; height: 19px; }
  .tl-findschool-in { flex: 1; border: none; outline: none; background: none; font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-md); color: var(--ink-900); }
  /* Ask Tilli full screen (#9 #10) — shared .askx layout from tilli.css; the main column goes full height */
  .tl-app.tl-ask-mode .tl-main { padding: 0; display: flex; height: 100dvh; min-height: 0; }   /* header is hidden on desktop */
  .tl-app.tl-ask-mode .tl-wrap { max-width: none; margin: 0; flex: 1; min-height: 0; display: flex; }
  .tl-ask-tbl { overflow-x: auto; margin: 8px 0; }
  .tl-ask-tbl table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
  .tl-ask-tbl th { text-align: left; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); text-transform: uppercase; letter-spacing: .03em; padding: 6px 8px; border-bottom: 1px solid var(--line-200); }
  .tl-ask-tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line-200); vertical-align: top; }
  .tl-ask-tbl small { color: var(--ink-450); font-weight: 600; }
  .tl-ask-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .tl-ask-src { margin-top: 8px; font-size: var(--fs-xs); font-weight: 700; color: var(--text-meta); }
  .tl-ask-more { font-weight: 600; color: var(--ink-450); margin: 4px 0 0; }
  .tl-ask-sugs { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .tl-ask-man { margin: 8px 0; padding: 10px 12px; background: var(--surface-100); border-radius: var(--radius-sm); }
  .tl-ask-man ol { margin: 6px 0; padding-left: 18px; }
  /* Knowledge Base → Manuals (#11) */
  .tl-kb { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: var(--page-gap); align-items: start; }
  .tl-kb-side { display: flex; flex-direction: column; gap: 10px; }
  .tl-kb-list { display: flex; flex-direction: column; gap: 2px; }
  .tl-kb-item { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; border-radius: var(--radius-sm); text-decoration: none; }
  .tl-kb-item b { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-kb-item span { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  .tl-kb-item:hover, .tl-kb-item.on { background: var(--surface-100); }
  .tl-kb-item.on b { color: var(--green-700); }
  .tl-kb-title { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl); color: var(--ink-900); margin: 4px 0 6px; }
  .tl-kb-steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
  .tl-kb-steps li { font-weight: 600; font-size: var(--fs-md); color: var(--ink-700); line-height: 1.5; }
  @media (max-width: 760px) { .tl-kb { grid-template-columns: 1fr; } }
  /* Completion ranking → School groups: sub-line under a number / lowest-school % */
  .tl-rank-small td small { display: block; font-weight: 600; font-size: var(--fs-xs); color: var(--text-meta); margin-top: 2px; }
  /* Change History date range */
  .tl-hist-range { gap: 10px 14px; }
  .tl-hist-dates { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .tl-hist-dates[hidden] { display: none; }
  .tl-hist-dates label { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-hist-dates .input { width: auto; padding-top: 7px; padding-bottom: 7px; }
  /* Pager (Students tab) */
  .tl-pager { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 14px; }
  .tl-pager-info { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); }
  .tl-pager-info b { font-weight: 700; color: var(--ink-900); }
  .tl-pager-size { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-pager-size .select { width: auto; padding-top: 6px; padding-bottom: 6px; }
  .tl-pager-nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .tl-pg { min-width: 36px; height: 36px; padding: 0 10px; border: 1px solid var(--line-200); background: var(--white); border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-body); font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-pg:hover:not([disabled]):not(.on) { border-color: var(--green-500); color: var(--green-700); }
  .tl-pg.on { background: var(--green-500); border-color: var(--green-500); color: var(--white); }
  .tl-pg[disabled] { opacity: .4; cursor: default; }
  .tl-pg-gap { padding: 0 4px; color: var(--ink-450); font-weight: 700; }
  @media (max-width: 640px) { .tl-pager-nav { margin-left: 0; width: 100%; } }
  /* Help: ⓘ tooltips, ? Help panel, FAQ */
  .tl-tip { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 6px; border-radius: 50%; border: 1.5px solid var(--ink-300); color: var(--ink-450); font-family: var(--font-heading); font-style: normal; font-weight: 700; font-size: 10px; line-height: 1; text-transform: none; letter-spacing: 0; vertical-align: middle; cursor: help; user-select: none; }
  .tl-tip:hover, .tl-tip:focus-visible { border-color: var(--green-500); color: var(--green-700); outline: none; }
  .ui-screen-title .tl-tip { width: 18px; height: 18px; font-size: 11px; vertical-align: 4px; }
  .tl-tipbox { position: absolute; z-index: 120; max-width: 280px; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--ink-900); color: var(--white); font-weight: 600; font-size: var(--fs-sm); line-height: 1.45; box-shadow: var(--shadow-pop); pointer-events: none; opacity: 0; transition: opacity .12s; }
  .tl-tipbox.show { opacity: 1; }
  .tl-help-btn { font-weight: 700; }
  .tl-help { position: fixed; inset: 0; z-index: 90; }
  .tl-help-scrim { position: absolute; inset: 0; border: none; background: rgba(20, 20, 20, .25); cursor: pointer; }
  .tl-help-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--white); box-shadow: var(--shadow-pop); padding: 22px 22px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .tl-help-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .tl-help-h h2 { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl); color: var(--ink-900); margin: 2px 0 0; }
  .tl-help-x { border: none; background: none; font-size: 26px; line-height: 1; color: var(--ink-450); cursor: pointer; padding: 2px 6px; }
  .tl-help-ask { display: flex; gap: 8px; margin-bottom: 6px; }
  .tl-help-ask .input { flex: 1; min-width: 0; }
  .tl-help-answer:empty { display: none; }
  .tl-help-answer { padding: 12px; margin-bottom: 8px; background: var(--surface-100); border-radius: var(--radius-md); font-size: var(--fs-sm); }
  .tl-help-answer .tl-faq { background: var(--white); }
  .tl-help-more { margin-top: 8px; }
  .tl-help-sec { font-weight: 700; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-450); margin: 10px 0 4px; }
  .tl-help-foot { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-200); }
  .tl-faq { border: 1px solid var(--line-200); border-radius: var(--radius-sm); padding: 0 12px; margin-bottom: 6px; background: var(--white); }
  .tl-faq summary { cursor: pointer; padding: 11px 0; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-faq[open] summary { color: var(--green-700); }
  .tl-faq p { margin: 0 0 12px; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); line-height: 1.5; }
  .tl-faq-topic { margin-bottom: 10px; }
  /* Deployment status (data-driven): Scheduled / Live / Ended / Completed / Not deployed */
  button.tl-tl-label { background: none; border: none; padding: 0; cursor: pointer; }
  .tl-tl-sub2 { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); margin-top: 2px; }
  .tl-tl-node.st-live .tl-tl-diamond, .tl-tl-node.st-live .tl-tl-dot { background: var(--yellow-500); border-color: var(--yellow-500); }
  .tl-tl-node.st-live .tl-tl-diamond::after { content: '●'; font-size: var(--fs-xs); }
  .tl-tl-node.st-scheduled .tl-tl-diamond, .tl-tl-node.st-scheduled .tl-tl-dot { background: var(--wash-cyan); border-color: var(--cyan-500); }
  .tl-tl-node.st-ended .tl-tl-diamond, .tl-tl-node.st-ended .tl-tl-dot { background: var(--ink-300); border-color: var(--ink-300); }
  .tl-tl-node.st-ended .tl-tl-diamond::after { content: '–'; font-size: var(--fs-sm); font-weight: 700; }
  .tl-tl-node.aud.st-completed .tl-tl-diamond, .tl-tl-node.aud.st-completed .tl-tl-dot { background: var(--green-500); border-color: var(--green-500); }
  .tl-tl-legend .st-completed i { background: var(--green-500); }
  .tl-tl-legend .st-live i { background: var(--yellow-500); }
  .tl-tl-legend .st-scheduled i { background: var(--wash-cyan); border: 2px solid var(--cyan-500); }
  .tl-tl-legend .st-ended i { background: var(--ink-300); }
  .tl-tl-legend .st-none i { background: var(--white); border: 2px solid var(--line-200); }
  .dep-phase-when { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin: -4px 0 10px; }
  .dep-phase-when.st-scheduled { color: var(--cyan-700); }
  .dep-phase-when.st-live { color: var(--green-700); }
  .dep-phase-when.st-completed { color: var(--green-700); font-weight: 700; }
  .dep-dates label { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }
  .dep-chain-note { margin: 0 0 12px; }
  .dep-chain-note b { color: var(--ink-700); }
  .dep-pop-why { margin-left: auto; font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  .tl-demo-btn { border-style: dashed; }
  /* Group links (#7) */
  .tl-grouplinks { padding: 10px 0; border-top: 1px solid var(--line-200); }
  .tl-grouplinks:first-of-type { border-top: none; }
  .tl-grouplinks-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .tl-grouplinks-h b { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-grouplinks-h span { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  /* Teacher assessment log (#1) */
  .tl-tlog-sums { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 12px; }
  .tl-tlog-sum { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-tlog-sum b { font-weight: 700; color: var(--green-700); }
  /* Archived group notice (#13) */
  .tl-archived-notice { max-width: 620px; margin: 40px auto; text-align: left; }
  .tl-archived-notice .ui-screen-title { margin: 6px 0 10px; }
  /* Issues by school (#17) */
  .tl-issue-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: var(--page-gap); }
  .tl-issue-strip .ui-eyebrow { margin-right: 4px; }
  .tl-issue-strip .ui-filterchip b { font-weight: 700; color: var(--danger-700); margin-left: 4px; }
  .tl-issue-chip { border: none; cursor: pointer; font-family: var(--font-body); }
  td.name .tl-issue-chip { margin-left: 6px; vertical-align: middle; }
  .tl-search input { flex: 1; border: none; background: none; outline: none; font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-h-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  /* Header avatar is the account entry only when the sidebar (and its profile) is hidden. */
  .tl-header .tl-acct-m { display: none; }
  .tl-header-bare { display: none; }   /* Super Admin, desktop: nothing to show */

  /* ---- Main ---- */
  .tl-main { padding: var(--page-gap) clamp(16px, 3vw, 32px) 96px; }
  .tl-wrap { max-width: var(--tl-maxw); margin: 0 auto; }

  /* ---- Screen head with right-aligned actions ---- */
  .tl-screen-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: var(--page-gap); }
  .tl-screen-head .ui-screen-title, .tl-screen-head .ui-screen-sub { margin: 0; }
  .tl-screen-head .ui-screen-sub { margin-top: 3px; }
  .tl-screen-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .tl-mini-head { margin: calc(var(--page-gap) + 4px) 0 10px; }

  /* ---- KPI tiles (ui-card tight ui-kpi) ---- */
  .tl-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--page-gap); margin-bottom: var(--page-gap); }
  .tl-kpis.four, .tl-kpis.five { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tl-kpis.five { margin-bottom: 6px; }
  .tl-kpi .num { display: flex; align-items: baseline; gap: 8px; }
  a.tl-kpi { text-decoration: none; display: block; }
  .tl-kpi-delta { font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 700; color: var(--green-700); background: var(--wash-green); border-radius: var(--radius-pill); padding: 2px 8px; }

  /* ---- Layout grids ---- */
  .tl-grid { display: grid; gap: var(--page-gap); }
  .tl-grid.two { grid-template-columns: 1fr 1fr; }
  .tl-stack { display: flex; flex-direction: column; gap: 12px; }
  /* Side-by-side form fields (Country / City, Audience / Phase…) */
  .tl-fieldrow { display: flex; gap: 10px; }
  /* Numbered step layout: a circular badge sits to the LEFT of a card. */
  .tl-stepcard { display: flex; align-items: flex-start; gap: 14px; }
  .tl-stepcard > .ui-card { flex: 1; min-width: 0; }
  .tl-stepnum { flex: none; width: 30px; height: 30px; border-radius: 50%; margin-top: clamp(16px, 2vw, 22px);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md);
    background: var(--green-700); color: var(--white); }
  @media (max-width: 620px) { .tl-stepnum { margin-top: 15px; width: 26px; height: 26px; font-size: var(--fs-sm); } }
  /* Role capability hint shown under a role picker (invite / role editor). */
  .tl-rolecap { display: block; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 6px; line-height: 1.4; }
  .tl-num { font-variant-numeric: tabular-nums; }
  .tl-muted { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin: 0 0 14px; }
  .tl-muted.mt-3 { margin-top: var(--space-3); }
  .tl-ok { color: var(--green-700); font-weight: 700; font-size: var(--fs-sm); }
  .tl-confirm-body { font-weight: 600; font-size: var(--fs-md); color: var(--ink-600); line-height: 1.55; }
  .tl-confirm-body b { color: var(--ink-900); }

  /* ---- Filters ---- */
  .tl-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: var(--page-gap); }
  .tl-filters .select-wrap { min-width: 150px; }
  .tl-filters .grow { flex: 1; }
  .tl-filters .tl-filter-q { max-width: 340px; }
  .tl-country-seg { flex-wrap: wrap; max-width: 100%; }
  .tl-country-seg b { font-weight: 700; font-size: var(--fs-xs); color: var(--ink-300); margin-left: 4px; }
  .tl-country-seg button.on b { color: var(--green-700); }
  .tl-filterbanner { background: var(--wash-cyan); color: var(--cyan-700); font-weight: 600; font-size: var(--fs-sm); border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 14px; }
  .tl-filterbanner .btn-link { color: var(--cyan-700); text-decoration: underline; }

  /* ---- Bars (mini charts; track = ui-meter lg light) ---- */
  .tl-bar-row { display: grid; grid-template-columns: 130px 1fr 46px; gap: 12px; align-items: center; padding: 8px 0; }
  .tl-bar-lbl { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ui-meter > .tl-bar-fill { background: var(--cyan-500); }
  .ui-meter > .tl-bar-fill.sel { background: var(--green-500); }
  .ui-meter > .tl-bar-fill.cog { background: var(--cyan-500); }
  .tl-bar-val { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); text-align: right; font-variant-numeric: tabular-nums; }

  /* ---- Stage stepper ---- */
  .tl-steps { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding: 4px 0 2px; }
  .tl-step { flex: 1 1 0; min-width: 78px; text-align: center; position: relative; }
  .tl-step .dot { width: 22px; height: 22px; border-radius: 50%; margin: 0 auto 8px; background: var(--surface-100); border: 2px solid var(--line-200); display: grid; place-items: center; font-size: var(--fs-xs); color: var(--ink-300); font-weight: 700; position: relative; z-index: 1; }
  .tl-step.done .dot { background: var(--green-500); border-color: var(--green-500); color: var(--white); }
  .tl-step.cur .dot { background: var(--white); border-color: var(--green-500); color: var(--green-700); box-shadow: 0 0 0 4px var(--wash-green); }
  .tl-step::before { content: ''; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line-200); z-index: 0; }
  .tl-step:first-child::before { display: none; }
  .tl-step.done::before, .tl-step.cur::before { background: var(--green-500); }
  .tl-step .slabel { font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }
  .tl-step.cur .slabel { color: var(--green-700); }
  .ws-opt-tag { margin-left: 5px; }

  /* ---- Deployment drill-down timeline (school Assessments tab) ---- */
  .tl-tl { margin-bottom: 18px; }
  .tl-tl-crumbs { margin-bottom: 4px; }
  .tl-tl-note { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-300); margin: 0 0 16px; }

  .tl-tl-rail { position: relative; display: flex; align-items: flex-start; padding: 8px 0 4px; overflow-x: auto; }
  .tl-tl-line { position: absolute; top: 41px; height: 2px; background: var(--line-200); border-radius: 2px; z-index: 0; }
  .tl-tl-node { flex: 1 1 0; min-width: 96px; position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 6px; }
  .tl-tl-diamond { position: relative; width: 26px; height: 26px; border-radius: var(--radius-xs); transform: rotate(45deg); background: var(--white); border: 2px solid var(--line-200); transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
  /* Expand the tap target to ~48px without changing the diamond's size */
  .tl-tl-node.clickable .tl-tl-diamond::before { content: ''; position: absolute; inset: -11px; }
  /* Redundant shape cue so status reads without relying on colour alone */
  .tl-tl-diamond::after { position: absolute; inset: 0; display: grid; place-items: center; transform: rotate(-45deg); color: var(--white); line-height: 1; pointer-events: none; }
  .tl-tl-node.st-completed .tl-tl-diamond::after { content: '✓'; font-size: var(--fs-sm); font-weight: 700; }
  .tl-tl-node.st-inprogress .tl-tl-diamond::after { content: '●'; font-size: var(--fs-xs); }
  .tl-tl-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--white); border: 2px solid var(--line-200); margin-top: 9px; position: relative; z-index: 1; }
  .tl-tl-label { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); margin-top: 9px; line-height: 1.25; }
  .tl-tl-sub { font-family: var(--font-body); font-weight: 700; font-size: var(--fs-xs); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-300); margin-top: 3px; }

  .tl-tl-node.clickable .tl-tl-diamond, .tl-tl-node.clickable .tl-tl-dot { cursor: pointer; }
  .tl-tl-node.clickable .tl-tl-diamond:hover { transform: rotate(45deg) scale(1.14); box-shadow: var(--shadow-hover); }
  .tl-tl-label.nav { cursor: pointer; }
  .tl-tl-label.nav:hover { color: var(--green-700); }
  .tl-tl-caret { color: var(--ink-300); font-weight: 700; }
  .tl-tl-label.nav:hover .tl-tl-caret { color: var(--green-700); }

  /* phase / audience states (green = done, yellow = in progress, outline = pending) */
  .tl-tl-node.st-completed .tl-tl-diamond, .tl-tl-node.st-completed .tl-tl-dot { background: var(--green-500); border-color: var(--green-500); }
  .tl-tl-node.st-inprogress .tl-tl-diamond, .tl-tl-node.st-inprogress .tl-tl-dot { background: var(--yellow-500); border-color: var(--yellow-500); }
  /* audience level keeps a blue diamond when active; the dot still shows status */
  .tl-tl-node.aud.st-completed .tl-tl-diamond, .tl-tl-node.aud.st-inprogress .tl-tl-diamond { background: var(--cyan-500); border-color: var(--cyan-500); }

  /* assessment level: where the assessment runs */
  .tl-tl-node.md-school .tl-tl-diamond, .tl-tl-node.md-school .tl-tl-dot { background: var(--violet-500); border-color: var(--violet-500); }
  .tl-tl-node.md-home .tl-tl-diamond, .tl-tl-node.md-home .tl-tl-dot { background: var(--orange-500); border-color: var(--orange-500); }
  .tl-tl-node.asmt { cursor: grab; }
  .tl-tl-node.asmt.dragging { opacity: .4; }
  .tl-tl-node.asmt.dragover .tl-tl-diamond { box-shadow: 0 0 0 4px var(--wash-cyan); }

  .tl-tl-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-200); }
  .tl-tl-legend span { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-600); }
  .tl-tl-legend i { width: 12px; height: 12px; border-radius: 3px; transform: rotate(45deg); background: var(--line-200); }
  .tl-tl-legend .completed i { background: var(--green-500); }
  .tl-tl-legend .inprogress i { background: var(--yellow-500); }
  .tl-tl-legend .active i { background: var(--cyan-500); }
  .tl-tl-legend .pending i, .tl-tl-legend .md-off i { background: var(--white); border: 2px solid var(--line-200); }
  .tl-tl-legend .md-school i { background: var(--violet-500); }
  .tl-tl-legend .md-home i { background: var(--orange-500); }

  /* ---- Control Room: needs-attention queue ---- */
  .tl-queue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .tl-queue { display: flex; align-items: center; gap: 13px; text-decoration: none; border: 1px solid var(--line-200); border-left: 4px solid var(--line-200); border-radius: var(--radius-md); padding: 14px 16px; transition: border-color .15s, background .15s; }
  .tl-queue:hover { background: var(--surface-100); }
  .tl-queue .q-ic { width: 34px; height: 34px; flex: none; border-radius: var(--radius-sm); display: grid; place-items: center; font-size: var(--fs-md); background: var(--surface-100); color: var(--ink-600); }
  .tl-queue .q-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .tl-queue .q-label { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-queue .q-sub { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  .tl-queue .q-count { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl); color: var(--ink-900); font-variant-numeric: tabular-nums; }
  .tl-queue .q-count.muted { color: var(--ink-300); }
  .tl-queue.crit { border-left-color: var(--danger-500); } .tl-queue.crit .q-ic { background: var(--danger-wash); color: var(--danger-700); } .tl-queue.crit .q-count { font-size: var(--fs-md); color: var(--danger-700); }
  .tl-queue.high { border-left-color: var(--warn-500); } .tl-queue.high .q-ic { background: var(--warn-wash); color: var(--warn-700); }
  .tl-queue.warn { border-left-color: var(--yellow-500); } .tl-queue.warn .q-ic { background: var(--wash-yellow); color: var(--lvl-2-ink); }
  .tl-queue.low  { border-left-color: var(--cyan-500); } .tl-queue.low .q-ic { background: var(--wash-cyan); color: var(--cyan-700); }
  .tl-queue.clear { border-left-color: var(--line-200); opacity: .72; }
  .tl-queue.clear .q-label { color: var(--ink-450); }
  .tl-allclear { background: var(--wash-green); color: var(--green-700); font-weight: 700; font-size: var(--fs-md); border-radius: var(--radius-card); padding: 16px 18px; margin-bottom: var(--page-gap); }

  /* ---- Activity / incident feed rows ---- */
  .tl-feed-row { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line-200); }
  .tl-feed-row:last-child { border-bottom: none; }
  .tl-feed-when { flex: none; width: 74px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-300); font-variant-numeric: tabular-nums; }
  .tl-feed-body { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-feed-body b { color: var(--ink-900); font-weight: 700; }

  /* ---- Tabs extras + view toggle + list group headings ---- */
  .ui-tabs.hub { margin-top: 8px; overflow-x: auto; }
  .ui-tab b { font-family: var(--font-heading); font-weight: 700; color: var(--ink-300); margin-left: 2px; }
  .ui-tab.on b { color: var(--green-700); }
  .tl-viewtoggle { margin-left: auto; display: flex; gap: 2px; }
  .tl-viewtoggle button { border: 1px solid var(--line-200); background: var(--white); width: 34px; height: 30px; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-450); font-size: var(--fs-md); }
  .tl-viewtoggle button.on { background: var(--wash-green); border-color: var(--green-500); color: var(--green-700); }
  .tl-listgroup-h { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); text-transform: uppercase; letter-spacing: .04em; margin: 0 2px 10px; display: flex; align-items: center; gap: 7px; }
  .tl-listgroup-h:not(:first-of-type) { margin-top: 22px; }
  .tl-listgroup-h b { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xs); color: var(--green-700); background: var(--wash-green); border-radius: var(--radius-pill); padding: 1px 9px; }

  /* ---- School grid cards ---- */
  .tl-school-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--page-gap); }
  .tl-school-card { background: var(--white); border: 1px solid var(--line-200); border-radius: var(--radius-card); padding: 18px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .tl-school-card:hover { border-color: var(--green-500); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .tl-school-card.is-group { border-color: var(--green-500); background: linear-gradient(180deg, var(--wash-green), var(--white) 55%); }
  .tl-school-card .sc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tl-school-card .sc-name { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .tl-school-card .sc-meta { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 5px; }
  .tl-school-card .sc-stats { display: flex; gap: 18px; margin: 14px 0 4px; }
  .tl-school-card .sc-stats b { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-lg); color: var(--ink-900); display: block; }
  .tl-school-card .sc-stats span { font-weight: 700; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-300); }
  .tl-school-card .sc-flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tl-school-card .sc-actions { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-200); }
  .tl-school-card .sc-open { margin-left: auto; font-weight: 700; font-size: var(--fs-sm); color: var(--green-700); }

  /* ---- School Detail Hub ---- */
  .tl-hub-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .tl-hub-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  /* change history: hub "Last updated" line, history school filter, group mode */
  .tl-hub-last { display: inline-flex; margin-top: 6px; padding: 0; border: none; background: none; font: inherit; text-align: left; cursor: pointer; border-radius: var(--radius-xs); }
  div.tl-hub-last { cursor: default; }
  button.tl-hub-last:hover .hist-last { color: var(--green-700); text-decoration: underline; }
  .tl-hist-school { width: auto; max-width: 240px; }
  .tl-lastcell { white-space: nowrap; font-size: var(--fs-sm); }
  .tl-group-title { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); background: none; border-color: transparent; padding-left: 4px; }
  .tl-tree { display: flex; flex-direction: column; gap: 8px; }
  .tl-tree-grade { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tl-tree-grade > b { min-width: 120px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-tree-sec { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-100); border-radius: var(--radius-sm); padding: 4px 10px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-tree-sec i { color: var(--ink-300); font-style: normal; margin-left: 4px; }
  /* Empty-structure countdown + auto-removed list (structure editor) */
  .tl-tree-ttl { font-style: normal; font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); margin-left: 6px; }
  .tl-tree-ttl.soon { color: var(--warn-700); background: var(--warn-wash); border-radius: var(--radius-pill); padding: 1px 7px; }
  .tl-tree-removed { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--line-200); display: flex; flex-direction: column; gap: 6px; }
  .tl-tree-removed-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-tree-removed-row small { color: var(--ink-450); font-weight: 600; }
  .tl-phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tl-phase { border: 1px solid var(--line-200); border-radius: var(--radius-md); padding: 14px; }
  .tl-phase .tp-name { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .tl-phase .tp-state { font-weight: 700; font-size: var(--fs-xs); margin-top: 4px; }
  .tl-phase .tp-win { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); margin-top: 6px; }
  .tl-phase .tp-comp { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); margin-top: 2px; }
  .tl-phase.muted { background: var(--surface-100); } .tl-phase.muted .tp-state { color: var(--ink-300); }
  .tl-phase.live .tp-state { color: var(--green-700); } .tl-phase.live { border-color: var(--green-500); }
  .tl-phase.done .tp-state { color: var(--ink-450); }
  .tl-phase.sched .tp-state { color: var(--cyan-700); }
  .tl-flagrow { display: flex; flex-wrap: wrap; gap: 8px; }
  .tl-settings { display: flex; flex-direction: column; gap: 10px; max-width: 340px; }
  .tl-linkrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-200); }
  .tl-linkrow:last-child { border-bottom: none; }
  .tl-linkrow b { display: block; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-linkrow .mono { display: block; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 2px; word-break: break-all; }
  .tl-inline-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- Add-School wizard ---- */
  .ws-board-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
  @media (max-width: 560px) { .ws-board-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .ws-board-opt { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line-200); border-radius: var(--radius-sm); font-weight: 600; font-size: var(--fs-md); color: var(--ink-700); cursor: pointer; }
  .ws-board-opt:has(input:checked) { border-color: var(--green-500); background: color-mix(in srgb, var(--green-500) 8%, var(--white)); color: var(--ink-900); }
  .ws-board-opt input { accent-color: var(--green-500); width: 16px; height: 16px; cursor: pointer; }
  /* Grades step: editable section counts + rename */
  .ws-grades { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .ws-grade-card { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 10px 8px 6px; border: 1px solid var(--line-200); border-radius: var(--radius-md); background: var(--white); }
  .ws-gradename { width: 118px; flex: 0 0 auto; font-family: inherit; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); border: 1px solid transparent; border-radius: var(--radius-sm); padding: 5px 8px; background: transparent; cursor: text; }
  .ws-gradename:hover { border-color: var(--line-200); background: var(--surface-100); }
  .ws-gradename:focus { outline: none; border-color: var(--focus); background: var(--white); box-shadow: 0 0 0 3px var(--wash-cyan); }
  .ws-secs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; min-width: 0; }
  .ws-sec { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-100); border-radius: var(--radius-sm); padding: 3px 6px 3px 9px; }
  .ws-sec-name { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); }
  .ws-secnum, .ws-gradenum { border: 1px solid var(--line-200); border-radius: var(--radius-xs); padding: 1px 4px; font: inherit; font-size: var(--fs-sm); font-weight: 700; color: var(--ink-700); text-align: center; -moz-appearance: textfield; }
  .ws-secnum { width: 46px; }
  .ws-gradenum { width: 52px; }
  .ws-secnum::-webkit-outer-spin-button, .ws-secnum::-webkit-inner-spin-button,
  .ws-gradenum::-webkit-outer-spin-button, .ws-gradenum::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .ws-secx { border: none; background: none; cursor: pointer; color: var(--ink-300); font-weight: 700; line-height: 1; padding: 0 2px; }
  .ws-secx:hover { color: var(--danger-700); }
  .ws-nosec { font-size: var(--fs-sm); color: var(--ink-300); font-style: italic; }
  .ws-gradenum-wrap { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; font-size: var(--fs-sm); font-weight: 700; color: var(--ink-600); }
  .ws-grade-actions { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; margin-left: auto; }
  .ws-add-sec { white-space: nowrap; }
  .ws-grade-del { background: none; border: none; color: var(--ink-300); font-family: inherit; font-weight: 700; font-size: var(--fs-sm); cursor: pointer; padding: 0; white-space: nowrap; }
  .ws-grade-del:hover { color: var(--danger-700); text-decoration: underline; }
  .ws-addbar { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px dashed var(--line-200); border-radius: var(--radius-md); background: var(--surface-100); }
  .ws-addbar-lbl { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-450); }
  .ws-presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .ws-newgrade-row { display: flex; gap: 8px; }
  .ws-total { margin-top: 12px; font-size: var(--fs-sm); color: var(--ink-450); }
  .ws-optional-note { align-items: center; margin-bottom: 14px; }
  .ws-review { display: flex; flex-direction: column; border: 1px solid var(--line-200); border-radius: var(--radius-card); overflow: hidden; }
  .ws-rev-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 14px; font-size: var(--fs-sm); }
  .ws-rev-row:nth-child(odd) { background: var(--surface-100); }
  .ws-rev-row > span { color: var(--ink-450); font-weight: 600; }
  .ws-rev-row > b { color: var(--ink-900); text-align: right; }
  /* "Creating the school…" transition (spinner = shared .spinner) */
  .tl-creating { text-align: center; padding: 44px 32px; }
  .tl-creating h3 { margin: 20px 0 6px; }
  .tl-creating .tl-muted { margin: 0; }
  .tl-creating-spin { width: 40px; height: 40px; margin: 0 auto; border-color: var(--surface-100); border-top-color: var(--green-700); animation-duration: .7s; }

  /* ---- Merge: suggestions + diff ---- */
  .tl-sugg { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line-200); border-radius: var(--radius-md); padding: 12px 15px; }
  .tl-sugg + .tl-sugg { margin-top: 10px; }
  .tl-sugg-body { flex: 1; min-width: 0; }
  .tl-sugg .ss-title { font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .tl-sugg .ss-vs { color: var(--ink-300); margin: 0 4px; }
  .tl-sugg .ss-meta { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 2px; }
  /* Diff table = ui-table compact; row headers read as labels, not column heads */
  .tl-difftable { min-width: 460px; }
  .tl-difftable tbody th { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-600); text-transform: none; letter-spacing: 0; white-space: normal; width: 130px; }
  .tl-difftable tr.diff td { background: var(--warn-wash); color: var(--warn-700); font-weight: 700; }
  .tl-smell { margin-left: 4px; }
  .tl-badge-gam { margin-left: 6px; }

  /* ---- Deployment planner (school Assessments tab) — configure & deploy per phase ---- */
  .dep-chains { display: flex; flex-direction: column; gap: 14px; }
  .dep-phase { border: 1px solid var(--line-200); border-radius: var(--radius-card); background: var(--surface-100); padding: 14px 16px; }
  /* Deployed phases read as live at a glance: green accent + tinted ground */
  .dep-phase.is-deployed { border-left: 4px solid var(--green-500); background: var(--wash-green); }
  .dep-phase-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .dep-phase-name { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .dep-phase-sum { font-weight: 700; font-size: var(--fs-xs); color: var(--ink-300); }
  .dep-dates { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
  .dep-date { font-family: var(--font-body); font-weight: 700; font-size: var(--fs-xs); color: var(--ink-600); background: var(--white); border: 1px solid var(--line-200); border-radius: var(--radius-sm); padding: 4px 7px; cursor: pointer; }
  .dep-date:focus { outline: none; border-color: var(--focus); }
  .dep-date-sep { color: var(--ink-300); font-weight: 700; }
  /* Lanes: mode tag + its own schedule on top, ordered assessments below */
  .dep-lane { padding: 11px 0; border-top: 1px solid var(--line-200); }
  .dep-lane:first-of-type { border-top: none; }
  .dep-lane-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dep-mode-tag { text-align: center; font-weight: 700; font-size: var(--fs-xs); letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: var(--radius-pill); }
  .dep-mode-tag.md-school { background: color-mix(in srgb, var(--violet-500) 14%, var(--white)); color: var(--violet-500); }
  .dep-mode-tag.md-home { background: var(--warn-wash); color: var(--warn-700); }
  .dep-mode-tag.md-off { background: var(--line-200); color: var(--ink-450); }
  .dep-lane-items { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; align-content: flex-start; border-radius: var(--radius-sm); }
