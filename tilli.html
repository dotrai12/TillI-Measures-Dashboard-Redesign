<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures — Internal</title>
<link rel="stylesheet" href="_ds/tilli/tokens/fonts.css?v=20261020nb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css?v=20261022a">
<style>
  /* ============================================================
     Tilli Measures — INTERNAL managing platform chrome.
     Shared chrome/components (side, header, cards, chips, tables,
     tabs, modals, toast…) come from the ui-* classes in tilli.css.
     This block only holds what is unique to the Platform Admin.
     A calm, operational cross-school surface for the Tilli Team.
     ============================================================ */
  :root { --tl-side-w: var(--side-w); --tl-header-h: 66px; --tl-maxw: 1200px; }
  body { background: var(--white); }   /* pure white, same as the teacher dashboard — cards keep their 1px border */

  .tl-app { min-height: 100dvh; display: grid; grid-template-columns: var(--tl-side-w) 1fr; }
  /* Mono text sits slightly smaller than the surrounding copy on this page */
  .tl-app .mono, #tl-modal-root .mono { font-size: .92em; }

  /* ---- Sidebar (ui-side + page bits) ---- */
  .tl-side .lockup { padding: 4px 8px 6px; }
  .tl-badge-int { margin: 0 8px 12px; align-self: flex-start; padding: 5px 12px; }
  .ui-nav-item.sub { padding: 8px 12px 8px 40px; font-size: var(--fs-sm); font-weight: 600; }
  .ui-nav-item.sub.on { font-weight: 700; }
  .tl-nav-head { display: flex; align-items: center; gap: 10px; margin: 12px 6px 2px; font-family: var(--font-body); font-weight: 700; font-size: var(--fs-xs); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-300); }
  .tl-nav-head .ic { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-450); }
  .tl-nav-head .ic svg { width: 16px; height: 16px; }
  .tl-nav-badge { margin-left: auto; background: var(--pink-400); color: var(--white); font-size: var(--fs-xs); font-weight: 700; border-radius: var(--radius-pill); padding: 1px 7px; min-width: 18px; text-align: center; }
  .ui-nav-item.on .tl-nav-badge { background: var(--green-500); }

  /* ---- Header (ui-header + search + account menu position) ---- */
  .tl-search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 9px; background: var(--surface-100); border: 1px solid var(--line-200); border-radius: var(--radius-pill); padding: 8px 15px; }
  .tl-search:focus-within { border-color: var(--focus); background: var(--white); }
  .tl-search .ic { color: var(--ink-300); display: grid; place-items: center; }
  .tl-search .ic svg { width: 17px; height: 17px; }
  .tl-search { position: relative; }
  /* School typeahead (#12) — top-bar search + Control Room finder */
  .tl-ta-menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40; max-height: 360px; overflow-y: auto; }
  .tl-ta-item { flex-direction: column; align-items: flex-start; gap: 2px; }
  .tl-ta-name { color: var(--ink-900); }
  .tl-ta-sub { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  .tl-ta-all { color: var(--accent-ink); border-top: 1px solid var(--line-200); border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
  .tl-ta-empty { padding: 10px; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); }
  .tl-findschool { position: relative; display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--line-200); border-radius: var(--radius-pill); padding: 12px 18px; margin-bottom: var(--page-gap); box-shadow: var(--shadow-card); }
  .tl-findschool:focus-within { border-color: var(--focus); }
  .tl-findschool .ic { color: var(--ink-300); display: grid; place-items: center; }
  .tl-findschool .ic svg { width: 19px; height: 19px; }
  .tl-findschool-in { flex: 1; border: none; outline: none; background: none; font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-md); color: var(--ink-900); }
  /* Ask Tilli full screen (#9 #10) — shared .askx layout from tilli.css; the main column goes full height */
  .tl-app.tl-ask-mode .tl-main { padding: 0; display: flex; height: 100dvh; min-height: 0; }   /* header is hidden on desktop */
  .tl-app.tl-ask-mode .tl-wrap { max-width: none; margin: 0; flex: 1; min-height: 0; display: flex; }
  .tl-ask-tbl { overflow-x: auto; margin: 8px 0; }
  .tl-ask-tbl table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
  .tl-ask-tbl th { text-align: left; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); text-transform: uppercase; letter-spacing: .03em; padding: 6px 8px; border-bottom: 1px solid var(--line-200); }
  .tl-ask-tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line-200); vertical-align: top; }
  .tl-ask-tbl small { color: var(--ink-450); font-weight: 600; }
  .tl-ask-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .tl-ask-src { margin-top: 8px; font-size: var(--fs-xs); font-weight: 700; color: var(--text-meta); }
  .tl-ask-more { font-weight: 600; color: var(--ink-450); margin: 4px 0 0; }
  .tl-ask-sugs { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .tl-ask-man { margin: 8px 0; padding: 10px 12px; background: var(--surface-100); border-radius: var(--radius-sm); }
  .tl-ask-man ol { margin: 6px 0; padding-left: 18px; }
  /* Knowledge Base → Manuals (#11) */
  .tl-kb { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: var(--page-gap); align-items: start; }
  .tl-kb-side { display: flex; flex-direction: column; gap: 10px; }
  .tl-kb-list { display: flex; flex-direction: column; gap: 2px; }
  .tl-kb-item { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; border-radius: var(--radius-sm); text-decoration: none; }
  .tl-kb-item b { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-kb-item span { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  .tl-kb-item:hover, .tl-kb-item.on { background: var(--surface-100); }
  .tl-kb-item.on b { color: var(--green-700); }
  .tl-kb-title { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl); color: var(--ink-900); margin: 4px 0 6px; }
  .tl-kb-steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
  .tl-kb-steps li { font-weight: 600; font-size: var(--fs-md); color: var(--ink-700); line-height: 1.5; }
  @media (max-width: 760px) { .tl-kb { grid-template-columns: 1fr; } }
  /* Completion ranking → School groups: sub-line under a number / lowest-school % */
  .tl-rank-small td small { display: block; font-weight: 600; font-size: var(--fs-xs); color: var(--text-meta); margin-top: 2px; }
  /* Change History date range */
  .tl-hist-range { gap: 10px 14px; }
  .tl-hist-dates { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .tl-hist-dates[hidden] { display: none; }
  .tl-hist-dates label { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-hist-dates .input { width: auto; padding-top: 7px; padding-bottom: 7px; }
  /* Pager (Students tab) */
  .tl-pager { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 14px; }
  .tl-pager-info { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); }
  .tl-pager-info b { font-weight: 700; color: var(--ink-900); }
  .tl-pager-size { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-pager-size .select { width: auto; padding-top: 6px; padding-bottom: 6px; }
  .tl-pager-nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .tl-pg { min-width: 36px; height: 36px; padding: 0 10px; border: 1px solid var(--line-200); background: var(--white); border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-body); font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); }
  .tl-pg:hover:not([disabled]):not(.on) { border-color: var(--green-500); color: var(--green-700); }
  .tl-pg.on { background: var(--green-500); border-color: var(--green-500); color: var(--white); }
  .tl-pg[disabled] { opacity: .4; cursor: default; }
  .tl-pg-gap { padding: 0 4px; color: var(--ink-450); font-weight: 700; }
  @media (max-width: 640px) { .tl-pager-nav { margin-left: 0; width: 100%; } }
  /* Help: ⓘ tooltips, ? Help panel, FAQ */
  .tl-tip { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 6px; border-radius: 50%; border: 1.5px solid var(--ink-300); color: var(--ink-450); font-family: var(--font-heading); font-style: normal; font-weight: 700; font-size: 10px; line-height: 1; text-transform: none; letter-spacing: 0; vertical-align: middle; cursor: help; user-select: none; }
  .tl-tip:hover, .tl-tip:focus-visible { border-color: var(--green-500); color: var(--green-700); outline: none; }
  .ui-screen-title .tl-tip { width: 18px; height: 18px; font-size: 11px; vertical-align: 4px; }
  .tl-tipbox { position: absolute; z-index: 120; max-width: 280px; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--ink-900); color: var(--white); font-weight: 600; font-size: var(--fs-sm); line-height: 1.45; box-shadow: var(--shadow-pop); pointer-events: none; opacity: 0; transition: opacity .12s; }
  .tl-tipbox.show { opacity: 1; }
  .tl-help-btn { font-weight: 700; }
  .tl-help { position: fixed; inset: 0; z-index: 90; }
  .tl-help-scrim { position: absolute; inset: 0; border: none; background: rgba(20, 20, 20, .25); cursor: pointer; }
  .tl-help-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--white); box-shadow: var(--shadow-pop); padding: 22px 22px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .tl-help-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .tl-help-h h2 { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl); color: var(--ink-900); margin: 2px 0 0; }
  .tl-help-x { border: none; background: none; font-size: 26px; line-height: 1; color: var(--ink-450); cursor: pointer; padding: 2px 6px; }
  .tl-help-ask { display: flex; gap: 8px; margin-bottom: 6px; }
  .tl-help-ask .input { flex: 1; min-width: 0; }
  .tl-help-answer:empty { display: none; }
  .tl-help-answer { padding: 12px; margin-bottom: 8px; background: var(--surface-100); border-radius: var(--radius-md); font-size: var(--fs-sm); }
  .tl-help-answer .tl-faq { background: var(--white); }
  .tl-help-more { margin-top: 8px; }
  .tl-help-sec { font-weight: 700; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-450); margin: 10px 0 4px; }
  .tl-help-foot { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-200); }
  .tl-faq { border: 1px solid var(--line-200); border-radius: var(--radius-sm); padding: 0 12px; margin-bottom: 6px; background: var(--white); }
  .tl-faq summary { cursor: pointer; padding: 11px 0; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-faq[open] summary { color: var(--green-700); }
  .tl-faq p { margin: 0 0 12px; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); line-height: 1.5; }
  .tl-faq-topic { margin-bottom: 10px; }
  /* Deployment status (data-driven): Scheduled / Live / Ended / Completed / Not deployed */
  .dep-phase-when { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin: -4px 0 10px; }
  .dep-phase-when.st-scheduled { color: var(--cyan-700); }
  .dep-phase-when.st-live { color: var(--green-700); }
  .dep-phase-when.st-completed { color: var(--green-700); font-weight: 700; }
  .dep-dates label { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }
  /* Planner tabs + audience rows */
  .dep-tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line-200); margin-bottom: 14px; }
  .dep-tab { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; background: none; border: none; border-bottom: 3px solid transparent; padding: 8px 16px 9px; cursor: pointer; font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); color: var(--ink-600); }
  .dep-tab:hover { color: var(--ink-900); }
  .dep-tab.on { color: var(--ink-900); border-bottom-color: var(--green-500); }
  .dep-tab-st { font-family: var(--font-body); font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }
  .dep-tab-st.st-live, .dep-tab-st.st-completed { color: var(--green-700); }
  .dep-tab-st.st-scheduled { color: var(--cyan-700); }
  .dep-aud { padding: 12px 0; border-top: 1px solid var(--line-200); }
  /* "Parents take part" setting above the phase tabs (drives where My School Check-in runs). */
  .dep-parents { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 14px; margin-bottom: 14px; border: 1px solid var(--line-200); border-radius: var(--radius-md); background: var(--surface-100); }
  .dep-parents-txt { display: flex; flex-direction: column; gap: 2px; }
  .dep-parents-txt b { font-size: var(--fs-sm); color: var(--ink-900); }
  .dep-parents-txt span { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-450); }
  .dep-parents-txt .dep-parents-lock { color: var(--warn-700); }
  .dep-rule { margin: 0 0 12px; }
  .dep-node.is-checkin { border-style: dashed; }
  .dep-aud-h { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 9px; }
  .dep-aud-st { font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }
  .dep-aud-st.st-live, .dep-aud-st.st-completed { color: var(--green-700); }
  .dep-aud-st.st-scheduled { color: var(--cyan-700); }
  .dep-aud-rule { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  .dep-place-tag { font-weight: 700; font-size: var(--fs-xs); letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: var(--radius-pill); }
  .dep-place-tag.md-school { background: color-mix(in srgb, var(--violet-500) 14%, var(--white)); color: var(--violet-500); }
  .dep-place-tag.md-home { background: var(--warn-wash); color: var(--warn-700); }
  .dep-sub { padding: 8px 0 4px; }
  .dep-sub + .dep-sub { border-top: 1px dashed var(--line-200); margin-top: 6px; }
  .dep-group.is-empty { display: none; }
  .is-dragging .dep-group.is-empty { display: grid; }
  .dep-group { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: start; gap: 10px; margin-top: 8px; }
  .dep-group-l { padding-top: 9px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); cursor: help; }
  .dep-where-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .dep-where-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 14px; border: 1px solid var(--line-200); border-radius: var(--radius-md); background: var(--white); cursor: pointer; font-family: var(--font-body); }
  .dep-where-opt:hover, .dep-where-opt.on { border-color: var(--green-500); background: var(--wash-green); }
  .dep-where-opt b { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .dep-where-opt span:last-child { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  @media (max-width: 560px) { .dep-group { grid-template-columns: 1fr; gap: 4px; } .dep-group-l { padding-top: 0; } }
  .dep-aud-items { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 36px; border-radius: var(--radius-sm); }
  .dep-aud-items.dragover { box-shadow: inset 0 0 0 2px var(--green-500); background: var(--wash-green); }
  .dep-arrow { color: var(--ink-300); font-weight: 700; }
  .dep-where { font-weight: 700; font-size: var(--fs-xs); padding: 2px 8px; border-radius: var(--radius-pill); }
  .dep-where.md-school { background: color-mix(in srgb, var(--violet-500) 14%, var(--white)); color: var(--violet-500); }
  .dep-where.md-home { background: var(--warn-wash); color: var(--warn-700); }
  .dep-off { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line-200); }
  .dep-off summary { cursor: pointer; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-450); }
  .dep-off-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .dep-offitem { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px dashed var(--line-200); border-radius: var(--radius-sm); font-weight: 600; font-size: var(--fs-xs); color: var(--ink-600); }
  .dep-pop-note { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); max-width: 240px; }
  .tl-tpl-card .tt-where { color: var(--ink-450); font-weight: 600; }
  .tl-nd-where { margin: -4px 0 0; }
  /* Group links (#7) */
  .tl-grouplinks { padding: 10px 0; border-top: 1px solid var(--line-200); }
  .tl-grouplinks:first-of-type { border-top: none; }
  .tl-grouplinks-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .tl-grouplinks-h b { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-grouplinks-h span { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  /* Teacher assessment log (#1) */
  /* Archived group notice (#13) */
  .tl-archived-notice { max-width: 620px; margin: 40px auto; text-align: left; }
  .tl-archived-notice .ui-screen-title { margin: 6px 0 10px; }
  /* Issues by school (#17) */
  .tl-issue-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: var(--page-gap); }
  .tl-issue-strip .ui-eyebrow { margin-right: 4px; }
  .tl-issue-strip .ui-filterchip b { font-weight: 700; color: var(--danger-700); margin-left: 4px; }
  .tl-issue-chip { border: none; cursor: pointer; font-family: var(--font-body); }
  td.name .tl-issue-chip { margin-left: 6px; vertical-align: middle; }
  .tl-search input { flex: 1; border: none; background: none; outline: none; font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-h-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  /* Header avatar is the account entry only when the sidebar (and its profile) is hidden. */
  .tl-header .tl-acct-m { display: none; }
  .tl-header-bare { display: none; }   /* Super Admin, desktop: nothing to show */

  /* ---- Main ---- */
  .tl-main { padding: var(--page-gap) clamp(16px, 3vw, 32px) 96px; }
  .tl-wrap { max-width: var(--tl-maxw); margin: 0 auto; }

  /* ---- Screen head with right-aligned actions ---- */
  .tl-screen-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: var(--page-gap); }
  .tl-screen-head .ui-screen-title, .tl-screen-head .ui-screen-sub { margin: 0; }
  .tl-screen-head .ui-screen-sub { margin-top: 3px; }
  .tl-screen-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .tl-mini-head { margin: calc(var(--page-gap) + 4px) 0 10px; }

  /* ---- KPI tiles (ui-card tight ui-kpi) ---- */
  .tl-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--page-gap); margin-bottom: var(--page-gap); }
  .tl-kpis.four, .tl-kpis.five { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tl-kpis.five { margin-bottom: 6px; }
  .tl-kpi .num { display: flex; align-items: baseline; gap: 8px; }
  a.tl-kpi { text-decoration: none; display: block; }
  .tl-kpi-delta { font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 700; color: var(--green-700); background: var(--wash-green); border-radius: var(--radius-pill); padding: 2px 8px; }

  /* ---- Layout grids ---- */
  .tl-grid { display: grid; gap: var(--page-gap); }
  .tl-grid.two { grid-template-columns: 1fr 1fr; }
  .tl-stack { display: flex; flex-direction: column; gap: 12px; }
  /* Side-by-side form fields (Country / City, Audience / Phase…) */
  .tl-fieldrow { display: flex; gap: 10px; }
  /* Numbered step layout: a circular badge sits to the LEFT of a card. */
  .tl-stepcard { display: flex; align-items: flex-start; gap: 14px; }
  .tl-stepcard > .ui-card { flex: 1; min-width: 0; }
  .tl-stepnum { flex: none; width: 30px; height: 30px; border-radius: 50%; margin-top: clamp(16px, 2vw, 22px);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md);
    background: var(--green-700); color: var(--white); }
  @media (max-width: 620px) { .tl-stepnum { margin-top: 15px; width: 26px; height: 26px; font-size: var(--fs-sm); } }
  /* Role capability hint shown under a role picker (invite / role editor). */
  .tl-rolecap { display: block; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 6px; line-height: 1.4; }
  .tl-num { font-variant-numeric: tabular-nums; }

  .dep-node.md-home { border-left-color: var(--orange-500); }
  .dep-node.is-live { background: var(--wash-green); border-color: color-mix(in srgb, var(--green-500) 30%, var(--white)); }
  .dep-ord { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: 0 0 auto; border-radius: 50%; background: var(--surface-100); color: var(--ink-450); font-weight: 700; font-size: var(--fs-xs); }
  .dep-item-menu { background: none; border: none; cursor: pointer; color: var(--ink-300); font-size: var(--fs-md); line-height: 1; padding: 2px 4px; border-radius: var(--radius-xs); }
  .dep-item-menu:hover { color: var(--ink-700); background: var(--surface-100); }
  /* Off = parked, not deployed: quiet dashed chips so running work stays loudest */
  /* Per-item ⋯ menu (ui-menu, positioned by JS) — move / deploy one / end one */
  .dep-pop { position: absolute; z-index: 60; }
  .dep-pop-h { padding: 6px 8px 8px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep-pop .ui-menu-item[disabled] { opacity: .4; cursor: default; background: none; color: var(--ink-600); }
  .dep-pop .ui-menu-item.danger { color: var(--pink-600); }
  .dep-pop-sep { height: 1px; background: var(--line-200); margin: 5px 4px; }
  .dep-swatch { width: 12px; height: 12px; flex: 0 0 auto; border-radius: 3px; transform: rotate(45deg); }
  .dep-swatch.md-school { background: var(--violet-500); }
  .dep-swatch.md-home { background: var(--orange-500); }

  /* ---- Student report (skill scores / perspective / progress) ---- */
  .sr-secthead { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .sr-secthead .ic { width: 22px; height: 22px; flex: none; }
  .sr-secthead h3 { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-lg); color: var(--ink-900); margin: 0; }
  .sr-skill { display: flex; align-items: center; gap: 14px; padding: 13px 15px; border: 1px solid var(--line-200); border-radius: var(--radius-card); margin-bottom: 10px; background: var(--white); }
  .sr-skill:last-child { margin-bottom: 0; }
  .sr-skill .sr-sk-body { flex: 1; min-width: 0; }
  .sr-skill .sr-sk-name { font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .sr-skill .sr-sk-desc { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 2px; }
  .sr-skill .sr-sk-pct { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); color: var(--ink-600); min-width: 40px; text-align: right; }
  .sr-radar-wrap { display: flex; flex-direction: column; align-items: center; }
  .sr-legend { justify-content: center; }

  /* ---- Templates grid ---- */
  /* Grid / List toggle sits at the right end of the Active / Archived tab strip. */
  .tl-layoutseg { margin-left: auto; padding: 3px; }
  .tl-layoutseg button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; }
  .tl-layoutseg svg { width: 15px; height: 15px; }
  /* List view */
  .tl-tpl-table td { vertical-align: top; }
  /* Template actions modal: chips under the name, Edit-led action row, quiet Archive / Delete */
  .tl-tm-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: -4px 0 16px; }
  .tl-tm-phase { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-600); }
  .tl-tm-main { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .tl-tm-main .btn svg, .tl-tm-del svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
  .tl-tm-main .btn { display: inline-flex; align-items: center; }
  .tl-tm-sub { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-200); }
  /* ---- Template builder (#/template) ---- */
  :root {
    --tb-max: 1040px;                  /* width of the builder column */
    --tb-accent-w: 4px;                /* coloured left edge of each question card */
    --tb-section: var(--ink-300);      /* Section Break colour (edge + swatch) */
    --tb-mc: var(--green-500);         /* Multiple Choice colour */
    --tb-text: var(--cyan-500);        /* Short Answer colour */
    --tb-thumb-w: 220px;               /* media attachment thumbnail width */
  }
  .tb-head { display: flex; align-items: flex-start; gap: 12px; max-width: var(--tb-max); margin-bottom: 18px; flex-wrap: wrap; }
  .tb-back { margin-top: 4px; }
  .tb-head-txt { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 2px; }
  .tb-name, .tb-tdesc { border: 1px solid transparent; background: none; border-radius: var(--radius-sm); padding: 4px 8px; margin-left: -8px; font: inherit; color: var(--ink-900); width: 100%; box-sizing: border-box; }
  .tb-name { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl, 24px); }
  .tb-tdesc { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-450); }
  .tb-name:hover, .tb-tdesc:hover { border-color: var(--line-200); }
  .tb-name:focus, .tb-tdesc:focus { outline: none; border-color: var(--focus); background: var(--white); }
  .tb-head .tl-tm-chips { margin: 6px 0 0; }
  .tb-saved { font-size: var(--fs-xs); font-weight: 700; color: var(--green-700); }
  .tb-head-act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-head-act .btn svg { width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; }
  .tb-phases { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
  .tb-phases-l { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-450); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
  .tb-ph { border: 1px solid var(--line-200); background: var(--white); font: inherit; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); padding: 7px 16px; border-radius: var(--radius-pill); cursor: pointer; }
  .tb-ph b { margin-left: 4px; color: var(--ink-300); }
  .tb-ph.on { background: var(--green-600); border-color: var(--green-600); color: var(--white); }
  .tb-ph.on b { color: rgba(255,255,255,.8); }
  .tb-ph:disabled { opacity: .45; cursor: not-allowed; border-style: dashed; }
  .tb-tabs { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 14px; background: var(--surface-100); border-radius: var(--radius-md); }
  .tb-tab { border: none; background: none; font: inherit; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-450); padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; }
  .tb-tab.on { background: var(--white); color: var(--ink-900); box-shadow: var(--shadow-card); }
  .tb-tab b { margin-left: 4px; color: var(--ink-300); }
  .tb-langs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: var(--tb-max); padding: 10px; margin-bottom: 14px; border: 1px solid var(--line-200); border-radius: var(--radius-md); background: var(--white); }
  .tb-lang { border: 1px solid var(--line-200); background: var(--white); font: inherit; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); padding: 7px 14px; border-radius: var(--radius-pill); cursor: pointer; }
  .tb-lang.on { background: var(--green-600); border-color: var(--green-600); color: var(--white); }
  .tb-addlang { border: none; background: none; font: inherit; font-weight: 700; font-size: var(--fs-sm); color: var(--green-700); padding: 7px 10px; cursor: pointer; }
  .tb-tools { max-width: var(--tb-max); display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .tb-list { display: flex; flex-direction: column; gap: 14px; max-width: var(--tb-max); }
  .tb-card { --tb-c: var(--tb-mc); background: var(--white); border: 1px solid var(--line-200); border-left: var(--tb-accent-w) solid var(--tb-c); border-radius: var(--radius-md); padding: 14px 18px; }
  .tb-card.t-section { --tb-c: var(--tb-section); }
  .tb-card.t-text { --tb-c: var(--tb-text); }
  .tb-card.dragging { opacity: .45; }
  .tb-card.drop-before { box-shadow: 0 -3px 0 var(--green-500); }
  .tb-card-h { display: flex; align-items: center; gap: 10px; }
  .tb-drag { display: grid; place-items: center; width: 20px; color: var(--ink-300); cursor: grab; }
  .tb-drag svg { width: 18px; height: 18px; }
  .tb-swatch { width: 22px; height: 22px; border-radius: 6px; background: var(--tb-c); flex: none; }
  .tb-type { font-size: var(--fs-xs); font-weight: 700; padding: 3px 10px; border: 1px solid var(--line-200); border-radius: var(--radius-pill); color: var(--ink-700); white-space: nowrap; }
  .tb-num { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-450); }
  .tb-peek { flex: 1; min-width: 0; border: none; background: none; font: inherit; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; padding: 4px 0; }
  .tb-req { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-450); }
  .tb-peek + .tb-req { margin-left: 0; }
  .tb-ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border: none; border-radius: var(--radius-sm); background: none; color: var(--ink-450); cursor: pointer; }
  .tb-ic:hover:not(:disabled) { background: var(--surface-100); color: var(--ink-900); }
  .tb-ic:disabled { opacity: .35; cursor: default; }
  .tb-ic svg { width: 18px; height: 18px; }
  .tb-card.is-closed .tb-chev svg { transform: rotate(180deg); }
  .tb-body { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .tb-title, .tb-desc { width: 100%; box-sizing: border-box; border: 1px solid transparent; background: var(--surface-100); border-radius: var(--radius-sm); padding: 10px 12px; font: inherit; color: var(--ink-900); }
  .tb-title { font-weight: 700; font-size: var(--fs-md); }
  .tb-desc { font-size: var(--fs-sm); resize: vertical; min-height: 44px; }
  .tb-title:focus, .tb-desc:focus { outline: none; border-color: var(--focus); background: var(--white); }
  .tb-label { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-450); margin-top: 4px; }
  .tb-opts { display: flex; flex-direction: column; gap: 8px; }
  .tb-opt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-opt > .input:not(.tb-score) { flex: 1; min-width: 160px; }
  .tb-radio { width: 18px; height: 18px; flex: none; border: 2px solid var(--line-200); border-radius: 50%; }
  .tb-score { width: 92px; flex: none; }
  .tb-optimg { flex-basis: 100%; padding-left: 26px; }
  .tb-optimg img { max-height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--line-200); }
  .tb-addopt { align-self: flex-start; }
  .tb-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-200); }
  .tb-row > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .tb-row b { font-size: var(--fs-sm); color: var(--ink-900); }
  .tb-row span { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-450); }
  .tb-secs { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-450); }
  .tb-secs .input { width: 72px; }
  .tb-textans { padding: 10px 12px; border: 1px dashed var(--line-200); border-radius: var(--radius-sm); font-size: var(--fs-sm); color: var(--ink-300); font-weight: 600; }
  .tb-media-row { display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line-200); }
  .tb-media-row > span { display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: var(--fs-sm); font-weight: 700; color: var(--ink-450); }
  .tb-media-row svg { width: 17px; height: 17px; }
  .tb-media-row .input { flex: 1; min-width: 0; }
  .tb-body > .btn svg { width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; }
  .tb-body > .btn { align-self: flex-start; }
  .tb-thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
  .tb-thumb { position: relative; width: var(--tb-thumb-w); height: 120px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--line-200); background: var(--surface-100); display: grid; place-items: center; }
  .tb-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .tb-thumb-ic svg { width: 32px; height: 32px; color: var(--ink-300); }
  .tb-thumb-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font-size: var(--fs-xs); font-weight: 600; color: var(--white); background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  .tb-thumb-x { position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,.9); }
  .tb-fold { border-top: 1px solid var(--line-200); padding-top: 10px; }
  .tb-fold summary { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 700; color: var(--ink-600); cursor: pointer; list-style: none; padding: 4px 0; }
  .tb-fold summary::-webkit-details-marker { display: none; }
  .tb-fold summary svg { width: 17px; height: 17px; color: var(--ink-450); }
  .tb-badge { font-size: var(--fs-xs); font-weight: 700; color: var(--green-700); background: var(--wash-green); padding: 2px 8px; border-radius: var(--radius-sm); }
  .tb-fold-b { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 4px 25px; }
  .tb-cond { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-600); }
  .tb-cond .select { max-width: 420px; }
  .tb-skills { display: flex; flex-wrap: wrap; gap: 8px; }
  .tb-skill { border: 1px solid var(--line-200); background: var(--surface-100); font: inherit; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-600); padding: 7px 14px; border-radius: var(--radius-pill); cursor: pointer; }
  .tb-skill:hover { border-color: var(--green-500); }
  .tb-skill.on { background: var(--green-600); border-color: var(--green-600); color: var(--white); }
  .tb-add { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: var(--tb-max); margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--line-200); border-radius: var(--radius-md); }
  .tb-add > span { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-450); margin-right: 4px; }
  .tb-unscored { margin: 0; padding-left: 20px; font-size: var(--fs-sm); color: var(--ink-600); line-height: 1.8; }
  .tb-pv { display: flex; flex-direction: column; gap: 14px; max-height: 60vh; overflow-y: auto; }
  .tb-pv-sec h4 { margin: 4px 0; font-family: var(--font-heading); }
  .tb-pv-sec p, .tb-pv-q p { margin: 4px 0; font-size: var(--fs-sm); color: var(--ink-450); }
  .tb-pv-q { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line-200); }
  .tb-pv-q .ui-chip { align-self: flex-start; }
  .tb-pv-req { color: var(--danger-700); }
  .tb-pv-opts { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
  @media (max-width: 640px) { .tb-card { padding: 12px; } .tb-req { font-size: 0; } .tb-media-row { flex-direction: column; align-items: stretch; } .tb-fold-b { padding-left: 0; } }
  /* Phase tick-boxes in the template editor (a template can be used in any set of phases) */
  .tl-phasepick { border: none; margin: 0; padding: 0; min-width: 0; }
  .tl-phasepick legend { padding: 0; margin-bottom: 7px; }
  .tl-phasepick legend .tl-muted { font-weight: 600; }
  .tl-phasepick > div { display: flex; flex-wrap: wrap; gap: 8px; }
  .tl-phasepick label { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border: 1px solid var(--line-200); border-radius: var(--radius-pill); font-weight: 700; cursor: pointer; }
  .tl-phasepick label:has(input:checked) { border-color: var(--green-500); background: var(--wash-green); color: var(--green-700); }
  .tl-phasepick input { accent-color: var(--green-600); margin: 0; }
  /* Template name = link into its editor (list + grid) */
  .tl-tpl-name { padding: 0; border: none; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .tl-tpl-name:hover { color: var(--green-700); text-decoration: underline; text-underline-offset: 3px; }
  .tl-tpl-name:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  /* Sortable column headers (button fills the th; ↕ idle, ▲/▼ active) */
  .tl-sortbtn { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: none; background: none; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; white-space: nowrap; }
  .tl-sortbtn:hover, .tl-sortbtn.on { color: var(--green-700); }
  .tl-sortbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .tl-sort-ic { font-size: 9px; color: var(--ink-300); }
  .tl-sortbtn.on .tl-sort-ic { color: var(--green-700); }
  .tl-tpl-table td.name small { max-width: 360px; white-space: normal; }
  .tl-tpl-table .tt-badges { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  /* Audience chips (Templates grid + list). bg = chip fill, fg = text + icon. */
  :root {
    --aud-teacher-bg: var(--wash-green);                                       --aud-teacher-fg: var(--green-700);
    --aud-parent-bg: color-mix(in srgb, var(--pink-600) 11%, var(--white));    --aud-parent-fg: color-mix(in srgb, var(--pink-600) 72%, black);
    --aud-direct-bg: var(--wash-cyan);                                         --aud-direct-fg: color-mix(in srgb, var(--cyan-700) 85%, black);
    --aud-chip-icon: 14px;   /* icon size inside an audience chip */
  }
  .tl-audchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px; border-radius: var(--radius-pill); font-weight: 700; font-size: var(--fs-xs); line-height: 1.4; white-space: nowrap; background: var(--surface-100); color: var(--ink-600); }
  .tl-audchip svg { width: var(--aud-chip-icon); height: var(--aud-chip-icon); flex: none; }
  .tl-audchip.a-teacher     { background: var(--aud-teacher-bg);     color: var(--aud-teacher-fg); }
  .tl-audchip.a-parent      { background: var(--aud-parent-bg);      color: var(--aud-parent-fg); }
  .tl-audchip.a-direct      { background: var(--aud-direct-bg);      color: var(--aud-direct-fg); }
  .tl-tpl-meta { font-size: var(--fs-xs); color: var(--ink-450); min-width: 180px; }
  .tl-tpl-table tr.is-archived td { opacity: .7; }
  @media (max-width: 640px) { .tl-layoutseg button span { display: none; } }
  .tl-tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--page-gap); }
  .tl-tpl-card { background: var(--white); border: 1px solid var(--line-200); border-radius: var(--radius-card); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .tl-tpl-card .tt-top { display: flex; align-items: center; justify-content: space-between; }
  .tl-tpl-card .tt-title { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .tl-tpl-card .tt-desc { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); flex: 1; }
  .tl-tpl-card .tt-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--line-200); }
  .tl-tpl-card .tt-phase { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); }
  /* Template versions + metadata + archive (#4 #5 #6) */
  .tl-tpl-card .tt-badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .tl-tpl-card .tt-meta { font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); }
  .tl-tpl-card.is-archived { background: var(--surface-100); }
  .tl-tpl-card.is-archived .tt-title { color: var(--ink-600); }
  .tl-nd-older { color: var(--warn-700); margin: -4px 0 0; }

  /* ---- Auto-crash grouping ---- */
  .tl-crashes summary { cursor: pointer; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600); padding: 4px 0; }
  .tl-crashes summary b { color: var(--ink-900); }
  .tl-crashes[open] summary { margin-bottom: 10px; }

  /* ---- Search results ---- */
  .tl-searchrow { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; background: none; border: none; cursor: pointer; padding: 10px 8px; border-radius: var(--radius-sm); border-bottom: 1px solid var(--line-200); }
  .tl-searchrow:last-child { border-bottom: none; }
  .tl-searchrow:hover { background: var(--surface-100); }
  .tl-searchrow b { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-searchrow span { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); }
  .tl-count { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-sm); color: var(--ink-300); }

  /* ---- Toggle rows (publish / access / entry-points; switch = ui-switch) ---- */
  .tl-toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-200); }
  .tl-toggle-row:last-child { border-bottom: none; }
  .tl-toggle-row .tr-body { flex: 1; min-width: 0; }
  .tl-toggle-row .tr-body b { display: block; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .tl-toggle-row .tr-body span { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); }

  /* ---- Skill tags (SEL / Cognitive / EF; tags = ui-chip) ---- */
  .tl-skilltags { display: flex; flex-wrap: wrap; gap: 6px; }
