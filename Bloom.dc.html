<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ wrap }}">
  <svg width="{{ w }}" height="{{ w }}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">

    <sc-if value="{{ isExpert }}">
      <g>
        <g fill="currentColor">
          <sc-if value="{{ v1 }}">
            <g>
              <g transform="rotate(0 50 50)"><ellipse cx="50" cy="22" rx="17" ry="24"></ellipse></g>
              <g transform="rotate(72 50 50)"><ellipse cx="50" cy="22" rx="17" ry="24"></ellipse></g>
              <g transform="rotate(144 50 50)"><ellipse cx="50" cy="22" rx="17" ry="24"></ellipse></g>
              <g transform="rotate(216 50 50)"><ellipse cx="50" cy="22" rx="17" ry="24"></ellipse></g>
              <g transform="rotate(288 50 50)"><ellipse cx="50" cy="22" rx="17" ry="24"></ellipse></g>
            </g>
          </sc-if>
          <sc-if value="{{ v2 }}">
            <g>
              <g transform="rotate(0 50 50)"><ellipse cx="50" cy="26" rx="15" ry="21"></ellipse></g>
              <g transform="rotate(60 50 50)"><ellipse cx="50" cy="26" rx="15" ry="21"></ellipse></g>
              <g transform="rotate(120 50 50)"><ellipse cx="50" cy="26" rx="15" ry="21"></ellipse></g>
              <g transform="rotate(180 50 50)"><ellipse cx="50" cy="26" rx="15" ry="21"></ellipse></g>
              <g transform="rotate(240 50 50)"><ellipse cx="50" cy="26" rx="15" ry="21"></ellipse></g>
              <g transform="rotate(300 50 50)"><ellipse cx="50" cy="26" rx="15" ry="21"></ellipse></g>
            </g>
          </sc-if>
          <sc-if value="{{ v3 }}">
            <g>
              <g transform="rotate(0 50 50)"><path d="M50 50 C34 44 30 20 42 10 C54 4 62 26 50 50 Z"></path></g>
              <g transform="rotate(72 50 50)"><path d="M50 50 C34 44 30 20 42 10 C54 4 62 26 50 50 Z"></path></g>
              <g transform="rotate(144 50 50)"><path d="M50 50 C34 44 30 20 42 10 C54 4 62 26 50 50 Z"></path></g>
              <g transform="rotate(216 50 50)"><path d="M50 50 C34 44 30 20 42 10 C54 4 62 26 50 50 Z"></path></g>
              <g transform="rotate(288 50 50)"><path d="M50 50 C34 44 30 20 42 10 C54 4 62 26 50 50 Z"></path></g>
            </g>
          </sc-if>
        </g>
        <circle cx="50" cy="50" r="15" fill="#FFFFFF" opacity="0.55"></circle>
        <circle cx="50" cy="50" r="11" fill="#F2CE7B"></circle>
      </g>
    </sc-if>

    <sc-if value="{{ isLearner }}">
      <g>
        <g fill="currentColor">
          <g transform="rotate(0 50 50)"><ellipse cx="50" cy="31" rx="13" ry="18"></ellipse></g>
          <g transform="rotate(72 50 50)"><ellipse cx="50" cy="31" rx="13" ry="18"></ellipse></g>
          <g transform="rotate(144 50 50)"><ellipse cx="50" cy="31" rx="13" ry="18"></ellipse></g>
          <g transform="rotate(216 50 50)"><ellipse cx="50" cy="31" rx="13" ry="18"></ellipse></g>
          <g transform="rotate(288 50 50)"><ellipse cx="50" cy="31" rx="13" ry="18"></ellipse></g>
        </g>
        <circle cx="50" cy="50" r="9.5" fill="#FFFFFF" opacity="0.5"></circle>
        <circle cx="50" cy="50" r="6.5" fill="#F2CE7B"></circle>
      </g>
    </sc-if>

    <sc-if value="{{ isBeginner }}">
      <g>
        <path d="M50 78 C38 74 36 62 44 56" stroke="#4E8C42" stroke-width="7" stroke-linecap="round" fill="none"></path>
        <ellipse cx="50" cy="46" rx="19" ry="24" fill="currentColor"></ellipse>
        <path d="M31 52 C36 62 44 68 52 69" stroke="#4E8C42" stroke-width="8" stroke-linecap="round" fill="none"></path>
      </g>
    </sc-if>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:100,&quot;height&quot;:100},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;expert&quot;,&quot;learner&quot;,&quot;beginner&quot;],&quot;default&quot;:&quot;expert&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFFFFF&quot;,&quot;options&quot;:[&quot;#FFFFFF&quot;,&quot;#F0A84A&quot;,&quot;#EFA9B8&quot;,&quot;#5AA9E6&quot;,&quot;#A99BD6&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:8,&quot;max&quot;:80,&quot;tsType&quot;:&quot;number&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:96,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state || "learner";
    const size = Number(this.props.size) || 28;
    const seed = Math.abs(Number(this.props.seed) || 0) % 97;
    const r = (k) => { const v = Math.sin((seed + 1) * (k * 12.9898 + 4.1414)) * 43758.5453; return v - Math.floor(v); };
    const shape = Math.floor(r(2) * 3) % 3;
    return {
      isExpert: state === "expert" || state === "blossoming",
      isLearner: state === "learner" || state === "growing",
      isBeginner: state === "beginner" || state === "tending" || state === "waiting",
      v1: shape === 0, v2: shape === 1, v3: shape === 2,
      wrap: {
        display: "inline-block", lineHeight: 0,
        color: this.props.color || "#FFFFFF",
        transform: `rotate(${(r(4) * 360).toFixed(0)}deg)`,
        filter: "drop-shadow(0 1px 1px rgba(70,100,60,.28))",
      },
      w: size,
    };
  }
}
</script>
</body>
</html>
