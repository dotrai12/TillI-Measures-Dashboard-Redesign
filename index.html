<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures</title>
<link rel="stylesheet" href="_ds/tilli-new-design-system-4928e3a5-55df-4bf0-a054-def8ad040436/tokens/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css">
<style>
  .landing {
    position: relative;
    width: 100%;
    min-height: 100svh;
    overflow-x: hidden;
    background: #fff;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    /* Per-item text scale multipliers (baked from the Text size GUI) */
    --eyebrow-scale: 1.30;
    --title-scale: 1.20;
    --sub-scale: 1.05;
    --cta-scale: 1.25;
    --statnum-scale: 0.95;
    --statlabel-scale: 0.90;
    /* Milo Hand decorative image (baked from the Milo GUI) */
    --milo-x: -124px;
    --milo-y: 95px;
    --milo-scale: 1.05;
    --milo-rot: 123deg;
    /* Section nudge offsets (baked from the Section layout GUI) */
    --herocopy-x: 0px;
    --herocopy-y: 146px;
    --stats-x: 0px;
    --stats-y: 127px;
  }

  /* Section nudge — move the hero copy block (image 3) as a unit */
  .hero-copy {
    transform: translate(var(--herocopy-x), var(--herocopy-y));
  }
  /* Section nudge — move the stat cards block (image 4) as a unit */
  .stat-stack {
    transform: translate(var(--stats-x), var(--stats-y));
  }

  /* Milo Hand — decorative, sits above the landing, ignores clicks */
  .milo-hand {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 3;
    width: clamp(160px, 22vw, 320px);
    height: auto;
    transform:
      translate(-50%, -50%)
      translate(var(--milo-x), var(--milo-y))
      rotate(var(--milo-rot))
      scale(var(--milo-scale));
    transform-origin: center;
    pointer-events: none;
    user-select: none;
  }

  .landing-inner {
    position: relative;
    z-index: 2;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 3vh, 36px) clamp(22px, 5vw, 72px) clamp(18px, 3vh, 32px) clamp(30px, 5vw, 80px);
  }

  /* Hero: left copy + right stat cards (image 1) */
  .hero {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    align-items: center;
    gap: clamp(28px, 4vw, 64px);
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding-top: clamp(16px, 4vh, 40px);
  }
  .hero-eyebrow {
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--green-500);
    margin: 0 0 clamp(12px, 2vh, 20px);
    font-size: calc(clamp(11px, 1.1vw, 14px) * var(--eyebrow-scale));
  }
  .hero-title {
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.06;
    font-size: calc(clamp(34px, 5vw, 64px) * var(--title-scale));
    color: var(--ink-900);
    margin: 0;
    max-width: 15ch;
    text-wrap: balance;
  }
  .hero-sub {
    font-family: 'Quicksand', sans-serif;
    font-style: italic;
    font-weight: 600;
    font-size: calc(clamp(16px, 2vw, 25px) * var(--sub-scale));
    color: var(--ink-600);
    margin: clamp(12px, 2vh, 20px) 0 0;
    max-width: 30ch;
  }
  .hero-cta { margin-top: clamp(24px, 4vh, 36px); }
  .hero-cta .btn-primary { font-size: calc(clamp(15px, 1.7vw, 19px) * var(--cta-scale)); }

  .stat-stack { display: flex; flex-direction: column; gap: clamp(14px, 2vh, 20px); }
  .stat-card {
    border: 2px solid var(--pink-400);
    border-radius: var(--radius-card);
    padding: clamp(20px, 2.4vw, 28px);
    background: #fff;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .stat-card.yellow { border-color: var(--yellow-500); }
  .stat-icon {
    flex: none;
    width: clamp(52px, 5vw, 68px);
    height: clamp(52px, 5vw, 68px);
    border-radius: 50%;
    background: var(--pink-400);
    display: flex; align-items: center; justify-content: center;
  }
  .stat-icon.yellow { background: var(--yellow-500); }
  .stat-icon img { width: 55%; height: auto; }
  .stat-num {
    display: block;
    font-weight: 700;
    font-size: calc(clamp(30px, 3.2vw, 44px) * var(--statnum-scale));
    line-height: 1;
    color: var(--pink-600);
  }
  .stat-label {
    display: block;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: calc(clamp(13px, 1.3vw, 16px) * var(--statlabel-scale));
    color: var(--ink-450);
    margin-top: 6px;
  }

  .flower-band {
    position: relative;
    z-index: 1;
    height: clamp(130px, 22vh, 220px);
    pointer-events: none;
  }

  /* ---- Mobile (portrait phones ≤ 640px) ---- */
  @media (max-width: 640px) {
    .landing-inner { padding: 18px 20px 20px 26px; }
    .hero { gap: 22px; padding-top: 14px; }
    .hero-eyebrow { margin-bottom: 10px; }
    .hero-cta { margin-top: 22px; }
    .hero-cta .btn-primary { width: 100%; }   /* full-width Get started for thumb reach */
    .stat-stack { gap: 12px; }
    .stat-card { padding: 16px 18px; gap: 16px; border-radius: 20px; }
    .flower-band { height: clamp(96px, 16vh, 150px); }
  }
</style>
</head>
<body>

<!-- Left brand rail -->
<div class="brand-rail" aria-hidden="true">
  <span></span>
  <span class="seg pink"></span>
  <span class="seg cyan"></span>
  <span class="seg yellow"></span>
</div>

<div class="landing">
  <div class="landing-inner">

    <!-- Top bar -->
    <div class="lockup">
      <img src="_ds/tilli-new-design-system-4928e3a5-55df-4bf0-a054-def8ad040436/assets/logos/tilli-wordmark-crop.png" alt="Tilli">
      <span class="divider"></span>
      <span class="measures">Measures</span>
    </div>

    <!-- Hero -->
    <div class="hero tm-rise">
      <div class="hero-copy">
        <p class="hero-eyebrow">Developmentally on track by 10</p>
        <h1 class="hero-title">Welcome to Tilli Measures</h1>
        <p class="hero-sub">Every skill a seed. Watch the whole child grow.</p>
        <div class="hero-cta">
          <button class="btn btn-primary focus" id="get-started">Get started</button>
        </div>
      </div>
      <div class="stat-stack">
        <div class="stat-card">
          <span class="stat-icon">
            <img src="_ds/tilli-new-design-system-4928e3a5-55df-4bf0-a054-def8ad040436/assets/icons/chart-up.png" alt="" aria-hidden="true">
          </span>
          <span>
            <span class="stat-num">12</span>
            <span class="stat-label">foundational skills, measured from three angles</span>
          </span>
        </div>
        <div class="stat-card yellow">
          <span class="stat-icon yellow">
            <img src="_ds/tilli-new-design-system-4928e3a5-55df-4bf0-a054-def8ad040436/assets/icons/clock.png" alt="" aria-hidden="true">
          </span>
          <span>
            <span class="stat-num">3&#215;</span>
            <span class="stat-label">a year &#183; 20 minutes a week</span>
          </span>
        </div>
      </div>
    </div>

  </div>

  <!-- Milo Hand (decorative) — position/scale/rotation baked on .landing -->
  <img class="milo-hand" id="milo-hand" src="assets/Milo Hand.png" alt="" aria-hidden="true">

  <!-- Flower band (SVG injected by JS) -->
  <div class="flower-band" id="flower-band" aria-hidden="true"></div>
</div>

<!-- Auth + selection layers get injected here -->
<div id="flow-root"></div>

<script src="school-data.js"></script>
<script src="assets/flower-band.js"></script>
<script src="assets/landing.js"></script>
</body>
</html>
