<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures</title>
<link rel="stylesheet" href="_ds/tilli/tokens/fonts.css?v=20261020nb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css?v=20261022a">
<style>
  .landing {
    position: relative;
    width: 100%;
    min-height: 100svh;
    overflow-x: hidden;
    background: var(--white);
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    /* Per-item text scale multipliers (baked from the Text size GUI) */
    --eyebrow-scale: 1.30;
    --title-scale: 1.20;
    --sub-scale: 1.05;
    --cta-scale: 1.25;
    --statnum-scale: 0.95;
    --statlabel-scale: 0.90;
    /* Milo Hand decorative image (baked from the Milo GUI) */
    --milo-x: -124px;
    --milo-y: 95px;
    --milo-scale: 1.05;
    --milo-rot: 123deg;
    /* Section nudge offsets (baked from the Section layout GUI) */
    --herocopy-x: 0px;
    --herocopy-y: 146px;
    --stats-x: 0px;
    --stats-y: 127px;
  }

  /* Section nudge — move the hero copy block (image 3) as a unit */
  .hero-copy {
    transform: translate(var(--herocopy-x), var(--herocopy-y));
  }
  /* Section nudge — move the stat cards block (image 4) as a unit */
  .stat-stack {
    transform: translate(var(--stats-x), var(--stats-y));
  }

  /* Milo Hand — decorative brush stroke. Sits BEHIND the hero copy (z-index 1,
     under .landing-inner's z-index 2) so it can never paint over the subtitle or
     the Get started CTA — it reads as a flourish behind the words, not on top of
     them. It still floats above the page background and flower band. */
  .milo-hand {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 1;
    width: clamp(160px, 22vw, 320px);
    height: auto;
    transform:
      translate(-50%, -50%)
      translate(var(--milo-x), var(--milo-y))
      rotate(var(--milo-rot))
      scale(var(--milo-scale));
    transform-origin: center;
    pointer-events: none;
    user-select: none;
  }

  .landing-inner {
    position: relative;
    z-index: 2;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 3vh, 36px) clamp(22px, 5vw, 72px) clamp(18px, 3vh, 32px) clamp(30px, 5vw, 80px);
  }

  /* Hero: left copy + right stat cards (image 1) */
  .hero {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    align-items: center;
    gap: clamp(28px, 4vw, 64px);
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding-top: clamp(16px, 4vh, 40px);
  }
  .hero-eyebrow {
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--green-700); /* darker green passes WCAG AA on white; green-500 did not */
    margin: 0 0 clamp(12px, 2vh, 20px);
    font-size: calc(var(--fs-sm) * var(--eyebrow-scale));
  }
  .hero-title {
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.06;
    font-size: calc(var(--fs-display) * var(--title-scale));
    color: var(--ink-900);
    margin: 0;
    max-width: 15ch;
    text-wrap: balance;
  }
  .hero-sub {
    font-family: var(--font-body);
    font-style: italic;
    font-weight: 600;
    font-size: calc(var(--fs-xl) * var(--sub-scale));
    color: var(--ink-600);
    margin: clamp(12px, 2vh, 20px) 0 0;
    max-width: 30ch;
  }
  .hero-cta { margin-top: clamp(24px, 4vh, 36px); }
  .hero-cta .btn-primary { font-size: calc(var(--fs-lg) * var(--cta-scale)); }

  .stat-stack { display: flex; flex-direction: column; gap: clamp(14px, 2vh, 20px); }
  .stat-card {
    border: 2px solid var(--pink-400);
    border-radius: var(--radius-card);
    padding: clamp(20px, 2.4vw, 28px);
    background: var(--white);
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .stat-card.yellow { border-color: var(--yellow-500); }
  .stat-icon {
    flex: none;
    width: clamp(52px, 5vw, 68px);
    height: clamp(52px, 5vw, 68px);
    border-radius: 50%;
    background: var(--pink-400);
    display: flex; align-items: center; justify-content: center;
  }
  .stat-icon.yellow { background: var(--yellow-500); }
  .stat-icon img { width: 55%; height: auto; }
  .stat-num {
    display: block;
    font-weight: 700;
    font-size: calc(var(--fs-2xl) * var(--statnum-scale));
    line-height: 1;
    color: var(--pink-600);
  }
  .stat-label {
    display: block;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: calc(var(--fs-md) * var(--statlabel-scale));
    color: var(--ink-450);
    margin-top: 6px;
  }

  .flower-band {
    position: relative;
    z-index: 1;
    height: clamp(130px, 22vh, 220px);
    pointer-events: none;
  }

  /* ============================================================
     "Get started" flow (auth dialog + parent sheets) — rendered by
     assets/landing.js into #flow-root. Builds on the shared .ui-card /
     .ui-menu / .btn-* classes; only what is unique to this flow lives here.
     ============================================================ */
  /* The flow keeps Quicksand for its supporting copy — shared classes
     (err-text, ui-note, btn-link) default to Montserrat, so re-point them. */
  #flow-root .err-text,
  #flow-root .ui-note,
  #flow-root .btn-link { font-family: var(--font-heading); }
  #flow-root .btn-link { text-underline-offset: 2px; }
  .link-center { display: block; margin: 12px auto 0; }

  /* Dialog copy */
  .dlg-logo { display: flex; justify-content: center; margin: 10px 0 14px; }
  .dlg-logo img { height: 26px; width: auto; display: block; }
  .dlg-title {
    font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl);
    text-align: center; margin: 0 0 6px; text-wrap: balance;
  }
  .dlg-sub {
    font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-md);
    color: var(--ink-600); text-align: center; margin: 0 0 20px;
  }
  .dlg-hint {
    font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-sm);
    color: var(--ink-300); margin: 0;
  }
  .dlg-form { display: flex; flex-direction: column; gap: 14px; }

  /* Round icon badge (role cards, child cards, confirm card) */
  .ic-circle {
    flex: none; width: 56px; height: 56px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--green-500);
  }
  .ic-circle img { width: 55%; height: auto; }
  .ic-circle.sm { width: 40px; height: 40px; }
  .ic-circle.yellow { background: var(--yellow-500); }

  /* Role picker cards (border/icon colour set inline per role) */
  .role-card { display: flex; align-items: center; gap: 16px; padding: 18px; text-align: left; }
  .role-card .ic-circle img { width: 52%; }
  .role-card .lbl { display: block; font-weight: 700; font-size: var(--fs-lg); color: var(--ink-700); }
  .role-card .sub {
    display: block; font-family: var(--font-heading); font-weight: 600;
    font-size: var(--fs-sm); color: var(--ink-450); margin-top: 3px;
  }

  /* School search dropdown */
  .school-menu { margin-top: 8px; max-height: 200px; overflow-y: auto; }
  .school-menu .ui-menu-item {
    gap: 10px; padding: 11px 13px; font-family: var(--font-heading);
    font-weight: 600; font-size: var(--fs-md); color: var(--ink-900);
  }
  .school-menu .ui-menu-item.on { background: var(--wash-green); }
  .school-menu .ui-dot { color: var(--green-500); }
  .school-menu .dlg-hint { padding: 12px 13px; }

  /* "Continue via Google" — full-width ghost button */
  .btn-ghost.btn-google {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px; color: var(--ink-700);
  }
  .btn-ghost.btn-google:hover { color: var(--ink-700); }
  /* "—— OR ——" divider */
  .or-rule {
    display: flex; align-items: center; gap: 10px; margin: 18px 0;
    color: var(--ink-300); font-family: var(--font-heading); font-size: var(--fs-sm); font-weight: 700;
  }
  .or-rule::before, .or-rule::after { content: ''; flex: 1; height: 1px; background: var(--line-200); }

  /* Highlighted confirm card (school / child found) */
  .ui-card.confirm-card { border-color: var(--green-500); text-align: center; }
  .ui-card.roomy { padding: clamp(20px, 3vw, 28px); }

  /* Full-screen parent sheets */
  .sheet-wrap { width: 100%; max-width: 520px; }
  .sheet-wrap.wide { max-width: 660px; }
  .sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: clamp(20px, 3.4vh, 30px); }
  .sheet-head.wrap { flex-wrap: wrap; }
  .sheet-title {
    font-weight: 700; letter-spacing: -.01em; font-size: var(--fs-2xl); line-height: 1.14;
    margin: 0 0 8px; text-wrap: balance;
  }
  .sheet-sub {
    font-family: var(--font-heading); font-weight: 600; font-size: var(--fs-md);
    color: var(--ink-600); margin: 0 0 24px;
  }
  .sheet-form { display: flex; flex-direction: column; gap: 16px; }

  /* Child picker */
  .child-card { padding: 20px 24px; min-width: 220px; text-align: left; }
  .child-card.done { border-color: var(--green-500); }
  .child-card .head { display: flex; align-items: center; gap: 12px; }
  .child-card .nm { font-weight: 700; font-size: var(--fs-lg); color: var(--ink-700); }
  .child-card .st {
    display: block; margin-top: 10px; font-family: var(--font-heading); font-weight: 700;
    font-size: var(--fs-sm); color: var(--ink-450);
  }
  .child-card.done .st { color: var(--green-600); }
  .add-child-tile {
    border-style: dashed; padding: 22px 26px; min-width: 170px;
    font-weight: 700; font-size: var(--fs-md); color: var(--green-500);
  }
  .add-child-tile:hover { border-color: var(--green-500); }

  /* ---- Mobile (portrait phones ≤ 640px) ---- */
  @media (max-width: 640px) {
    /* The desktop composition bakes the hero + stats a long way down (offsets
       below). On a tall phone the grid already centres them, so those baked
       offsets just open a large gap at the top — trim them here. Tune in the
       Section layout GUI if needed; desktop values are untouched. */
    .landing { --herocopy-y: 24px; --stats-y: 12px; }
    .landing-inner { padding: 18px 20px 20px 26px; }
    .hero { gap: 22px; padding-top: 14px; }
    .hero-eyebrow { margin-bottom: 10px; }
    .hero-cta { margin-top: 22px; }
    .hero-cta .btn-primary { width: 100%; }   /* full-width Get started for thumb reach */
    .stat-stack { gap: 12px; }
    .stat-card { padding: 16px 18px; gap: 16px; border-radius: var(--radius-xl); }
    .flower-band { height: clamp(96px, 16vh, 150px); }
  }
</style>
</head>
<body>

<!-- Left brand rail -->
<div class="brand-rail" aria-hidden="true">
  <span></span>
  <span class="seg pink"></span>
  <span class="seg cyan"></span>
  <span class="seg yellow"></span>
</div>

<div class="landing">
  <div class="landing-inner">

    <!-- Top bar -->
    <div class="lockup">
      <img src="_ds/tilli/assets/logos/tilli-wordmark-crop.png" alt="Tilli">
      <span class="divider"></span>
      <span class="measures">Measures</span>
    </div>

    <!-- Hero -->
    <div class="hero tm-rise">
      <div class="hero-copy">
        <p class="hero-eyebrow">Developmentally on track by 10</p>
        <h1 class="hero-title">Welcome to Tilli Measures</h1>
        <p class="hero-sub">Every skill a seed. Watch the whole child grow.</p>
        <div class="hero-cta">
          <button class="btn btn-primary focus" id="get-started">Get started</button>
        </div>
      </div>
      <div class="stat-stack">
        <div class="stat-card">
          <span class="stat-icon">
            <img src="_ds/tilli/assets/icons/chart-up.png" alt="" aria-hidden="true">
          </span>
          <span>
            <span class="stat-num">12</span>
            <span class="stat-label">foundational skills, measured from three angles</span>
          </span>
        </div>
        <div class="stat-card yellow">
          <span class="stat-icon yellow">
            <img src="_ds/tilli/assets/icons/clock.png" alt="" aria-hidden="true">
          </span>
          <span>
            <span class="stat-num">3&#215;</span>
            <span class="stat-label">a year &#183; 20 minutes a week</span>
          </span>
        </div>
      </div>
    </div>

  </div>

  <!-- Milo Hand (decorative) — position/scale/rotation baked on .landing -->
  <img class="milo-hand" id="milo-hand" src="assets/Milo Hand.png" alt="" aria-hidden="true">

  <!-- Flower band (SVG injected by JS) -->
  <div class="flower-band" id="flower-band" aria-hidden="true"></div>
</div>

<!-- Auth + selection layers get injected here -->
<div id="flow-root"></div>

<script src="assets/school-data.js?v=20261020mx"></script>
<script src="assets/tilli-api.js?v=20261023bh"></script>
<script src="assets/tilli-org-data.js?v=20261023bh"></script>
<script src="assets/flower-band.js?v=20261016zx"></script>
<script src="assets/landing.js?v=20261023bg"></script>
</body>
</html>
