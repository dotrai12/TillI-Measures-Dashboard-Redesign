<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures — Parent</title>
<link rel="stylesheet" href="_ds/tilli/tokens/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css">
<style>
  /* ---- Parent-flow layout ---- */
  .p-wrap { min-height: 100svh; display: flex; flex-direction: column;
    padding: clamp(18px,3.4vh,34px) clamp(24px,6vw,90px) clamp(40px,6vh,72px); }
  .p-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .p-main { max-width: 860px; width: 100%; margin: 22px auto 0; }

  /* ---- Child switcher ---- */
  .switcher { position: relative; margin-left: auto; }
  .switch-btn { display: inline-flex; align-items: center; gap: 10px; background: #fff;
    border: 1px solid var(--line-200); border-radius: var(--radius-pill); padding: 6px 8px 6px 16px;
    cursor: pointer; font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 13.5px; color: var(--ink-700);
    transition: border-color .2s; }
  .switch-btn:hover { border-color: var(--cyan-500); }
  .switch-btn .av { width: 32px; height: 32px; border-radius: 50%; background: var(--wash-yellow);
    display: flex; align-items: center; justify-content: center; }
  .switch-btn .av img { width: 55%; }
  .switch-btn .caret { color: var(--ink-300); font-size: 11px; }
  .switch-menu { position: absolute; right: 0; top: calc(100% + 10px); z-index: 30; background: #fff;
    border: 1px solid var(--line-200); border-radius: 18px; box-shadow: 0 12px 30px rgba(20,20,20,.12);
    padding: 8px; min-width: 250px; }
  .switch-item { width: 100%; display: flex; align-items: center; gap: 11px; text-align: left; border: none;
    background: transparent; border-radius: 12px; padding: 10px 12px; cursor: pointer;
    font-family: 'Montserrat',sans-serif; transition: background .15s; }
  .switch-item:hover { background: var(--surface-100); }
  .switch-item.on { background: var(--wash-green); }
  .switch-item .dot { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex;
    align-items: center; justify-content: center; }
  .switch-item .nm { display: block; font-weight: 700; font-size: 14px; color: var(--ink-900); }
  .switch-item .mt { display: block; font-weight: 600; font-size: 11.5px; color: var(--ink-300); margin-top: 1px; }
  .switch-item .ck { margin-left: auto; color: var(--green-500); font-weight: 700; }
  .switch-add { width: 100%; text-align: left; border: 1.5px dashed var(--line-200); background: #fff;
    border-radius: 12px; padding: 10px 12px; margin-top: 4px; cursor: pointer; text-decoration: none; display: block;
    font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 13.5px; color: var(--green-500);
    transition: border-color .2s; }
  .switch-add:hover { border-color: var(--green-500); }
  /* thin rule + nav rows (Profile / Log out) below the child list */
  .switch-sep { height: 1px; background: var(--line-200); margin: 8px 4px; }
  .switch-nav { width: 100%; display: flex; align-items: center; gap: 11px; text-align: left; border: none;
    background: transparent; border-radius: 12px; padding: 10px 12px; cursor: pointer;
    font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 13.5px; color: var(--ink-700);
    transition: background .15s; }
  .switch-nav svg { width: 18px; height: 18px; flex: none; }
  .switch-nav:hover { background: var(--surface-100); }
  .switch-nav.danger { color: var(--pink-600); }

  /* ---- Profile page ---- */
  .profile-head { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .profile-face { width: clamp(64px,9vw,84px); height: clamp(64px,9vw,84px); flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 26px rgba(86,192,43,.24); }
  .profile-face img { width: 52%; }
  .kid-list { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .kid-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: #fff; border: 1px solid var(--line-200); border-radius: 18px; padding: 16px 18px;
    cursor: pointer; font-family: 'Montserrat',sans-serif;
    transition: border-color .2s, box-shadow .2s, transform .15s; }
  .kid-card:hover { border-color: var(--green-500); box-shadow: 0 12px 26px rgba(20,20,20,.08); transform: translateY(-1px); }
  .kid-av { width: 48px; height: 48px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; }
  .kid-av img { width: 56%; }
  .kid-info { flex: 1; min-width: 0; }
  .kid-info b { display: block; font-weight: 700; font-size: 16px; color: var(--ink-900); }
  .kid-info span { display: block; font-weight: 600; font-size: 12.5px; color: var(--ink-450); margin-top: 2px; }
  .kid-prog { flex: none; display: flex; align-items: center; gap: 11px; }
  .kid-status { text-align: right; font-family: 'Montserrat',sans-serif; }
  .kid-status b { display: block; font-weight: 700; font-size: 13px; }
  .kid-status span { display: block; font-weight: 600; font-size: 11px; color: var(--ink-450); margin-top: 1px; }
  .kid-card .chev { color: var(--ink-300); font-size: 20px; flex: none; }
  .kid-add { display: block; text-align: center; text-decoration: none; border: 1.5px dashed var(--line-200);
    background: #fff; border-radius: 18px; padding: 16px; font-family: 'Montserrat',sans-serif; font-weight: 700;
    font-size: 14px; color: var(--green-500); transition: border-color .2s, background .2s; }
  .kid-add:hover { border-color: var(--green-500); background: var(--wash-green); }
  .btn-logout { background: #fff; border: 1.5px solid var(--line-200); color: var(--ink-600);
    font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 14px; border-radius: var(--radius-pill);
    padding: 12px 22px; cursor: pointer; transition: border-color .2s, color .2s; }
  .btn-logout:hover { border-color: var(--pink-600); color: var(--pink-600); }
  @media (max-width: 640px) {
    .kid-status span { display: none; }
    .kid-card { padding: 14px 15px; gap: 11px; }
  }

  /* ---- Hero ---- */
  .p-hero { display: grid; grid-template-columns: auto 1fr; gap: clamp(18px,3vw,36px);
    align-items: center; margin-top: clamp(14px,2.6vh,26px); }
  .p-face { width: clamp(96px,13vw,130px); height: clamp(96px,13vw,130px); flex: none;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .p-face img { width: 52%; height: auto; }
  .p-eyebrow { font-weight: 700; font-size: clamp(11px,1.1vw,13px); letter-spacing: .16em;
    text-transform: uppercase; color: var(--green-500); margin: 0 0 6px; }
  .p-title { font-weight: 700; letter-spacing: -.02em; font-size: clamp(28px,4vw,46px);
    line-height: 1.05; margin: 0; text-wrap: balance; }
  .p-title span { color: var(--pink-600); }
  .p-sub { font-family: 'Montserrat',sans-serif; font-weight: 600; font-size: clamp(14px,1.5vw,17px);
    color: var(--ink-600); margin: 10px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; border-radius: var(--radius-pill);
    padding: 6px 13px; font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 12px; }
  .chip .cd { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .chip.school { background: var(--wash-cyan); color: var(--cyan-700); }
  .chip.grade  { background: var(--wash-green); color: var(--green-700); }
  .chip.adm    { background: var(--wash-yellow); color: #7a5c00; }

  /* ---- Section headers ---- */
  .sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: clamp(30px,4vh,44px) 0 14px; }
  .sec-head h2 { font-weight: 700; font-size: clamp(18px,2vw,22px); margin: 0; }
  .sec-head .muted { font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ink-300); }
  .sec-head .muted.due { margin-left: auto; }
  .sec-head .accent { color: var(--pink-600); }

  /* ---- Progress card + donut ---- */
  .prog-card { display: flex; align-items: center; gap: 18px; width: 100%; text-align: left;
    background: var(--surface-100); border: 1px solid var(--line-200); border-radius: var(--radius-card);
    padding: 18px 22px; }
  .prog-card .txt b { display: block; font-weight: 700; font-size: 16px; color: var(--ink-900); }
  .prog-card .txt span { display: block; font-family: 'Montserrat',sans-serif; font-weight: 600; font-size: 12.5px;
    color: var(--ink-450); margin-top: 3px; }

  /* ---- Assessment timeline ---- */
  .timeline { position: relative; background: #fff; border: 1px solid var(--line-200);
    border-radius: var(--radius-card); padding: 8px 18px; }
  .timeline::before { content: ''; position: absolute; left: 33px; top: 30px; bottom: 30px;
    width: 3px; background: var(--line-200); border-radius: 2px; }
  .t-row { position: relative; display: flex; align-items: center; gap: 14px; width: 100%;
    text-align: left; background: none; border: none; cursor: pointer; padding: 13px 2px;
    font-family: 'Montserrat',sans-serif; border-radius: 12px; transition: background .15s; }
  .t-row:hover { background: var(--surface-100); }
  .t-dot { position: relative; z-index: 1; flex: none; width: 18px; height: 18px; border-radius: 50%;
    box-sizing: border-box; margin: 0 6px; }
  .t-dot.done { background: var(--green-500); border: 3px solid var(--green-600); }
  .t-dot.progress { background: var(--yellow-500); border: 3px solid var(--orange-500); }
  .t-dot.pending { background: #fff; border: 3px solid #C9CDD6; }
  .t-body { flex: 1; min-width: 0; }
  .t-body b { display: block; font-weight: 700; font-size: 15px; color: var(--ink-900); }
  .t-body span { display: block; font-family: 'Montserrat',sans-serif; font-weight: 600; font-size: 12px;
    color: var(--ink-450); margin-top: 1px; }
  .t-badge { flex: none; font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 12px;
    border-radius: var(--radius-pill); padding: 7px 15px; }
  .t-badge.done { color: var(--green-700); background: var(--wash-green); }
  .t-badge.progress { color: #8a6100; background: var(--wash-yellow); }
  .t-badge.pending { color: var(--ink-600); background: var(--surface-100); }

  /* ---- Report CTA ---- */
  .report-cta { margin-top: 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    border-radius: var(--radius-card); padding: 22px 24px; border: 2px solid; transition: border-color .2s, background .2s; }
  .report-cta.ready { background: var(--wash-green); border-color: var(--green-500); }
  .report-cta.locked { background: var(--surface-100); border-color: var(--line-200); }
  .report-cta .ico { width: 54px; height: 54px; border-radius: 50%; background: #fff; flex: none;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(20,20,20,.08); }
  .report-cta .ico img { width: 52%; }
  .report-cta .rt { flex: 1; min-width: 180px; }
  .report-cta .rt b { display: block; font-weight: 700; font-size: 18px; color: var(--ink-900); }
  .report-cta .rt span { display: block; font-family: 'Montserrat',sans-serif; font-weight: 600; font-size: 13px;
    color: var(--ink-450); margin-top: 3px; }
  .report-cta .snap-gate { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .report-cta .snap-gate-note { font-family: 'Montserrat',sans-serif; font-weight: 600; font-size: 12px;
    color: var(--ink-450); }

  /* ---- Garden report ---- */
  .garden { position: relative; overflow: hidden; border-radius: var(--radius-card);
    background: linear-gradient(180deg, var(--wash-cyan) 0%, var(--wash-green) 48%);
    padding: clamp(22px,3vw,32px) clamp(14px,2vw,24px) clamp(16px,2.4vw,26px); margin-top: 6px; }
  .garden .bed { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 0; align-items: end; }
  @media (max-width: 620px) { .garden .bed { grid-template-columns: repeat(4, 1fr); } }
  .flower-cell { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .flower-cell .fl { line-height: 0; }
  .flower-cell .lbl { font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 9.5px;
    color: var(--green-700); text-align: center; line-height: 1.15; max-width: 12ch; }

  .skill-list { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .skill-card { background: #fff; border: 1px solid var(--line-200); border-radius: 16px; padding: 14px 16px; }
  .skill-card .sk-top { display: flex; align-items: center; gap: 10px; }
  .skill-card .sk-name { font-weight: 700; font-size: 14.5px; color: var(--ink-900); flex: 1; }
  .skill-card .sk-tag { font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 11.5px;
    border-radius: var(--radius-pill); padding: 4px 11px; }
  .skill-card .sk-bar { height: 9px; background: var(--surface-100); border-radius: 99px; overflow: hidden; margin: 10px 0 8px; }
  .skill-card .sk-fill { height: 100%; border-radius: 99px; transition: width .6s var(--ease); }
  .skill-card .sk-note { font-family: 'Montserrat',sans-serif; font-weight: 600; font-size: 12.5px;
    color: var(--ink-450); line-height: 1.5; }

  .tips { background: var(--wash-yellow); border: 1px solid #F1DA7A; border-radius: var(--radius-card);
    padding: 20px 22px; margin-top: 20px; }
  .tips h3 { margin: 0 0 8px; font-weight: 700; font-size: 16px; color: #6b5100; }
  .tips p { font-family: 'Montserrat',sans-serif; font-weight: 600; font-size: 13px; color: #7a5c00;
    line-height: 1.6; margin: 5px 0; }

  .report-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .btn-outline { background: #fff; border: 1.5px solid var(--green-500); color: var(--green-600);
    font-family: 'Montserrat',sans-serif; font-weight: 700; font-size: 14px; border-radius: var(--radius-pill);
    padding: 12px 22px; cursor: pointer; transition: background .2s; }
  .btn-outline:hover { background: var(--wash-green); }

  .footnote { text-align: center; font-family: 'Montserrat',sans-serif; font-weight: 600; font-size: 13px;
    color: var(--green-600); margin: 30px 0 0; }

  /* ---- Parent snapshot (post-survey, parent-facing copy) ---- */
  .snap-meta { font-family:'Montserrat',sans-serif; font-weight:700; font-size:12.5px;
    color: var(--ink-300); margin: 8px 0 0; }
  .snap-lead { font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(14px,1.5vw,17px);
    color: var(--ink-600); margin: 12px 0 0; max-width: 60ch; line-height:1.6; }
  .shine { list-style:none; margin: 6px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .shine li { position:relative; background: var(--wash-green); border:1px solid #BFE6AE; border-radius:16px;
    padding:14px 16px 14px 44px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:13.5px;
    color: var(--green-700); line-height:1.55; }
  .shine li::before { content:'🌼'; position:absolute; left:15px; top:12px; font-size:15px; }
  .grow-card { background: var(--wash-cyan); border:1px solid #B7E6F1; border-radius:var(--radius-card);
    padding:18px 20px; margin-top:6px; }
  .grow-card h3 { margin:0 0 6px; font-weight:700; font-size:16px; color: var(--cyan-700); }
  .grow-card p { margin:0; font-family:'Montserrat',sans-serif; font-weight:600; font-size:13.5px;
    color: var(--ink-600); line-height:1.6; max-width:62ch; }
  .try { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-top:6px; }
  @media (max-width:640px){ .try { grid-template-columns:1fr; } }
  .try .card { background:#fff; border:1px solid var(--line-200); border-radius:16px; padding:16px; }
  .try .card b { display:block; font-weight:700; font-size:14px; color:var(--ink-900); margin-bottom:5px; }
  .try .card span { font-family:'Montserrat',sans-serif; font-weight:600; font-size:12.5px;
    color: var(--ink-450); line-height:1.55; }
  .teacher-card { display:flex; align-items:flex-start; gap:14px; background: var(--wash-yellow);
    border:1px solid #F1DA7A; border-radius:var(--radius-card); padding:18px 20px; margin-top:6px; }
  .teacher-card .ico { width:44px; height:44px; border-radius:50%; background:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:20px; }
  .teacher-card p { margin:0; font-family:'Montserrat',sans-serif; font-weight:600; font-size:13.5px;
    color:#7a5c00; line-height:1.6; max-width:60ch; }

  /* ============================================================
     Parent report — mockup redesign (image 1). Structure only;
     colours/fonts stay on the site's tokens.
     ============================================================ */
  /* hero note */
  .note-hero { margin-top: 8px; }
  .note-kicker { font-family:'Montserrat',sans-serif; font-weight:700; font-size:clamp(15px,1.6vw,18px);
    color: var(--ink-450); margin:0 0 2px; }
  .note-hero .p-title { font-size: clamp(28px,4vw,44px); }
  .note-lead { font-family:'Montserrat',sans-serif; font-weight:600; font-size:clamp(14px,1.5vw,16px);
    color: var(--ink-600); margin:12px 0 0; max-width:60ch; line-height:1.6; }

  /* grey band that groups the graded report content, setting it apart from
     the intro note above and the download/footer below.
     Full-bleed: breaks out of the centred .p-main to span the whole viewport
     width, while .report-band-inner keeps the content aligned to the page. */
  .report-band { background: var(--surface-100);
    width: 100vw; position: relative; left: 50%; margin-left: -50vw;
    padding: clamp(16px,2.6vw,24px) 0; margin-top: clamp(18px,3vh,26px); }
  .report-band-inner { max-width: 860px; margin: 0 auto;
    padding: 0 clamp(24px,6vw,90px); }
  .report-band-inner > :first-child { margin-top: 0; }

  /* framed panels (shining / support) */
  .panel { border-radius: var(--radius-card); padding: clamp(14px,2vw,18px); margin-top: 16px; }
  .panel-title { font-weight:700; font-size:clamp(16px,1.8vw,19px); margin:0 0 12px; text-align:center; }
  .panel-body { background:#fff; border-radius:18px; padding: clamp(14px,2vw,18px); }

  .panel-shine { background: var(--wash-green); border:1.5px solid #BFE6AE; }
  .panel-shine .panel-title { color: var(--green-700); }
  .shine-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .shine-list li { display:flex; gap:11px; align-items:flex-start; }
  .shine-list .di { color: var(--orange-500); font-size:12px; line-height:1.6; flex:none; margin-top:1px; }
  .shine-list p { margin:0; font-family:'Montserrat',sans-serif; font-weight:600; font-size:13.5px;
    color: var(--ink-600); line-height:1.55; }

  .panel-support { background: var(--wash-cyan); border:1.5px solid #B7E6F1; }
  .panel-support .panel-title { color: var(--cyan-700); }
  .support-body { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; }
  .support-text h3 { margin:0 0 6px; font-weight:700; font-size:16px; color: var(--ink-900); }
  .support-text p { margin:0; font-family:'Montserrat',sans-serif; font-weight:600; font-size:13.5px;
    color: var(--ink-600); line-height:1.6; }
  .support-ill { width:92px; height:auto; align-self:end; }
  @media (max-width:640px){ .support-ill { width:70px; } }

  /* try-at-home clickable cards */
  .try-sub { text-align:center; font-family:'Montserrat',sans-serif; font-weight:600; font-size:12.5px;
    color: var(--ink-300); margin:6px 0 12px; }
  /* try-at-home tag cards — stacked with overlap; bottom card tilts (image 3).
     --card-overlap = how far each card slides up under the one above.
     --bottom-tilt  = rotation of the last (bottom) card. */
  .try-list { position:relative; display:block; --card-overlap:20px; }
  .try-card { position:relative; display:block; text-decoration:none; background:#fff;
    border:3.5px solid var(--c,var(--line-200)); border-radius:20px;
    padding:29px 18px;
    box-shadow: 0 8px 20px rgba(20,20,20,.06);
    transform-origin: 65% 0%;
    transition: transform .18s var(--ease), box-shadow .2s; }
  .try-card + .try-card { margin-top: calc(-1 * var(--card-overlap)); }
  /* baked per-card rotation/nudge */
  .try-card:nth-child(1) { transform: rotate(2deg) translateY(6px); }
  .try-card:nth-child(2) { transform: rotate(0deg) translateY(1px); }
  .try-card:nth-child(3) { transform: rotate(2deg) translateY(17px); }
  .try-card:hover { z-index:5; box-shadow: 0 16px 34px rgba(20,20,20,.12); }
  .tc-tags { display:flex; justify-content:space-between; gap:10px; font-family:'Montserrat',sans-serif;
    font-weight:700; font-size:11.5px; }
  .tc-type { color: var(--c,var(--ink-600)); }
  .tc-freq { color: var(--ink-450); }
  .tc-topic { font-weight:700; font-size:14px; letter-spacing:.02em; text-transform:uppercase;
    color: var(--ink-900); margin:10px 0 5px; }
  .tc-desc { margin:0; font-family:'Montserrat',sans-serif; font-weight:600; font-size:12.5px;
    color: var(--ink-450); line-height:1.55; }

  /* decorative flower row */
  .flower-row { display:flex; justify-content:center; align-items:flex-end; gap:clamp(10px,4vw,30px);
    padding:8px 0 2px; margin-top:22px; }
  .flower-row .fl { line-height:0; }

  /* work with the teacher */
  .teach-head { text-transform:uppercase; letter-spacing:.05em; }
  .teach-copy { font-family:'Montserrat',sans-serif; font-weight:600; font-size:13.5px; color: var(--ink-600);
    line-height:1.6; margin:0; max-width:62ch; }

  /* download + footer */
  .download-row { display:flex; justify-content:center; margin-top:28px; }
  .download-row .btn-primary { padding:13px 42px; font-size:15px; }

  /* ---- Mobile (portrait phones ≤ 640px) ---- */
  @media (max-width: 640px) {
    .p-wrap { padding: 16px 18px 40px; }
    .p-main { margin-top: 16px; }
    .p-top { gap: 10px; }
    .switch-menu { min-width: min(250px, calc(100vw - 40px)); }

    .p-hero { gap: 16px; margin-top: 12px; }
    .p-face { width: 72px; height: 72px; }
    .p-title { font-size: clamp(26px, 8vw, 34px); }

    .sec-head { margin: 26px 0 12px; }
    .prog-card { padding: 16px 18px; gap: 14px; }
    .report-cta { padding: 18px; }
    /* Force the primary CTA onto its own full-width row on phones */
    .report-cta .btn-primary { flex: 1 0 100%; width: 100%; }

    .report-actions { gap: 8px; }
    .report-actions .btn-primary,
    .report-actions .btn-outline,
    .report-actions .btn-ghost { flex: 1 0 100%; width: 100%; text-align: center; }

    .garden { padding: 20px 12px 16px; }
  }
  @media (max-width: 380px) {
    .garden .bed { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="brand-rail" aria-hidden="true"><span></span><span class="seg pink"></span><span class="seg cyan"></span><span class="seg yellow"></span></div>

<div id="app"></div>

<script src="assets/school-data.js"></script>
<script src="assets/tilli-api.js"></script>
<script>
(function () {
  const DS = '_ds/tilli/assets/';
  const LOGO = DS + 'logos/tilli-wordmark-crop.png';
  const SMILEY = DS + 'icons/smiley.png';

  // Inline stroke icons for the switcher menu (no matching PNG in the DS set).
  const ICON_USER = `<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink-450)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`;
  const ICON_LOGOUT = `<svg viewBox="0 0 24 24" fill="none" stroke="var(--pink-600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M15 12H5"/></svg>`;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---- pronoun-aware copy filler (agreement-safe: verbs are phrased with be + complement) ----
  const PRON = {
    he:   { subj: 'he',   obj: 'him',  poss: 'his',   reflex: 'himself',    be: 'is',  have: 'has'  },
    she:  { subj: 'she',  obj: 'her',  poss: 'her',   reflex: 'herself',    be: 'is',  have: 'has'  },
    they: { subj: 'they', obj: 'them', poss: 'their', reflex: 'themselves', be: 'are', have: 'have' },
  };
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  // Fill {name}/{Name}, {subj}/{Subj}, {obj}, {poss}/{Poss}, {be}, {have}, {reflex}, {teacher}.
  function fill(tpl, c) {
    const pr = PRON[c.pronoun] || PRON.they;
    const name = esc(c.name);
    const m = {
      name, Name: name,
      subj: pr.subj, Subj: cap(pr.subj),
      obj: pr.obj, poss: pr.poss, Poss: cap(pr.poss),
      be: pr.be, have: pr.have, reflex: pr.reflex,
      teacher: esc(c.teacher || 'your teacher'),
    };
    return tpl.replace(/\{(\w+)\}/g, (mm, k) => (k in m ? m[k] : mm));
  }

  // Each child is represented by a smiley in their own colour (stable per slot).
  const SMILE_COLORS = ['#56C02B', '#E91E8C', '#26BDE2', '#F99B1C', '#A99BD6', '#E866B0'];
  const smileColor = (i) => SMILE_COLORS[((i % SMILE_COLORS.length) + SMILE_COLORS.length) % SMILE_COLORS.length];

  // ---- seeded RNG (stable per child) ----
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---- 12 skills (SEL + cognitive), each with a flower colour ----
  const SKILLS = [
    { key: 'emotion_awareness',    name: 'Emotion Awareness',      color: '#E91E8C' },
    { key: 'emotion_regulation',   name: 'Emotion Regulation',     color: '#F0A84A' },
    { key: 'empathy',              name: 'Empathy',                color: '#EFA9B8' },
    { key: 'relationship_skills',  name: 'Relationship Skills',    color: '#F99B1C' },
    { key: 'metacognition',        name: 'Metacognition',          color: '#A99BD6' },
    { key: 'critical_thinking',    name: 'Critical Thinking',      color: '#7FB2E6' },
    { key: 'working_memory',       name: 'Working Memory',         color: '#26BDE2' },
    { key: 'planning',             name: 'Planning & Organizing',  color: '#5AA9E6' },
    { key: 'cognitive_flexibility',name: 'Cognitive Flexibility',  color: '#6FC3B8' },
    { key: 'inhibition_distraction',name:'Focus (Distraction)',    color: '#FCC30B' },
    { key: 'inhibition_response',  name: 'Self-control',           color: '#E866B0' },
    { key: 'attention',            name: 'Attention',              color: '#56C02B' },
  ];

  // Warm, concrete "help at home" tips, keyed by skill.
  const TIPS = {
    emotion_awareness:     'Name feelings out loud through the day — "you look frustrated" builds emotion words.',
    emotion_regulation:    'Practice belly-breathing together when everyone is calm, not mid-meltdown.',
    empathy:               'Read a story and pause to ask "how do you think they feel right now?"',
    relationship_skills:   'Set up one short playdate and let them practice taking turns.',
    metacognition:         'After a task ask "what was tricky, and what would you try next time?"',
    critical_thinking:     'Ask open "why do you think…?" questions instead of giving the answer.',
    working_memory:        'Play one short memory game after dinner — five minutes is plenty.',
    planning:              'Let them plan a small routine, like packing their own bag with a checklist.',
    cognitive_flexibility: 'Play "let\'s do it a different way" games to practice switching ideas.',
    inhibition_distraction:'Try 5-minute focus stretches in a quiet spot, then a movement break.',
    inhibition_response:   'Play "red light, green light" — it makes pausing before acting fun.',
    attention:            'Read together a little longer each week to stretch sustained focus.',
  };

  function bandOf(pct) { return pct < 34 ? 'seedling' : pct < 67 ? 'sprouting' : 'blooming'; }
  const BAND_META = {
    blooming:  { tag: 'Blooming',  color: 'var(--green-700)', bg: 'var(--wash-green)',  fill: 'var(--green-500)' },
    sprouting: { tag: 'Sprouting', color: '#8a6100',          bg: 'var(--wash-yellow)', fill: 'var(--yellow-500)' },
    seedling:  { tag: 'Seedling',  color: 'var(--pink-600)',  bg: 'var(--wash-pink)',   fill: 'var(--pink-400)' },
  };

  // Build a child's 12-skill garden (stable per name).
  function buildSkills(name) {
    const rnd = mulberry32(hashStr(name + ':garden'));
    const base = 40 + rnd() * 26; // child's overall tilt
    return SKILLS.map((sk) => {
      const pct = Math.round(clamp(base + (rnd() - 0.5) * 60, 6, 98));
      const band = bandOf(pct);
      const note = band === 'blooming'
        ? name + ' shows real strength in ' + sk.name.toLowerCase() + '.'
        : band === 'sprouting'
        ? sk.name + ' is coming along nicely — a little practice helps.'
        : sk.name + ' is just beginning to grow; gentle support will help.';
      return { key: sk.key, name: sk.name, color: sk.color, pct, band, note, seed: hashStr(name + sk.key) % 97 };
    });
  }

  // ============================================================
  // Per-skill flower (garden bed) — flat brand flower / tulip / sprout,
  // matching the landing flower band. band drives the form.
  // ============================================================
  function flowerSVG(color, band, seed, size) {
    const rnd = (k) => { const v = Math.sin((seed + 1) * (k * 12.9898 + 4.1414)) * 43758.5453; return v - Math.floor(v); };
    const tilt = (rnd(4) * 12 - 6).toFixed(1);
    const w = size, h = Math.round(size * 1.7);
    const cx = 30, gy = 96;
    let stemH, headY, head;
    if (band === 'blooming') {
      stemH = 58; headY = gy - stemH;
      const rad = 12, pet = [];
      for (let i = 0; i < 5; i++) { const a = (Math.PI * 2 * i) / 5 - Math.PI / 2; pet.push(`<circle cx="${(cx + Math.cos(a) * rad).toFixed(1)}" cy="${(headY + Math.sin(a) * rad).toFixed(1)}" r="${(rad * .84).toFixed(1)}" fill="${color}"/>`); }
      head = pet.join('') + `<circle cx="${cx}" cy="${headY}" r="6.5" fill="#FCC30B"/>`;
    } else if (band === 'sprouting') {
      stemH = 40; headY = gy - stemH;
      const tw = 12, th = 22;
      head = `<path d="M ${cx - tw} ${headY + 3} C ${cx - tw} ${headY - th * .55} ${cx - tw * .55} ${headY - th} ${cx} ${headY - th} C ${cx + tw * .55} ${headY - th} ${cx + tw} ${headY - th * .55} ${cx + tw} ${headY + 3} C ${cx + tw * .6} ${headY + 10} ${cx - tw * .6} ${headY + 10} ${cx - tw} ${headY + 3} Z" fill="${color}"/>`;
    } else {
      stemH = 24; headY = gy - stemH;
      head = `<path d="M ${cx} ${headY + 10} q -14 -5 -18 -18 q 14 2 18 14 Z" fill="#56C02B"/><path d="M ${cx} ${headY + 10} q 14 -5 18 -18 q -14 2 -18 14 Z" fill="#8FD96B"/>`;
    }
    const topY = gy - stemH;
    const stem = `<path d="M ${cx} ${gy} C ${cx - 3} ${gy - stemH * .45} ${cx + 3} ${topY + stemH * .35} ${cx} ${topY}" stroke="#56C02B" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
    const leaf = band === 'seedling' ? '' :
      `<path d="M ${cx - 1} ${gy - stemH * .42} q -17 -5 -22 8 q 13 4 22 -8 Z" fill="#3F9E1D"/>`;
    return `<svg width="${w}" height="${h}" viewBox="0 0 60 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
      <g class="tm-sway" style="transform:rotate(${tilt}deg);animation:swayC ${(4 + rnd(7) * 1.6).toFixed(1)}s ease-in-out infinite alternate">
        ${stem}${leaf}${head}
      </g>
    </svg>`;
  }

  // ============================================================
  // State
  // ============================================================
  const p = new URLSearchParams(location.search);
  const school = p.get('school') || 'Little Sprouts School';
  const TERM = p.get('term') || 'Term One';          // snapshot metadata (no scores)
  const CONTACT = 'info@tillikids.com · tillikids.com';

  // Which children this parent may see comes from their active ParentLinks
  // (TilliAPI = access control), NOT from the URL. The URL can only *select*
  // which linked child to focus — it can never inject one (spec §5 hardening).
  const TS = window.TILLI_SCHOOL;
  function readSession() {
    try { return JSON.parse(localStorage.getItem('tilliMeasures.session') || '{}') || {}; } catch (e) { return {}; }
  }
  const PARENT_EMAIL = (readSession().email) || 'priya.menon@example.com'; // demo fallback
  const links = (window.TilliAPI && window.TilliAPI.childrenForParent)
    ? window.TilliAPI.childrenForParent(PARENT_EMAIL) : [];
  let children;
  if (links.length) {
    // Enrich each linked child with display fields (pronoun/teacher/scores) from
    // the dataset. The LINK decides access; the dataset only supplies presentation.
    children = links.map((lk, i) => {
      const full = (TS && TS.findByAdm) ? TS.findByAdm(lk.student_id) : null;
      return {
        name: lk.first, grade: lk.grade, section: lk.section, adm: lk.student_id,
        pronoun: (full && full.pronoun) || (lk.gender === 'm' ? 'he' : 'she'),
        teacher: (full && full.teacherName) || 'your teacher', unlocked: i === 0,
      };
    });
  } else {
    // Legacy demo fallback (generic parent@tilli.edu / no links yet).
    children = [
      { name: 'Aarav', grade: 'Grade 1', section: 'A', adm: 'ADM-2041', pronoun: 'he',  teacher: 'Ms Rao',   unlocked: true },
      { name: 'Meera', grade: 'Grade 3', section: 'B', adm: 'ADM-2044', pronoun: 'she', teacher: 'Mr Silva', unlocked: false },
    ];
  }
  const PARENT_NAME = (links[0] && links[0].parentName) || 'Your family';
  const urlChild = (p.get('child') || '').trim();
  let selected = 0;
  if (urlChild) {
    const i = children.findIndex((c) => c.name.toLowerCase() === urlChild.toLowerCase());
    if (i >= 0) selected = i;   // focus a child the parent is genuinely linked to; ignore otherwise
  }

  const ASSESSMENTS = [
    { id: 'parent', title: 'Parent report',    sub: 'Parent survey · 10 questions' },
    { id: 'hearts', title: 'Hearts & Flowers', sub: 'Child activity · about 5 min' },
    { id: 'memory', title: 'Memory Game',       sub: 'Child activity · about 5 min' },
    { id: 'emt1',   title: 'EMT 1',             sub: 'Child activity · about 4 min' },
    { id: 'emt2',   title: 'EMT 2',             sub: 'Child activity · about 4 min' },
    { id: 'emt3',   title: 'EMT 3',             sub: 'Child activity · about 4 min' },
  ];
  // Per-child assessment status (the "unlocked" child is pre-populated so its report opens).
  const STATUS = {};
  children.forEach((c) => {
    if (c.unlocked) STATUS[c.name] = { parent: 'done', hearts: 'done', memory: 'done', emt1: 'done', emt2: 'progress', emt3: 'pending' };
    else STATUS[c.name] = { parent: 'pending', hearts: 'pending', memory: 'pending', emt1: 'pending', emt2: 'pending', emt3: 'pending' };
  });

  // Default visibility of the decorative flower row on the report.
  const state = { view: 'home', selected, switcherOpen: false, saved: '' };
  const app = document.getElementById('app');
  const child = () => children[state.selected];
  const status = () => STATUS[child().name];
  const set = (patch) => { Object.assign(state, patch); render(); };

  // ---- shared bits ----
  const lockup = `<a href="index.html" class="lockup" style="text-decoration:none">
      <img src="${LOGO}" alt="Tilli"><span class="divider"></span><span class="measures">Measures</span></a>`;

  function switcher() {
    const c = child();
    const items = children.map((k, i) => `
      <button class="switch-item ${i === state.selected ? 'on' : ''}" data-select="${i}">
        <span class="dot" style="background:${smileColor(i)}"><img src="${SMILEY}" alt="" style="width:55%"></span>
        <span style="flex:1;min-width:0">
          <span class="nm">${esc(k.name)}</span>
          <span class="mt">${[k.grade, k.section && 'Section ' + k.section].filter(Boolean).join(' · ') || 'No grade set'}</span>
        </span>
        ${i === state.selected ? '<span class="ck">✓</span>' : ''}
      </button>`).join('');
    return `<div class="switcher">
      <button class="switch-btn focus" data-act="toggle-switch" aria-haspopup="menu" aria-expanded="${state.switcherOpen}">
        ${esc(c.name)}'s parent
        <span class="av" style="background:${smileColor(state.selected)}"><img src="${SMILEY}" alt=""></span>
        <span class="caret" aria-hidden="true">▾</span>
      </button>
      ${state.switcherOpen ? `<div class="switch-menu" role="menu">${items}
        <a href="index.html" class="switch-add focus">+ Add another child</a>
        <div class="switch-sep" role="separator"></div>
        <button class="switch-nav focus" data-act="open-profile" role="menuitem">${ICON_USER}<span>Profile</span></button>
        <button class="switch-nav danger focus" data-act="logout" role="menuitem">${ICON_LOGOUT}<span>Log out</span></button>
      </div>` : ''}
    </div>`;
  }

  function donut(pct) {
    const r = 26, circ = 2 * Math.PI * r, off = circ * (1 - pct / 100);
    return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line-200)" stroke-width="7"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--green-500)" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 32 32)" style="transition:stroke-dashoffset .5s ease"/>
      <text x="32" y="37" text-anchor="middle" font-family="'Montserrat',sans-serif" font-weight="700" font-size="14" fill="var(--ink-900)">${pct}%</text>
    </svg>`;
  }

  // ============================================================
  // HOME VIEW
  // ============================================================
  function homeView() {
    return `<div class="p-wrap">
      <div class="p-top">${lockup}${switcher()}</div>
      <div class="p-main">${homeMainInner()}</div>
    </div>`;
  }

  // Inner content of .p-main — regenerated on its own by patchHome() so an
  // assessment status change never rebuilds (and re-animates) the whole screen.
  function homeMainInner() {
    const c = child();
    const st = status();
    const done = ASSESSMENTS.filter((a) => st[a.id] === 'done').length;
    const total = ASSESSMENTS.length;
    const pct = Math.round((done / total) * 100);
    const reportReady = st.parent === 'done';   // snapshot is generated once the parent report is done
    const allDone = done === total;              // but it can only be opened once every assessment is complete
    const faceColor = smileColor(state.selected);

    const chips = [
      `<span class="chip school"><span class="cd" style="background:var(--cyan-500)"></span>${esc(school)}</span>`,
      c.grade ? `<span class="chip grade"><span class="cd" style="background:var(--green-500)"></span>${esc(c.grade)}${c.section ? ' · Section ' + esc(c.section) : ''}</span>` : '',
      c.adm ? `<span class="chip adm"><span class="cd" style="background:var(--yellow-500)"></span>Admission ${esc(c.adm)}</span>` : '',
    ].filter(Boolean).join('');

    const rows = ASSESSMENTS.map((a) => {
      const s = st[a.id];
      const badge = s === 'done' ? 'Completed' : s === 'progress' ? 'In progress' : 'Start';
      return `<button class="t-row focus" data-tap="${a.id}">
        <span class="t-dot ${s}"></span>
        <span class="t-body"><b>${esc(a.title)}</b><span>${esc(a.sub)}</span></span>
        <span class="t-badge ${s}">${badge}</span>
      </button>`;
    }).join('');

    return `
        <div class="p-hero" data-rise>
          <div class="p-face" style="background:${faceColor};box-shadow:0 10px 26px ${faceColor}3a">
            <img src="${SMILEY}" alt="">
          </div>
          <div>
            <p class="p-eyebrow">Parent home · Week 14</p>
            <h1 class="p-title">Watch <span>${esc(c.name)}</span> grow</h1>
            <p class="p-sub">${done < total
              ? done + ' of ' + total + " check-ins done — finish them to complete " + esc(c.name) + "'s garden."
              : "Every check-in is complete — " + esc(c.name) + "'s garden report is ready below."}</p>
            <div class="chips">${chips}</div>
          </div>
        </div>

        <div class="sec-head">
          <h2>Assessments for ${esc(c.name)}</h2>
          <span class="muted due">Due <span class="accent">15 August</span></span>
        </div>

        <button class="prog-card focus" data-act="progress-tap" style="margin-bottom:14px">
          ${donut(pct)}
          <span class="txt"><b>${done} of ${total} completed</b>
          <span>Tap an assessment to start it, then tap again to mark it done.</span></span>
        </button>

        <div class="timeline">${rows}</div>

        <div class="report-cta ${reportReady ? 'ready' : 'locked'}">
          <span class="ico"><img src="${DS}icons/${reportReady ? 'chart-up.png' : 'clock.png'}" alt=""></span>
          <span class="rt">
            <b>${reportReady ? esc(c.name) + "'s snapshot is ready" : esc(c.name) + "'s parent snapshot"}</b>
            <span>${reportReady ? 'A warm summary of what you’re seeing at home, from your survey.' : 'Complete the Parent report to unlock your snapshot.'}</span>
          </span>
          ${reportReady
            ? (allDone
                ? `<button class="btn btn-primary focus" data-act="open-snapshot" style="flex:none">See snapshot →</button>`
                : `<span class="snap-gate" style="flex:none;text-align:center">
                     <button class="btn btn-primary focus" style="flex:none" disabled>See snapshot →</button>
                     <span class="snap-gate-note">Complete all assessments to access it</span>
                   </span>`)
            : `<button class="btn btn-primary focus" style="flex:none" disabled>Locked</button>`}
        </div>

        <p class="footnote">Every check-in helps ${esc(c.name)}'s garden grow 🌱</p>`;
  }

  // ============================================================
  // REPORT VIEW (garden payoff)
  // ============================================================
  function reportView() {
    const c = child();
    const skills = buildSkills(c.name);
    const avg = Math.round(skills.reduce((a, s) => a + s.pct, 0) / skills.length);
    const blooms = skills.filter((s) => s.band === 'blooming').length;

    const bed = skills.map((s) => `
      <div class="flower-cell">
        <span class="fl">${flowerSVG(s.color, s.band, s.seed, 46)}</span>
        <span class="lbl">${esc(s.name)}</span>
      </div>`).join('');

    const cards = skills.map((s) => {
      const b = BAND_META[s.band];
      return `<div class="skill-card">
        <div class="sk-top">
          <span class="sk-name">${esc(s.name)}</span>
          <span class="sk-tag" style="color:${b.color};background:${b.bg}">${b.tag}</span>
        </div>
        <div class="sk-bar"><div class="sk-fill" style="width:${s.pct}%;background:${b.fill}"></div></div>
        <div class="sk-note">${esc(s.note)}</div>
      </div>`;
    }).join('');

    // Three lowest skills → home tips.
    const lows = [...skills].sort((a, b) => a.pct - b.pct).slice(0, 3);
    const tips = lows.map((s) => `<p>• ${esc(TIPS[s.key])}</p>`).join('');

    return `<div class="p-wrap">
      <div class="p-top">${lockup}
        <button class="btn-ghost focus" data-act="back-home" style="margin-left:auto">&#8592; Back to home</button>
      </div>
      <div class="p-main" data-rise>

        <p class="p-eyebrow" style="margin-top:8px">${esc(school)} · ${[c.grade, c.section && 'Section ' + c.section].filter(Boolean).join(' · ')}</p>
        <h1 class="p-title" style="font-size:clamp(26px,3.4vw,40px)">${esc(c.name)}'s garden</h1>
        <p class="p-sub" style="max-width:52ch">${esc(c.name)}'s garden is growing — ${blooms} of ${skills.length} skills are blooming, with a few still finding the sun. Here's the whole picture.</p>

        <div class="garden" style="margin-top:20px">
          <div class="bed">${bed}</div>
        </div>

        <div class="sec-head"><h2>Every skill, up close</h2><span class="muted">Overall ${avg}%</span></div>
        <div class="skill-list">${cards}</div>

        <div class="tips">
          <h3>How to help at home 🏡</h3>
          ${tips}
        </div>

        <div class="report-actions">
          <button class="btn btn-primary focus" data-act="save-pdf" style="padding:12px 22px;font-size:14px">${state.saved === 'pdf' ? 'Downloaded ✓' : 'Download PDF'}</button>
          <button class="btn-outline focus" data-act="save-png">${state.saved === 'png' ? 'Saved ✓' : 'Save image'}</button>
          <button class="btn-ghost focus" data-act="back-home" style="padding:12px 18px">Back to home</button>
        </div>

        <p class="footnote">Sent to your email too · a fresh report follows each assessment window.</p>
      </div>
    </div>`;
  }

  // ============================================================
  // PARENT SNAPSHOT — warm, parent-facing copy generated the moment
  // the parent survey is done. Reflects ONLY parent observations.
  // Rules: no numbers/levels/labels; skills become home behaviours;
  // strengths-first; exactly ONE growth area; UK spelling.
  // ============================================================

  // Each strength → a concrete home behaviour (one sentence). Never a label.
  const STRENGTH_BEHAVIOUR = {
    emotion_awareness:      '{Subj} {be} good at putting feelings into words — you’ll often hear {name} say ‘I feel cross’ or ‘that made me happy’ without being asked.',
    emotion_regulation:     'When something upsets {name}, {subj} {be} usually able to settle back down before long and get on with the day.',
    empathy:                '{Name} tends to notice when someone else is sad or left out, and will often go over to comfort them.',
    relationship_skills:    '{Name} plays warmly with others — sharing, taking turns and finding {poss} way back after a squabble.',
    metacognition:          '{Name} likes to think out loud about {poss} own thinking — what was tricky, and what {subj} {be} going to try next.',
    critical_thinking:      '{Name} asks plenty of ‘but why?’ questions and enjoys working out how things fit together.',
    working_memory:         '{Name} can hold a few steps in mind at once — give {obj} a two-part instruction and {subj} {be} usually able to see it through.',
    planning:               '{Name} likes things in order — {subj} {be} happy to line up a task and work through it step by step.',
    cognitive_flexibility:  'When a plan changes, {name} tends to roll with it and try another way rather than getting stuck.',
    inhibition_distraction: '{Name} can settle into something and keep going, even with a bit of noise and bustle around {obj}.',
    inhibition_response:    '{Subj} {be} often able to stop and think for a moment before jumping straight in.',
    attention:              '{Name} can stay with a game or a story for a good stretch without drifting off.',
  };

  // The single growth area → a plain-language behaviour heading + a warm, opportunity-framed description.
  const GROWTH_FRAME = {
    emotion_awareness:      { head: 'Putting feelings into words',   desc: 'Right now {name} sometimes shows big feelings through {poss} body or actions before {subj} can name them. A little help spotting and naming feelings gives {obj} the words to tell you what’s going on.' },
    emotion_regulation:     { head: 'Settling big feelings',         desc: 'When something feels unfair or frustrating, it can take {name} a while to come back down. With a few calming tricks to reach for, those moments get shorter and gentler.' },
    empathy:                { head: 'Tuning in to how others feel',  desc: '{Name} is still learning to read when a friend is upset or wants a turn. Gentle noticing games help {obj} see things from someone else’s side.' },
    relationship_skills:    { head: 'Playing and sharing with others',desc: 'Taking turns and smoothing over little disagreements are still growing for {name}. Short, guided play gives {obj} a friendly place to practise.' },
    metacognition:          { head: 'Noticing how they think',       desc: '{Name} is beginning to look back on what {subj} {be} doing and why. Simple ‘what worked, what was tricky’ chats help that reflecting habit take root.' },
    critical_thinking:      { head: 'Thinking things through',       desc: '{Name} is still building the habit of weighing choices and asking why. Open questions instead of quick answers give {obj} room to reason it out.' },
    working_memory:         { head: 'Holding steps in mind',         desc: 'Longer instructions can slip away before {name} finishes them. Breaking things into a couple of clear steps helps {obj} keep the whole plan in mind.' },
    planning:               { head: 'Planning and organising',       desc: 'Getting started and keeping bits in order is still coming along for {name}. A simple picture checklist gives {obj} a way to see what comes next.' },
    cognitive_flexibility:  { head: 'Adapting when things change',    desc: 'A sudden change to a plan can feel hard for {name} just now. Playful ‘let’s try it another way’ moments make switching feel safe and fun.' },
    inhibition_distraction: { head: 'Staying focused',               desc: 'It’s easy for {name} to be pulled away by whatever is going on nearby. Short bursts of quiet focus, then a break, help that staying-power grow.' },
    inhibition_response:    { head: 'Pausing before acting',         desc: '{Name} sometimes jumps straight in before stopping to think. Fun ‘wait for it’ games make that pause feel like play rather than a rule.' },
    attention:              { head: 'Staying with one thing',        desc: '{Name}’s focus can drift after a little while. Slowly stretching cosy reading or building time helps {obj} stay with one thing for longer.' },
  };

  // Exactly three low-effort home actions, ALL tied to the single growth area. Numbers spelled out (no digits).
  const GROWTH_ACTIONS = {
    emotion_awareness: [
      { t: 'Name it as you go', b: 'Say what you notice out loud: ‘you look frustrated with that puzzle.’ Hearing feelings named gives {name} the words to use next time.' },
      { t: 'Feelings check-in', b: 'At dinner, each share one feeling from the day. Take a turn yourself so it feels normal.' },
      { t: 'Story feelings',    b: 'While reading, pause and ask ‘how do you think they feel?’ Picture books are full of easy feelings to spot.' },
    ],
    emotion_regulation: [
      { t: 'Practise calm when it’s calm', b: 'Try belly-breathing together when everyone is relaxed, so the trick is ready for the wobbly moments.' },
      { t: 'A calm-down corner', b: 'Set up a cosy spot with a cushion or soft toy {name} can choose to go to when feelings get big — never as a punishment.' },
      { t: 'Name the size',      b: 'Talk about feelings as small, medium or big. Spotting one early makes it easier to handle before it grows.' },
    ],
    empathy: [
      { t: 'How do they feel?',  b: 'During stories or at the park, wonder aloud how someone else might be feeling, and why.' },
      { t: 'Little helper jobs', b: 'Give {name} small caring jobs — carrying something for a sibling, checking on a friend — so kindness gets lots of practice.' },
      { t: 'Feelings faces',     b: 'Play a quick game guessing feelings from faces in photos or books. It builds the habit of reading others.' },
    ],
    relationship_skills: [
      { t: 'One-to-one play',   b: 'Set up a short playdate with a single friend. Fewer children makes taking turns easier to manage.' },
      { t: 'Turn-taking games', b: 'Simple board games are gentle practice for waiting, winning and losing.' },
      { t: 'Talk it back',      b: 'After a squabble, calmly help {name} name what happened and think of one thing to try next time.' },
    ],
    metacognition: [
      { t: 'Look-back chats', b: 'After a task ask ‘what was tricky, and what would you try next time?’ Keep it curious, not a test.' },
      { t: 'Think out loud',  b: 'Narrate your own thinking — ‘I’ll do the hard bit first’ — so {name} hears how planning sounds.' },
      { t: 'Two ways',        b: 'When something is tricky, ask {name} to think of two ways to try it before picking one.' },
    ],
    critical_thinking: [
      { t: 'Ask, don’t tell',  b: 'When {name} wonders about something, ask ‘why do you think that is?’ before giving the answer.' },
      { t: 'What might happen?',b: 'During stories, pause and guess together what could come next, and why.' },
      { t: 'Sorting games',    b: 'Sort toys or socks by colour, size or type. Grouping things builds reasoning in a playful way.' },
    ],
    working_memory: [
      { t: 'Two-step errands', b: 'Give little two-part jobs — ‘put your cup in the sink and grab your shoes.’ Add a step as it gets easy.' },
      { t: 'Quick memory games', b: 'Play a short round of ‘I packed my bag’ after dinner. Five minutes is plenty.' },
      { t: 'Say it back',      b: 'Ask {name} to repeat the plan back to you before starting, so the steps stick.' },
    ],
    planning: [
      { t: 'Picture checklist', b: 'Make a simple picture list for a routine like the morning bag, and let {name} tick things off.' },
      { t: 'Plan it first',     b: 'Before an activity, ask ‘what do we need, and what comes first?’ Planning aloud makes it a habit.' },
      { t: 'First, then',       b: 'Use ‘first we do this, then that’ language so the order of steps feels clear and doable.' },
    ],
    cognitive_flexibility: [
      { t: 'Another way',   b: 'Play ‘let’s do it differently’ — brush teeth with the other hand, take a new route to the park.' },
      { t: 'Gentle heads-up', b: 'Warn before a change: ‘five more minutes, then we tidy up.’ Knowing what’s coming makes switching easier.' },
      { t: 'What else could it be?', b: 'Look at a cloud or a squiggle and take turns saying what else it could be. Silly is good.' },
    ],
    inhibition_distraction: [
      { t: 'Quiet focus bursts', b: 'Try a few minutes of one task in a calm spot, then a movement break. Slowly stretch the time.' },
      { t: 'Clear the deck',     b: 'Before something that needs focus, tidy away the other toys so there is less pulling {poss} attention.' },
      { t: 'Beat the timer',     b: 'Set a short, fun timer and see how much of one job {name} can finish before it rings.' },
    ],
    inhibition_response: [
      { t: 'Red light, green light', b: 'Play stop-and-go games. They make pausing before acting genuinely fun.' },
      { t: 'Wait for the word',      b: 'Play games where {name} waits for a signal before moving — good practice for holding on a beat.' },
      { t: 'Take a breath',          b: 'Coach one slow breath before answering or reacting. A tiny pause is a big skill.' },
    ],
    attention: [
      { t: 'A little longer',    b: 'Read or build together and gently stretch the time by a minute or two each week.' },
      { t: 'One thing at a time',b: 'Offer a single activity rather than several, so it is easier to stay with it to the end.' },
      { t: 'Finish-it moments',  b: 'Pick a small task to see all the way through together, and celebrate reaching the end.' },
    ],
  };

  // Pick the strengths (top 2–3) and the single growth area from the child's standings.
  function snapshotStandings(c) {
    const skills = buildSkills(c.name);
    const sorted = [...skills].sort((a, b) => b.pct - a.pct);
    // Mockup shows exactly three "places where {name} is shining".
    const strengths = sorted.slice(0, 3);
    const growth = sorted[sorted.length - 1];
    return { strengths, growth };
  }

  // Dummy metadata for the three try-at-home cards until real content is wired.
  // Card i gets ACT_TYPE[i] / ACT_FREQ[i], a border colour and a placeholder link.
  const ACT_TYPE = ['Playful game', 'Everyday chat', 'Daily routine'];
  const ACT_FREQ = ['A few times a week', 'Once a day', 'Once a week'];
  const TRY_COLORS = ['var(--green-500)', 'var(--cyan-500)', 'var(--orange-500)'];
  const ACT_LINK = 'https://www.tillikids.com'; // TODO placeholder — real how-to link (YouTube / article / steps)

  // Decorative flower row — reuses flowerSVG() in a cool brand palette.
  const FLOWER_ROW_COLORS = ['#26BDE2', '#5AA9E6', '#26BDE2', '#7FB2E6', '#26BDE2'];
  function flowerRow() {
    return FLOWER_ROW_COLORS.map((col, i) =>
      `<span class="fl">${flowerSVG(col, 'blooming', i * 7 + 3, 40)}</span>`).join('');
  }

  function snapshotView() {
    const c = child();
    const { strengths, growth } = snapshotStandings(c);
    const gf = GROWTH_FRAME[growth.key];
    const acts = GROWTH_ACTIONS[growth.key];

    const shine = strengths.map((s) =>
      `<li><span class="di">◆</span><p>${fill(STRENGTH_BEHAVIOUR[s.key], c)}</p></li>`).join('');

    const tryCards = acts.map((a, i) =>
      `<a class="try-card focus" href="${ACT_LINK}" target="_blank" rel="noopener"
          style="--c:${TRY_COLORS[i % TRY_COLORS.length]}">
        <div class="tc-tags"><span class="tc-type">${esc(ACT_TYPE[i] || 'Activity')}</span>
          <span class="tc-freq">${esc(ACT_FREQ[i] || '')}</span></div>
        <div class="tc-topic">${esc(a.t)}</div>
        <p class="tc-desc">${fill(a.b, c)}</p>
      </a>`).join('');

    return `<div class="p-wrap">
      <div class="p-top">${lockup}
        <button class="btn-ghost focus" data-act="back-home" style="margin-left:auto">&#8592; Back to home</button>
      </div>
      <div class="p-main" data-rise>

        <!-- 1 · a note for the family -->
        <div class="note-hero">
          <p class="note-kicker">A note for</p>
          <h1 class="p-title"><span>${esc(c.name)}</span>’s family</h1>
          <p class="note-lead">Here is a brief analysis based on your observations and how ${esc(c.name)}
            did in the ${esc(TERM)} Tilli games.</p>
        </div>

        <!-- grey band groups the graded report (shining → work with teacher) -->
        <div class="report-band">
        <div class="report-band-inner">

        <!-- 2 · three places where {name} is shining -->
        <section class="panel panel-shine">
          <h2 class="panel-title">3 places where ${esc(c.name)} is shining</h2>
          <div class="panel-body"><ul class="shine-list">${shine}</ul></div>
        </section>

        <!-- 3 · where {name} needs support (single growth area) -->
        <section class="panel panel-support">
          <h2 class="panel-title">Where ${esc(c.name)} needs support</h2>
          <div class="panel-body support-body">
            <div class="support-text">
              <h3>${esc(gf.head)}</h3>
              <p>${fill(gf.desc, c)}</p>
            </div>
            <img class="support-ill" src="${DS}icons/people.png" alt="">
          </div>
        </section>

        <!-- 4 · three things you can try at home -->
        <div class="sec-head"><h2>3 things you can try at home</h2></div>
        <p class="try-sub">tap on each card to learn more</p>
        <div class="try-list">${tryCards}</div>

        <!-- 5 · decorative flower row -->
        <div class="flower-row">${flowerRow()}</div>

        <!-- 6 · work with the teacher -->
        <div class="sec-head"><h2 class="teach-head">Work with the teacher</h2></div>
        <p class="teach-copy">When you’re ready, ask ${esc(c.teacher)} for ${esc(c.name)}’s fuller report. It brings
          this survey together with ${esc(c.name)}’s own activities and what ${fill('{poss}', c)} teacher sees in
          class — three angles on the same wonderful child.</p>

        </div><!-- /report-band-inner -->
        </div><!-- /report-band -->

        <!-- 7 · download + footer -->
        <div class="download-row">
          <button class="btn btn-primary focus" data-act="save-pdf">${state.saved === 'pdf' ? 'Downloaded ✓' : 'Download PDF'}</button>
        </div>
        <p class="footnote">For family use only · for enquiry / questions email info@tillikids.com · a fresh snapshot follows each assessment window.</p>
      </div>
    </div>`;
  }

  // ============================================================
  // PROFILE VIEW — who the parent is, their linked children, and how
  // much each child still has to complete. Tapping a child opens that
  // child's home (image 2) via the shared [data-select] handler.
  // ============================================================
  function profileView() {
    const total = ASSESSMENTS.length;
    const kids = children.map((k, i) => {
      const st = STATUS[k.name];
      const done = ASSESSMENTS.filter((a) => st[a.id] === 'done').length;
      const remaining = total - done;
      const pct = Math.round((done / total) * 100);
      const col = smileColor(i);
      const meta = [k.grade, k.section && 'Section ' + k.section].filter(Boolean).join(' · ') || 'No grade set';
      return `<button class="kid-card focus" data-select="${i}">
        <span class="kid-av" style="background:${col}"><img src="${SMILEY}" alt=""></span>
        <span class="kid-info"><b>${esc(k.name)}</b><span>${esc(meta)}</span></span>
        <span class="kid-prog">
          ${donut(pct)}
          <span class="kid-status">
            <b style="color:${remaining ? 'var(--pink-600)' : 'var(--green-600)'}">${remaining ? remaining + ' to go' : 'All done ✓'}</b>
            <span>${done}/${total} check-ins</span>
          </span>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </button>`;
    }).join('');

    return `<div class="p-wrap">
      <div class="p-top">${lockup}
        <button class="btn-ghost focus" data-act="back-home" style="margin-left:auto">&#8592; Back to home</button>
      </div>
      <div class="p-main" data-rise>
        <div class="profile-head">
          <span class="profile-face" style="background:var(--green-500)"><img src="${SMILEY}" alt=""></span>
          <div>
            <p class="p-eyebrow" style="margin-bottom:4px">Your profile</p>
            <h1 class="p-title" style="font-size:clamp(24px,3.2vw,38px)">${esc(PARENT_NAME)}</h1>
          </div>
        </div>
        <p class="p-sub" style="margin-top:14px">You're following ${children.length} ${children.length === 1 ? 'child' : 'children'} at ${esc(school)}. Tap a child to open their check-ins.</p>

        <div class="sec-head"><h2>Your children</h2><span class="muted">${children.length} linked</span></div>
        <div class="kid-list">${kids}
          <a href="index.html" class="kid-add focus">+ Add another child</a>
        </div>

        <div class="report-actions" style="margin-top:26px">
          <button class="btn-logout focus" data-act="logout">Log out</button>
        </div>
      </div>
    </div>`;
  }

  // ============================================================
  // Render + events
  // ============================================================
  // Full (re)mount of a view: rebuilds everything and plays the entrance
  // animation once. Only used for view/child transitions — never for in-place
  // edits, which patch their own region so the header can't re-fade.
  function render() {
    app.innerHTML = state.view === 'report' ? reportView()
      : state.view === 'snapshot' ? snapshotView()
      : state.view === 'profile' ? profileView()
      : homeView();
    app.querySelectorAll('[data-rise]').forEach((el) => el.classList.add('tm-rise'));
    wire(app);
  }

  // Targeted patch: rebuild just .p-main's contents (home view). No tm-rise is
  // re-added, so the hero stays put instead of fading in on every tap.
  function patchHome() {
    const main = app.querySelector('.p-main');
    if (!main) return;
    main.innerHTML = homeMainInner();
    wire(main);
  }

  // Targeted patch: rebuild only the child switcher (open/close its menu)
  // without touching — or re-animating — the rest of the page.
  function patchSwitcher() {
    const cur = app.querySelector('.switcher');
    if (!cur) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = switcher();
    const next = tmp.firstElementChild;
    cur.replaceWith(next);
    wire(next);
  }

  // Targeted patch: just the two save-button labels (report/snapshot views).
  function patchSave() {
    const pdf = app.querySelector('[data-act="save-pdf"]');
    const png = app.querySelector('[data-act="save-png"]');
    if (pdf) pdf.textContent = state.saved === 'pdf' ? 'Downloaded ✓' : 'Download PDF';
    if (png) png.textContent = state.saved === 'png' ? 'Saved ✓' : 'Save image';
  }

  let saveTimer;
  function wire(root) {
    root.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      switch (b.dataset.act) {
        case 'toggle-switch': state.switcherOpen = !state.switcherOpen; patchSwitcher(); break;
        case 'progress-tap': {
          const st = status();
          const open = ASSESSMENTS.find((a) => st[a.id] === 'progress');
          if (open) { st[open.id] = 'done'; patchHome(); }
          break;
        }
        case 'open-profile': set({ view: 'profile', switcherOpen: false }); window.scrollTo(0, 0); break;
        case 'logout': location.href = 'index.html'; break;
        case 'open-snapshot': set({ view: 'snapshot', switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'open-report': set({ view: 'report', switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'back-home': set({ view: 'home' }); window.scrollTo(0, 0); break;
        case 'save-pdf':
        case 'save-png': {
          state.saved = b.dataset.act === 'save-pdf' ? 'pdf' : 'png';
          patchSave();
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => { state.saved = ''; patchSave(); }, 1600);
          break;
        }
      }
    }));

    // assessment cards cycle pending → progress → done → pending
    root.querySelectorAll('[data-tap]').forEach((b) => b.addEventListener('click', () => {
      const st = status();
      const next = { pending: 'progress', progress: 'done', done: 'pending' };
      st[b.dataset.tap] = next[st[b.dataset.tap]] || 'pending';
      patchHome();
    }));

    // switcher select (child switch genuinely changes everything → full render)
    root.querySelectorAll('[data-select]').forEach((b) => b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      set({ selected: +b.dataset.select, switcherOpen: false, view: 'home' });
    }));
  }

  // click outside closes switcher (targeted — no full render)
  document.addEventListener('click', () => {
    if (state.switcherOpen) { state.switcherOpen = false; patchSwitcher(); }
  });

  render();
})();
</script>
</body>
</html>
