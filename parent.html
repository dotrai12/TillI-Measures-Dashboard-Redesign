<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures — Parent</title>
<link rel="stylesheet" href="_ds/tilli/tokens/fonts.css?v=20261020nb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css?v=20261022a">
<style>
  /* ---- Parent-flow layout ---- */
  .p-wrap { min-height: 100svh; display: flex; flex-direction: column;
    padding: clamp(18px,3.4vh,34px) clamp(24px,6vw,90px) clamp(40px,6vh,72px); }
  /* Pinned during screen transitions so only .p-main fades+zooms (see tilli.css).
     view-transition-name makes .p-top a stacking context, so it needs an explicit
     z-index (above .p-main's ~5, below the 50 modal overlay uses) or the child
     switcher dropdown gets painted over by the later-in-DOM .p-main. */
  .p-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 40; view-transition-name: parent-top; }
  .p-main { max-width: 860px; width: 100%; margin: 22px auto 0; }

  /* page-local helpers (candidates for tilli.css) */

  /* ---- Child switcher (menu itself = .ui-menu / .ui-menu-item) ---- */
  .switcher { position: relative; margin-left: auto; }
  .switch-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--white);
    border: 1px solid var(--line-200); border-radius: var(--radius-pill); padding: 6px 8px 6px 16px;
    cursor: pointer; font-family: var(--font-body); font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700);
    transition: border-color .2s; }
  .switch-btn:hover { border-color: var(--cyan-500); }
  .switch-btn .caret { color: var(--ink-300); font-size: var(--fs-xs); }
  .switch-menu { position: absolute; right: 0; top: calc(100% + 10px); z-index: 30; min-width: 250px; }
  .switch-menu .nm { display: block; font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .switch-menu .mt { display: block; font-weight: 600; font-size: var(--fs-xs); color: var(--ink-300); margin-top: 1px; }
  .switch-menu .ck { margin-left: auto; color: var(--green-700); font-weight: 700; }
  .switch-menu .ui-menu-item svg { width: 18px; height: 18px; flex: none; }
  /* thin rule between the child list and the Profile / Log out rows */
  .switch-sep { height: 1px; background: var(--line-200); margin: 8px 4px; }

  /* ---- Profile page ---- */
  .profile-head { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
  .profile-face { width: clamp(64px,9vw,84px); height: clamp(64px,9vw,84px); flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; background: var(--green-500);
    box-shadow: 0 10px 26px color-mix(in srgb, var(--green-500) 24%, transparent); }
  .profile-face img { width: 52%; }
  .kid-list { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .kid-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; }
  .kid-info { flex: 1; min-width: 0; }
  .kid-info b { display: block; font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .kid-info span { display: block; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 2px; }
  .kid-prog { flex: none; display: flex; align-items: center; gap: 11px; }
  .kid-status { text-align: right; }
  .kid-status b { display: block; font-weight: 700; font-size: var(--fs-sm); }
  .kid-status span { display: block; font-weight: 600; font-size: var(--fs-xs); color: var(--ink-450); margin-top: 1px; }
  .kid-card .chev { color: var(--ink-300); font-size: var(--fs-lg); flex: none; }
  .btn-ghost.logout:hover { border-color: var(--pink-600); color: var(--pink-600); }
  .report-actions.profile-actions { margin-top: 26px; }
  @media (max-width: 640px) {
    .kid-status span { display: none; }
    .kid-card { gap: 11px; }
  }

  /* ---- Hero ---- */
  .p-hero { display: grid; grid-template-columns: auto 1fr; gap: clamp(18px,3vw,36px);
    align-items: center; margin-top: clamp(14px,2.6vh,26px); }
  .p-face { width: clamp(96px,13vw,130px); height: clamp(96px,13vw,130px); flex: none;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .p-face img { width: 52%; height: auto; }
  .p-eyebrow { font-weight: 700; font-size: var(--fs-sm); letter-spacing: .16em;
    text-transform: uppercase; color: var(--green-700); margin: 0 0 6px; }
  .p-eyebrow.spaced { margin-top: 8px; }      /* report view: sits directly under the top bar */
  .p-eyebrow.tight { margin-bottom: 4px; }    /* profile view: hugs the parent's name */
  .p-title { font-weight: 700; letter-spacing: -.02em; font-size: var(--fs-2xl);
    line-height: 1.05; margin: 0; text-wrap: balance; }
  .p-title span { color: var(--pink-600); }
  .p-sub { font-family: var(--font-body); font-weight: 600; font-size: var(--fs-lg);
    color: var(--ink-600); margin: 10px 0 0; }
  .p-sub.narrow { max-width: 52ch; }
  .p-sub.spaced { margin-top: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  /* ---- Section headers ---- */
  .sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: clamp(30px,4vh,44px) 0 14px; }
  .sec-head h2 { font-weight: 700; font-size: var(--fs-xl); margin: 0; }
  .sec-head .muted { font-family: var(--font-body); font-weight: 700; font-size: var(--fs-sm); color: var(--ink-300); }
  .sec-head .muted.due { margin-left: auto; }
  .sec-head .accent { color: var(--pink-600); }

  /* ---- Progress card + donut ---- */
  .prog-card { display: flex; align-items: center; gap: 18px; width: 100%; text-align: left;
    background: var(--surface-100); border: 1px solid var(--line-200); border-radius: var(--radius-card);
    padding: 18px 22px; margin-bottom: 14px; }
  .prog-card .txt b { display: block; font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .prog-card .txt span { display: block; font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm);
    color: var(--ink-450); margin-top: 3px; }

  /* ---- Assessment timeline ---- */
  .timeline { position: relative; background: var(--white); border: 1px solid var(--line-200);
    border-radius: var(--radius-card); padding: 8px 18px; }
  .timeline::before { content: ''; position: absolute; left: 33px; top: 30px; bottom: 30px;
    width: 3px; background: var(--line-200); border-radius: 2px; }
  .t-row { position: relative; display: flex; align-items: center; gap: 14px; width: 100%;
    text-align: left; background: none; border: none; cursor: pointer; padding: 13px 2px;
    font-family: var(--font-body); border-radius: var(--radius-md); transition: background .15s; }
  div.t-row { cursor: default; }   /* read-only rows (history / created-school done + missed) */
  .t-row:hover { background: var(--surface-100); }
  .t-dot { position: relative; z-index: 1; flex: none; width: 18px; height: 18px; border-radius: 50%;
    box-sizing: border-box; margin: 0 6px; }
  .t-dot.done { background: var(--green-500); border: 3px solid var(--green-600); }
  .t-dot.progress { background: var(--yellow-500); border: 3px solid var(--orange-500); }
  .t-dot.pending { background: var(--white); border: 3px solid var(--line-200); }
  .t-body { flex: 1; min-width: 0; }
  .t-body b { display: block; font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .t-body span { display: block; font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm);
    color: var(--ink-450); margin-top: 1px; }

  /* resting card shown for the "In between" window (no assessments open) — .ui-card.md.tint-cyan */
  .win-rest { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
  .win-rest .ico { width: 48px; height: 48px; border-radius: 50%; background: var(--white); flex: none;
    display: flex; align-items: center; justify-content: center; font-size: var(--fs-xl); box-shadow: var(--shadow-card); }
  .win-rest .rt b { display: block; font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .win-rest .rt span { display: block; font-family: var(--font-body); font-weight: 600;
    font-size: var(--fs-sm); color: var(--ink-600); margin-top: 3px; }

  /* ---- Phases overview (Baseline → Midline → Endline timeline) ----
     Intermediate screen between child-select and home: one card, a vertical
     line, and a dot per assessment phase with its own completion + CTA. */
  /* phases view fills the viewport height so the timeline spans it fully */
  .p-main.phases-main { flex: 1; display: flex; flex-direction: column; }
  .phase-head { text-align: center; font-weight: 700; font-size: var(--fs-xl);
    color: var(--ink-900); margin: clamp(6px,2vh,16px) 0 clamp(18px,3vh,28px); text-wrap: balance; }
  .phase-head span { color: var(--pink-600); }
  .phase-timeline { position: relative; flex: 1; display: flex; flex-direction: column;
    justify-content: space-between; }
  .phase-timeline::before { content: ''; position: absolute; left: 10px; top: 14px; bottom: 14px;
    width: 3px; background: var(--line-200); border-radius: 2px; }
  .phase-row { position: relative; display: grid; grid-template-columns: 22px 1fr; gap: 16px;
    padding: clamp(10px,2vh,20px) 0; }
  .phase-dot { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%;
    box-sizing: border-box; margin-top: 3px; }
  .phase-dot.done     { background: var(--green-500); border: 4px solid var(--green-600); }
  .phase-dot.progress { background: var(--yellow-500); border: 4px solid var(--orange-500); }
  .phase-dot.pending  { background: var(--white); border: 3px solid var(--line-200); }
  .phase-title { display: block; font-weight: 700; font-size: var(--fs-lg); color: var(--ink-900); }
  .phase-title .ph-date { color: var(--pink-600); }
  .phase-meta { display: block; font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm);
    color: var(--ink-450); margin: 7px 0 15px; line-height: 1.5; }
  .phase-meta b { color: var(--ink-700); }
  .phase-cta { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-locked { display: inline-block; background: var(--surface-100); border: 1.5px solid var(--line-200);
    color: var(--ink-300); font-family: var(--font-body); font-weight: 700; font-size: var(--fs-md);
    border-radius: var(--radius-pill); padding: 11px 24px; cursor: not-allowed; }

  /* ---- Report CTA ---- */
  .report-cta { margin-top: 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    border-radius: var(--radius-card); padding: 22px 24px; border: 2px solid; transition: border-color .2s, background .2s; }
  .report-cta.ready { background: var(--wash-green); border-color: var(--green-500); }
  .report-cta.locked { background: var(--surface-100); border-color: var(--line-200); }
  .report-cta .ico { width: 54px; height: 54px; border-radius: 50%; background: var(--white); flex: none;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card); }
  .report-cta .ico img { width: 52%; }
  .report-cta .rt { flex: 1; min-width: 180px; }
  .report-cta .rt b { display: block; font-weight: 700; font-size: var(--fs-lg); color: var(--ink-900); }
  .report-cta .rt span { display: block; font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm);
    color: var(--ink-450); margin-top: 3px; }
  .report-cta .snap-gate { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .report-cta .snap-gate-note { font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm);
    color: var(--ink-450); }

  /* ---- Garden report ---- */
  .garden { position: relative; overflow: hidden; border-radius: var(--radius-card);
    background: linear-gradient(180deg, var(--wash-cyan) 0%, var(--wash-green) 48%);
    padding: clamp(22px,3vw,32px) clamp(14px,2vw,24px) clamp(16px,2.4vw,26px); margin-top: 20px; }
  .garden .bed { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 0; align-items: end; }
  @media (max-width: 620px) { .garden .bed { grid-template-columns: repeat(4, 1fr); } }
  .flower-cell { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .flower-cell .fl { line-height: 0; }
  .flower-cell .lbl { font-family: var(--font-body); font-weight: 700; font-size: var(--fs-xs);
    color: var(--green-700); text-align: center; line-height: 1.15; max-width: 12ch; }

  /* per-skill cards — .ui-card.sm + .ui-badge.lvl-N + .ui-meter.light */
  .skill-list { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .sk-top { display: flex; align-items: center; gap: 10px; }
  .sk-name { font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); flex: 1; }
  .sk-bar { margin: 10px 0 8px; }
  .sk-note { font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm);
    color: var(--ink-450); line-height: 1.5; }

  /* home tips — .ui-card.md.tint-yellow */
  .tips { margin-top: 20px; }
  .tips h3 { margin: 0 0 8px; font-weight: 700; font-size: var(--fs-md); color: var(--lvl-2-ink); }
  .tips p { font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm); color: var(--lvl-2-ink);
    line-height: 1.6; margin: 5px 0; }

  .report-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }

  .footnote { text-align: center; font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm);
    color: var(--green-600); margin: 30px 0 0; }

  /* ============================================================
     Parent report — mockup redesign (image 1). Structure only;
     colours/fonts stay on the site's tokens.
     ============================================================ */
  /* hero note */
  .note-hero { margin-top: 8px; }
  .note-kicker { font-family: var(--font-body); font-weight:700; font-size: var(--fs-lg);
    color: var(--ink-450); margin:0 0 2px; }
  .note-lead { font-family: var(--font-body); font-weight:600; font-size: var(--fs-md);
    color: var(--ink-600); margin:12px 0 0; max-width:60ch; line-height:1.6; }

  /* grey band that groups the graded report content, setting it apart from
     the intro note above and the download/footer below.
     Full-bleed: breaks out of the centred .p-main to span the whole viewport
     width, while .report-band-inner keeps the content aligned to the page. */
  .report-band { background: var(--surface-100);
    width: 100vw; position: relative; left: 50%; margin-left: -50vw;
    padding: clamp(16px,2.6vw,24px) 0; margin-top: clamp(18px,3vh,26px); }
  .report-band-inner { max-width: 860px; margin: 0 auto;
    padding: 0 clamp(24px,6vw,90px); }
  .report-band-inner > :first-child { margin-top: 0; }

  /* framed panels (shining = .ui-card.md.tint-green, support = .ui-card.md.tint-cyan) */
  .panel { margin-top: 16px; }
  .panel-title { font-weight:700; font-size: var(--fs-lg); margin:0 0 12px; text-align:center; }
  .panel-title.is-green { color: var(--green-700); }
  .panel-title.is-cyan { color: var(--cyan-700); }
  .panel-body { background: var(--white); border-radius: var(--radius-lg); padding: clamp(14px,2vw,18px); }

  .shine-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .shine-list li { display:flex; gap:11px; align-items:flex-start; }
  .shine-list .di { color: var(--orange-500); font-size: var(--fs-sm); line-height:1.6; flex:none; margin-top:1px; }
  .shine-list p { margin:0; font-family: var(--font-body); font-weight:600; font-size: var(--fs-sm);
    color: var(--ink-600); line-height:1.55; }

  .support-body { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; }
  .support-text h3 { margin:0 0 6px; font-weight:700; font-size: var(--fs-md); color: var(--ink-900); }
  .support-text p { margin:0; font-family: var(--font-body); font-weight:600; font-size: var(--fs-sm);
    color: var(--ink-600); line-height:1.6; }
  .support-ill { width:92px; height:auto; align-self:end; }
  @media (max-width:640px){ .support-ill { width:70px; } }

  /* try-at-home clickable cards */
  .try-sub { text-align:center; font-family: var(--font-body); font-weight:600; font-size: var(--fs-sm);
    color: var(--ink-300); margin:6px 0 12px; }
  /* try-at-home tag cards — stacked with overlap; bottom card tilts (image 3).
     --card-overlap = how far each card slides up under the one above.
     --bottom-tilt  = rotation of the last (bottom) card. */
  .try-list { position:relative; display:block; --card-overlap:20px; }
  .try-card { position:relative; display:block; text-decoration:none; background: var(--white);
    border:3.5px solid var(--c,var(--line-200)); border-radius: var(--radius-xl);
    padding:29px 18px;
    box-shadow: var(--shadow-hover);
    transform-origin: 65% 0%;
    transition: transform .18s var(--ease), box-shadow .2s; }
  .try-card + .try-card { margin-top: calc(-1 * var(--card-overlap)); }
  /* baked per-card rotation/nudge */
  .try-card:nth-child(1) { transform: rotate(2deg) translateY(6px); }
  .try-card:nth-child(2) { transform: rotate(0deg) translateY(1px); }
  .try-card:nth-child(3) { transform: rotate(2deg) translateY(17px); }
  .try-card:hover { z-index:5; box-shadow: var(--shadow-pop); }
  .tc-tags { display:flex; justify-content:space-between; gap:10px; font-family: var(--font-body);
    font-weight:700; font-size: var(--fs-xs); }
  .tc-type { color: var(--c,var(--ink-600)); }
  .tc-freq { color: var(--ink-450); }
  .tc-topic { font-weight:700; font-size: var(--fs-md); letter-spacing:.02em; text-transform:uppercase;
    color: var(--ink-900); margin:10px 0 5px; }
  .tc-desc { margin:0; font-family: var(--font-body); font-weight:600; font-size: var(--fs-sm);
    color: var(--ink-450); line-height:1.55; }

  /* decorative flower row */
  .flower-row { display:flex; justify-content:center; align-items:flex-end; gap:clamp(10px,4vw,30px);
    padding:8px 0 2px; margin-top:22px; }
  .flower-row .fl { line-height:0; }

  /* work with the teacher */
  .teach-head { text-transform:uppercase; letter-spacing:.05em; }
  .teach-copy { font-family: var(--font-body); font-weight:600; font-size: var(--fs-sm); color: var(--ink-600);
    line-height:1.6; margin:0; max-width:62ch; }

  /* download + footer */
  .download-row { display:flex; justify-content:center; margin-top:28px; }
  .download-row .btn-primary { padding:13px 42px; font-size: var(--fs-md); }

  /* ---- Mobile (portrait phones ≤ 640px) ---- */
  @media (max-width: 640px) {
    .p-wrap { padding: 16px 18px 40px; }
    .p-main { margin-top: 16px; }
    .p-top { gap: 10px; }
    .switch-menu { min-width: min(250px, calc(100vw - 40px)); }

    .p-hero { gap: 16px; margin-top: 12px; }
    .p-face { width: 72px; height: 72px; }

    .sec-head { margin: 26px 0 12px; }
    .prog-card { padding: 16px 18px; gap: 14px; }
    .report-cta { padding: 18px; }
    /* Force the primary CTA onto its own full-width row on phones */
    .report-cta .btn-primary { flex: 1 0 100%; width: 100%; }

    .report-actions { gap: 8px; }
    .report-actions .btn-primary,
    .report-actions .btn-outline,
    .report-actions .btn-ghost:not(.logout) { flex: 1 0 100%; width: 100%; text-align: center; }

    .garden { padding: 20px 12px 16px; }
  }
  @media (max-width: 380px) {
    .garden .bed { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>

<div class="brand-rail" aria-hidden="true"><span></span><span class="seg pink"></span><span class="seg cyan"></span><span class="seg yellow"></span></div>

<div id="app"></div>

<script src="assets/school-data.js?v=20261020mx"></script>
<script src="assets/tilli-api.js?v=20261026p2"></script>
<script src="assets/float-help.js?v=20261016zx"></script>
<script>TilliFloat.mount({ role: 'Parent' });   // Need help only — no Ask Tilli for families</script>
<script>
(function () {
  const DS = '_ds/tilli/assets/';
  const LOGO = DS + 'logos/tilli-wordmark-crop.png';
  const SMILEY = DS + 'icons/smiley.png';

  // ============================================================
  // Palettes — UI colours come from tokens (window.TilliPalette / var(--…));
  // ART holds the illustration + data hex (kept exact), defined once here.
  // ============================================================
  const PAL = window.TilliPalette;
  const tok = (name) => PAL.css(name);   // resolved hex for SVG presentation attributes
  const ART = {
    // Each child is represented by a smiley in their own colour (stable per slot).
    SMILE: ['#56C02B', '#E91E8C', '#26BDE2', '#F99B1C', '#A99BD6', '#E866B0'],
    // One flower colour per skill (12 distinct hues — not the 4-colour brand petal set).
    SKILL: {
      emotion_awareness: '#E91E8C', emotion_regulation: '#F0A84A', empathy: '#EFA9B8',
      relationship_skills: '#F99B1C', metacognition: '#A99BD6', critical_thinking: '#7FB2E6',
      working_memory: '#26BDE2', planning: '#5AA9E6', cognitive_flexibility: '#6FC3B8',
      inhibition_distraction: '#FCC30B', inhibition_response: '#E866B0', attention: '#56C02B',
    },
    // Decorative flower row on the snapshot — a cool brand-blue set.
    FLOWER_ROW: ['#26BDE2', '#5AA9E6', '#26BDE2', '#7FB2E6', '#26BDE2'],
    // flowerSVG() parts.
    FLOWER: { centre: '#FCC30B', stem: '#56C02B', leaf: '#3F9E1D', sproutLight: '#8FD96B' },
    // Try-at-home card borders (token colours, cycled per card).
    TRY: ['var(--green-500)', 'var(--cyan-500)', 'var(--orange-500)'],
  };

  // Inline stroke icons for the switcher menu (no matching PNG in the DS set).
  const ICON_USER = `<svg viewBox="0 0 24 24" fill="none" stroke="${tok('--ink-450')}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`;
  const ICON_LOGOUT = `<svg viewBox="0 0 24 24" fill="none" stroke="${tok('--pink-600')}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M15 12H5"/></svg>`;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---- pronoun-aware copy filler (agreement-safe: verbs are phrased with be + complement) ----
  const PRON = {
    he:   { subj: 'he',   obj: 'him',  poss: 'his',   reflex: 'himself',    be: 'is',  have: 'has'  },
    she:  { subj: 'she',  obj: 'her',  poss: 'her',   reflex: 'herself',    be: 'is',  have: 'has'  },
    they: { subj: 'they', obj: 'them', poss: 'their', reflex: 'themselves', be: 'are', have: 'have' },
  };
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  // Fill {name}/{Name}, {subj}/{Subj}, {obj}, {poss}/{Poss}, {be}, {have}, {reflex}, {teacher}.
  function fill(tpl, c) {
    const pr = PRON[c.pronoun] || PRON.they;
    const name = esc(c.name);
    const m = {
      name, Name: name,
      subj: pr.subj, Subj: cap(pr.subj),
      obj: pr.obj, poss: pr.poss, Poss: cap(pr.poss),
      be: pr.be, have: pr.have, reflex: pr.reflex,
      teacher: esc(c.teacher || 'your teacher'),
    };
    return tpl.replace(/\{(\w+)\}/g, (mm, k) => (k in m ? m[k] : mm));
  }

  const smileColor = (i) => ART.SMILE[((i % ART.SMILE.length) + ART.SMILE.length) % ART.SMILE.length];

  // ---- seeded RNG (stable per child) ----
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---- 12 skills (SEL + cognitive); flower colour per skill lives in ART.SKILL ----
  const SKILLS = [
    { key: 'emotion_awareness',    name: 'Emotion Awareness'     },
    { key: 'emotion_regulation',   name: 'Emotion Regulation'    },
    { key: 'empathy',              name: 'Empathy'               },
    { key: 'relationship_skills',  name: 'Relationship Skills'   },
    { key: 'metacognition',        name: 'Metacognition'         },
    { key: 'critical_thinking',    name: 'Critical Thinking'     },
    { key: 'working_memory',       name: 'Working Memory'        },
    { key: 'planning',             name: 'Planning & Organizing' },
    { key: 'cognitive_flexibility',name: 'Cognitive Flexibility' },
    { key: 'inhibition_distraction',name:'Focus (Distraction)'   },
    { key: 'inhibition_response',  name: 'Self-control'          },
    { key: 'attention',            name: 'Attention'             },
  ];

  // Warm, concrete "help at home" tips, keyed by skill.
  const TIPS = {
    emotion_awareness:     'Name feelings out loud through the day — "you look frustrated" builds emotion words.',
    emotion_regulation:    'Practice belly-breathing together when everyone is calm, not mid-meltdown.',
    empathy:               'Read a story and pause to ask "how do you think they feel right now?"',
    relationship_skills:   'Set up one short playdate and let them practice taking turns.',
    metacognition:         'After a task ask "what was tricky, and what would you try next time?"',
    critical_thinking:     'Ask open "why do you think…?" questions instead of giving the answer.',
    working_memory:        'Play one short memory game after dinner — five minutes is plenty.',
    planning:              'Let them plan a small routine, like packing their own bag with a checklist.',
    cognitive_flexibility: 'Play "let\'s do it a different way" games to practice switching ideas.',
    inhibition_distraction:'Try 5-minute focus stretches in a quiet spot, then a movement break.',
    inhibition_response:   'Play "red light, green light" — it makes pausing before acting fun.',
    attention:            'Read together a little longer each week to stretch sustained focus.',
  };

  // Band → the site-wide level scale via TilliPalette.levelOf():
  // sprouting = 1 (cyan), growing = 2 (amber), blooming = 3 (green).
  function bandOf(pct) { return pct < 34 ? 'sprouting' : pct < 67 ? 'growing' : 'blooming'; }

  // Build a child's 12-skill garden (stable per name + window). Later windows get
  // a gentle upward bump so toggling Baseline → Midline → Endline shows real growth.
  function buildSkills(name, winId) {
    const wk = winId || 'baseline';
    const rnd = mulberry32(hashStr(name + ':' + wk + ':garden'));
    const bump = ({ baseline: 0, midline: 9, endline: 18 })[wk] || 0;
    const base = 40 + rnd() * 26 + bump; // child's overall tilt, rising across the year
    return SKILLS.map((sk) => {
      const pct = Math.round(clamp(base + (rnd() - 0.5) * 60, 6, 98));
      const band = bandOf(pct);
      const note = band === 'blooming'
        ? name + ' shows real strength in ' + sk.name.toLowerCase() + '.'
        : band === 'growing'
        ? sk.name + ' is coming along nicely — a little practice helps.'
        : sk.name + ' is just beginning to grow; gentle support will help.';
      return { key: sk.key, name: sk.name, color: ART.SKILL[sk.key], pct, band, note, seed: hashStr(name + sk.key) % 97 };
    });
  }

  // ============================================================
  // Per-skill flower (garden bed) — flat brand flower / tulip / sprout,
  // matching the landing flower band. band drives the form.
  // ============================================================
  function flowerSVG(color, band, seed, size) {
    const rnd = (k) => { const v = Math.sin((seed + 1) * (k * 12.9898 + 4.1414)) * 43758.5453; return v - Math.floor(v); };
    const tilt = (rnd(4) * 12 - 6).toFixed(1);
    const w = size, h = Math.round(size * 1.7);
    const cx = 30, gy = 96;
    let stemH, headY, head;
    if (band === 'blooming') {
      stemH = 58; headY = gy - stemH;
      const rad = 12, pet = [];
      for (let i = 0; i < 5; i++) { const a = (Math.PI * 2 * i) / 5 - Math.PI / 2; pet.push(`<circle cx="${(cx + Math.cos(a) * rad).toFixed(1)}" cy="${(headY + Math.sin(a) * rad).toFixed(1)}" r="${(rad * .84).toFixed(1)}" fill="${color}"/>`); }
      head = pet.join('') + `<circle cx="${cx}" cy="${headY}" r="6.5" fill="${ART.FLOWER.centre}"/>`;
    } else if (band === 'growing') {
      stemH = 40; headY = gy - stemH;
      const tw = 12, th = 22;
      head = `<path d="M ${cx - tw} ${headY + 3} C ${cx - tw} ${headY - th * .55} ${cx - tw * .55} ${headY - th} ${cx} ${headY - th} C ${cx + tw * .55} ${headY - th} ${cx + tw} ${headY - th * .55} ${cx + tw} ${headY + 3} C ${cx + tw * .6} ${headY + 10} ${cx - tw * .6} ${headY + 10} ${cx - tw} ${headY + 3} Z" fill="${color}"/>`;
    } else {
      stemH = 24; headY = gy - stemH;
      head = `<path d="M ${cx} ${headY + 10} q -14 -5 -18 -18 q 14 2 18 14 Z" fill="${ART.FLOWER.stem}"/><path d="M ${cx} ${headY + 10} q 14 -5 18 -18 q -14 2 -18 14 Z" fill="${ART.FLOWER.sproutLight}"/>`;
    }
    const topY = gy - stemH;
    const stem = `<path d="M ${cx} ${gy} C ${cx - 3} ${gy - stemH * .45} ${cx + 3} ${topY + stemH * .35} ${cx} ${topY}" stroke="${ART.FLOWER.stem}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
    const leaf = band === 'sprouting' ? '' :
      `<path d="M ${cx - 1} ${gy - stemH * .42} q -17 -5 -22 8 q 13 4 22 -8 Z" fill="${ART.FLOWER.leaf}"/>`;
    return `<svg width="${w}" height="${h}" viewBox="0 0 60 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
      <g class="tm-sway" style="transform:rotate(${tilt}deg);animation:swayC ${(4 + rnd(7) * 1.6).toFixed(1)}s ease-in-out infinite alternate">
        ${stem}${leaf}${head}
      </g>
    </svg>`;
  }

  // ============================================================
  // State
  // ============================================================
  const p = new URLSearchParams(location.search);
  const school = p.get('school') || 'Little Sprouts School';
  const TERM = p.get('term') || 'Term One';          // snapshot metadata (no scores)
  const CONTACT = 'info@tillikids.com · tillikids.com';

  // Which children this parent may see comes from their active ParentLinks
  // (TilliAPI = access control), NOT from the URL. The URL can only *select*
  // which linked child to focus — it can never inject one (spec §5 hardening).
  const TS = window.TILLI_SCHOOL;
  function readSession() {
    try { return JSON.parse(localStorage.getItem('tilliMeasures.session') || '{}') || {}; } catch (e) { return {}; }
  }
  const PARENT_EMAIL = (readSession().email) || 'priya.menon@example.com'; // demo fallback
  // Completions this parent marks show up in the school's change history under their name.
  if (window.TilliAPI && window.TilliAPI.setHistoryActor) window.TilliAPI.setHistoryActor({ email: PARENT_EMAIL, role: 'parent' });
  const links = (window.TilliAPI && window.TilliAPI.childrenForParent)
    ? window.TilliAPI.childrenForParent(PARENT_EMAIL) : [];
  let children;
  if (links.length) {
    // Enrich each linked child with display fields (pronoun/teacher/scores) from
    // the dataset. The LINK decides access; the dataset only supplies presentation.
    children = links.map((lk, i) => {
      const full = (TS && TS.findByAdm) ? TS.findByAdm(lk.student_id) : null;
      return {
        name: lk.first || lk.name || 'Your child', grade: lk.grade, section: lk.section, adm: lk.student_id,
        // Carry the backbone ids so a created-school child can key its REAL
        // deployments/completions (findByAdm misses these students — full===null).
        student_id: lk.student_id, school_id: lk.school_id, section_id: lk.section_id,
        pronoun: (full && full.pronoun) || (lk.gender === 'm' ? 'he' : 'she'),
        teacher: (full && full.teacherName) || 'your teacher', unlocked: i === 0,
      };
    });
  } else {
    // Legacy demo fallback (generic parent@tilli.edu / no links yet).
    children = [
      { name: 'Aarav', grade: 'Grade 1', section: 'A', adm: 'ADM-2041', pronoun: 'he',  teacher: 'Ms Rao',   unlocked: true },
      { name: 'Meera', grade: 'Grade 3', section: 'B', adm: 'ADM-2044', pronoun: 'she', teacher: 'Mr Silva', unlocked: false },
    ];
  }
  const PARENT_NAME = (links[0] && links[0].parentName) || 'Your family';
  const urlChild = (p.get('child') || '').trim();
  let selected = 0;
  if (urlChild) {
    const i = children.findIndex((c) => c.name.toLowerCase() === urlChild.toLowerCase());
    if (i >= 0) selected = i;   // focus a child the parent is genuinely linked to; ignore otherwise
  }

  const ASSESSMENTS = [
    { id: 'parent', title: 'Parent report',    sub: 'Parent survey · 10 questions' },
    { id: 'hearts', title: 'Hearts & Flowers', sub: 'Child activity · about 5 min' },
    { id: 'memory', title: 'Memory Game',       sub: 'Child activity · about 5 min' },
    { id: 'emt1',   title: 'EMT 1',             sub: 'Child activity · about 4 min' },
    { id: 'emt2',   title: 'EMT 2',             sub: 'Child activity · about 4 min' },
    { id: 'emt3',   title: 'EMT 3',             sub: 'Child activity · about 4 min' },
  ];
  // ---- Assessment windows across the year ----
  // The parent can toggle between these to see each window's completion history
  // and its report. `milestone:false` marks the resting "In between" state, which
  // has no checklist of its own. Order is chronological.
  const WINDOWS = [
    { id: 'baseline', label: 'Baseline',  sub: 'Start of year',       date: 'Apr 2',  milestone: true  },
    { id: 'between',  label: 'In between', sub: 'Between assessments', date: '',       milestone: false },
    { id: 'midline',  label: 'Midline',   sub: 'Mid year',            date: 'Jun 18', milestone: true  },
    { id: 'endline',  label: 'Endline',   sub: 'End of year',         date: 'Sep 24', milestone: true  },
  ];
  const WINDOW_ORDER = WINDOWS.map((w) => w.id);
  // Where "today" sits on the timeline: the open window. Everything before it is
  // completed history; everything after is upcoming. Change this one constant to
  // move the whole flow to a different point in the year.
  const CURRENT_WINDOW = 'midline';
  const winById = (id) => WINDOWS.find((w) => w.id === id) || WINDOWS[0];
  function winPhase(id) {
    if (!winById(id).milestone) return 'between';
    const d = WINDOW_ORDER.indexOf(id) - WINDOW_ORDER.indexOf(CURRENT_WINDOW);
    return d < 0 ? 'past' : d > 0 ? 'future' : 'current';
  }
  const milestones = () => WINDOWS.filter((w) => w.milestone);
  function lastCompletedMilestone(c) {
    if (!c.unlocked) return null;
    const past = milestones().filter((w) => winPhase(w.id) === 'past');
    return past.length ? past[past.length - 1] : null;
  }
  function nextOpenMilestone() {
    return milestones().find((w) => winPhase(w.id) === 'current')
        || milestones().find((w) => winPhase(w.id) === 'future') || null;
  }

  // Per-child, per-window assessment status. The unlocked demo child shows a real
  // progression: past windows fully done (history + report), the open window
  // mid-flight, future windows not started. Locked children are all pending.
  // `between` has no checklist (null).
  const blank = (v) => ({ parent: v, hearts: v, memory: v, emt1: v, emt2: v, emt3: v });
  // assessment status → .ui-chip modifier for its badge
  const BADGE_CLS = { done: 'ok', progress: 'prog', pending: 'muted' };
  const STATUS = {};
  children.forEach((c) => {
    STATUS[c.name] = {};
    WINDOWS.forEach((w) => {
      if (!w.milestone) { STATUS[c.name][w.id] = null; return; }
      if (!c.unlocked) { STATUS[c.name][w.id] = blank('pending'); return; }
      const ph = winPhase(w.id);
      STATUS[c.name][w.id] = ph === 'past' ? blank('done')
        : ph === 'current' ? { parent: 'done', hearts: 'done', memory: 'done', emt1: 'done', emt2: 'progress', emt3: 'pending' }
        : blank('pending');
    });
  });

  // Default visibility of the decorative flower row on the report.
  const state = { view: 'phases', selected, window: CURRENT_WINDOW, switcherOpen: false, saved: '' };
  const app = document.getElementById('app');
  const child = () => children[state.selected];
  const curWindow = () => winById(state.window);
  const status = () => STATUS[child().name][state.window];
  const set = (patch) => { Object.assign(state, patch); render(); };

  // ============================================================
  // CREATED-SCHOOL BRIDGE — real deployed Parent assessments.
  // A wizard-created school (school.source === 'created') drives its own
  // Baseline/Midline/Endline lanes via TilliAPI, so those children get a
  // real, persisting checklist instead of the hardcoded demo STATUS above.
  // Everything below is a no-op for demo/legacy children (returns null).
  // ============================================================
  const API = window.TilliAPI || null;
  const PARENT_PHASES = ['Baseline', 'Midline', 'Endline'];
  // Returns the resolved school IFF this child belongs to a created school
  // (and is a genuinely linked child with a student_id). Otherwise null →
  // caller falls back to the existing demo rendering.
  function createdSchoolFor(c) {
    if (!c || !c.student_id || !API || !API.resolveSchool) return null;
    const id = c.school_id || p.get('school');
    if (!id) return null;
    const sc = API.resolveSchool(id);
    return (sc && sc.source === 'created') ? sc : null;
  }

  // ---- shared bits ----
  const lockup = `<a href="index.html" class="lockup" style="text-decoration:none">
      <img src="${LOGO}" alt="Tilli"><span class="divider"></span><span class="measures">Measures</span></a>`;

  function switcher() {
    const c = child();
    const items = children.map((k, i) => `
      <button class="ui-menu-item ${i === state.selected ? 'on' : ''}" data-select="${i}">
        <span class="ui-avatar sm" style="background:${smileColor(i)}"><img src="${SMILEY}" alt=""></span>
        <span class="flex-1">
          <span class="nm">${esc(k.name)}</span>
          <span class="mt">${esc(classMeta(k)) || 'No grade set'}</span>
        </span>
        ${i === state.selected ? '<span class="ck">✓</span>' : ''}
      </button>`).join('');
    return `<div class="switcher">
      <button class="switch-btn focus" data-act="toggle-switch" aria-haspopup="menu" aria-expanded="${state.switcherOpen}">
        ${esc(c.name)}'s parent
        <span class="ui-avatar sm" style="background:${smileColor(state.selected)}"><img src="${SMILEY}" alt=""></span>
        <span class="caret" aria-hidden="true">▾</span>
      </button>
      ${state.switcherOpen ? `<div class="ui-menu switch-menu" role="menu">${items}
        <a href="index.html" class="btn-dashed mt-1 focus">+ Add another child</a>
        <div class="switch-sep" role="separator"></div>
        <button class="ui-menu-item focus" data-act="open-profile" role="menuitem">${ICON_USER}<span>Profile</span></button>
        <button class="ui-menu-item danger focus" data-act="logout" role="menuitem">${ICON_LOGOUT}<span>Log out</span></button>
      </div>` : ''}
    </div>`;
  }

  function donut(pct) {
    const r = 26, circ = 2 * Math.PI * r, off = circ * (1 - pct / 100);
    return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${tok('--line-200')}" stroke-width="7"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${tok('--green-500')}" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 32 32)" style="transition:stroke-dashoffset .5s ease"/>
      <text x="32" y="37" text-anchor="middle" font-family="${tok('--font-body')}" font-weight="700" font-size="15" fill="${tok('--ink-900')}">${pct}%</text>
    </svg>`;
  }

  // ============================================================
  // PHASES VIEW — the child's assessment journey across the year.
  // Sits between child-select and home: pick a phase to open its
  // checklist (continue) or its report (view report). Locked = upcoming.
  // ============================================================
  const ORDINALS = ['1st', '2nd', '3rd', '4th', '5th'];
  function phasesView() {
    const c = child();
    const total = ASSESSMENTS.length;

    const rows = milestones().map((w, i) => {
      const ph = winPhase(w.id);
      const st = STATUS[c.name][w.id];
      const done = ASSESSMENTS.filter((a) => st[a.id] === 'done').length;
      const complete = done === total;
      const dotCls = ph === 'past' ? 'done' : ph === 'current' ? 'progress' : 'pending';
      const ord = ORDINALS[i] || (i + 1) + 'th';

      const meta = complete
        ? 'All assessments completed for ' + esc(c.name)
        : '<b>' + done + '/' + total + '</b> assessments completed for ' + esc(c.name);

      // Future windows are locked; otherwise a finished window shows its report,
      // an unfinished one invites the parent to continue.
      const cta = ph === 'future'
        ? '<span class="btn-locked">Locked</span>'
        : complete
        ? `<div class="phase-cta">
             <button class="btn btn-primary focus" data-act="phase-open" data-win="${w.id}">View details →</button>
             <button class="btn btn-outline md focus" data-act="phase-report" data-win="${w.id}">View report</button>
           </div>`
        : `<button class="btn btn-primary focus" data-act="phase-open" data-win="${w.id}">Continue assessment →</button>`;

      return `<div class="phase-row">
        <span class="phase-dot ${dotCls}"></span>
        <div>
          <b class="phase-title">${ord} phase · ${esc(w.label)}${ph === 'current' && w.date ? ' · <span class="ph-date">' + esc(w.date) + '</span>' : ''}</b>
          <span class="phase-meta">${meta}</span>
          ${cta}
        </div>
      </div>`;
    }).join('');

    return `<div class="p-wrap">
      <div class="p-top">${lockup}${switcher()}</div>
      <div class="p-main phases-main" data-rise>
        <h1 class="phase-head">Get a full view of <span>${esc(c.name)}</span></h1>
        <div class="phase-timeline">${rows}</div>
        <p class="footnote">Every check-in helps ${esc(c.name)}'s garden grow 🌱</p>
      </div>
    </div>`;
  }

  // "Grade 1 · Section A" — or, once the school has renamed the class, its name
  // with the fixed base in brackets: "Sunflowers Rose (Grade 1A)".
  function classMeta(k) {
    const A = window.TilliAPI;
    const plain = [k.grade, k.section && 'Section ' + k.section].filter(Boolean).join(' · ');
    if (!A || !A.sectionLabel || !k.school_id || !k.grade) return plain;
    if (!k.section) return A.gradeLabel(k.school_id, k.grade);
    const label = k.section_id ? A.sectionLabel(k.school_id, k.section_id) : A.sectionLabel(k.school_id, k.grade, k.section);
    const base = k.section_id ? A.sectionBase(k.school_id, k.section_id) : A.sectionBase(k.school_id, k.grade, k.section);
    return base && label.endsWith(' (' + base + ')') ? label : plain;
  }

  // Hero info chips (school · grade/section · admission) — shared by the demo
  // home and the created-school home.
  function heroChips(c, schoolName) {
    return [
      `<span class="pill-info"><span class="ui-dot sm dot-cyan"></span>${esc(schoolName)}</span>`,
      c.grade ? `<span class="ui-chip lg ok"><span class="ui-dot sm dot-green"></span>${esc(classMeta(c))}</span>` : '',
      c.adm ? `<span class="ui-chip lg prog"><span class="ui-dot sm dot-yellow"></span>Admission ${esc(c.adm)}</span>` : '',
    ].filter(Boolean).join('');
  }

  // ============================================================
  // HOME VIEW
  // ============================================================
  function homeView() {
    return `<div class="p-wrap">
      <div class="p-top">${lockup}
        <button class="btn-ghost focus" data-act="back-phases">&#8592; All phases</button>
        ${switcher()}</div>
      <div class="p-main">${homeMainInner()}</div>
    </div>`;
  }

  // Inner content of .p-main — regenerated on its own by patchHome() so an
  // assessment status change never rebuilds (and re-animates) the whole screen.
  function homeMainInner() {
    const c = child();
    const w = curWindow();
    const phase = winPhase(w.id);
    const faceColor = smileColor(state.selected);

    const chips = heroChips(c, school);

    const heroTop = `
        <div class="p-hero" data-rise>
          <div class="p-face" style="background:${faceColor};box-shadow:0 10px 26px ${faceColor}3a">
            <img src="${SMILEY}" alt="">
          </div>
          <div>
            <p class="p-eyebrow">__EYEBROW__</p>
            <h1 class="p-title">Watch <span>${esc(c.name)}</span> grow</h1>
            <p class="p-sub">__SUB__</p>
            <div class="chips">${chips}</div>
          </div>
        </div>`;

    // ---- BETWEEN (resting): no checklist — offer the last completed report ----
    if (!w.milestone) {
      const last = lastCompletedMilestone(c);
      const next = nextOpenMilestone();
      const nextTxt = next ? esc(next.label) + (next.date ? ' opens ' + esc(next.date) : ' opens soon') : 'the next window opens soon';
      const restCta = last
        ? `<div class="report-cta ready">
             <span class="ico"><img src="${DS}icons/chart-up.png" alt=""></span>
             <span class="rt"><b>${esc(c.name)}'s ${esc(last.label)} snapshot</b>
               <span>Revisit the warm summary from ${esc(c.name)}'s last completed window.</span></span>
             <button class="btn btn-primary flex-none focus" data-act="open-last-report" data-win="${last.id}">See snapshot →</button>
           </div>`
        : `<div class="report-cta locked">
             <span class="ico"><img src="${DS}icons/clock.png" alt=""></span>
             <span class="rt"><b>No snapshot yet</b><span>${esc(c.name)}'s first report appears once a window is complete.</span></span>
             <button class="btn btn-primary flex-none focus" disabled>Locked</button>
           </div>`;
      return heroTop
        .replace('__EYEBROW__', 'Parent home · In between windows')
        .replace('__SUB__', `No check-ins are open right now — ${esc(c.name)}'s garden is resting until ${nextTxt}.`)
        + `
        <div class="ui-card md tint-cyan win-rest">
          <span class="ico">🌿</span>
          <div class="rt"><b>Nothing to complete right now</b>
            <span>${nextTxt.charAt(0).toUpperCase() + nextTxt.slice(1)}. You can revisit past reports any time.</span></div>
        </div>
        ${restCta}
        <p class="footnote">Every check-in helps ${esc(c.name)}'s garden grow 🌱</p>`;
    }

    // ---- MILESTONE window (baseline / midline / endline) ----
    const st = status();
    const done = ASSESSMENTS.filter((a) => st[a.id] === 'done').length;
    const total = ASSESSMENTS.length;
    const pct = Math.round((done / total) * 100);
    const reportReady = st.parent === 'done';   // snapshot is generated once the parent report is done
    const allDone = done === total;             // but it can only be opened once every assessment is complete
    const editable = phase === 'current';        // only the open window is tappable; history is read-only
    const locked = phase === 'future';

    const eyebrow = phase === 'past' ? 'Completed window · ' + esc(w.label)
      : phase === 'future' ? 'Upcoming window · ' + esc(w.label)
      : 'Open now · ' + esc(w.label);
    const sub = locked
      ? esc(w.label) + ' opens ' + (w.date ? esc(w.date) : 'soon') + ' — nothing to do just yet.'
      : done < total
      ? done + ' of ' + total + " check-ins done — finish them to complete " + esc(c.name) + "'s garden."
      : "Every check-in is complete — " + esc(c.name) + "'s " + esc(w.label) + ' report is ready below.';

    const rows = ASSESSMENTS.map((a) => {
      const s = locked ? 'pending' : st[a.id];
      const badge = locked ? 'Upcoming' : s === 'done' ? 'Completed' : s === 'progress' ? 'In progress' : 'Start';
      const tag = editable ? 'button' : 'div';
      return `<${tag} class="t-row${editable ? ' focus' : ''}"${editable ? ` data-tap="${a.id}"` : ''}>
        <span class="t-dot ${s}"></span>
        <span class="t-body"><b>${esc(a.title)}</b><span>${esc(a.sub)}</span></span>
        <span class="ui-chip lg ${BADGE_CLS[s]}">${badge}</span>
      </${tag}>`;
    }).join('');

    const dueTag = locked ? `<span class="muted due">Opens <span class="accent">${esc(w.date || 'soon')}</span></span>`
      : phase === 'past' ? `<span class="muted due">Completed <span class="accent">${esc(w.date || '')}</span></span>`
      : `<span class="muted due">Due <span class="accent">15 August</span></span>`;

    const progHint = phase === 'current' ? 'Tap an assessment to start it, then tap again to mark it done.'
      : phase === 'past' ? 'This window is complete — a look back at ' + esc(c.name) + "'s history."
      : esc(w.label) + ' opens ' + (w.date ? esc(w.date) : 'soon') + '.';
    const progCard = `<button class="prog-card${editable ? ' focus' : ''}" ${editable ? ' data-act="progress-tap"' : ''}>
          ${donut(locked ? 0 : pct)}
          <span class="txt"><b>${locked ? 'Not started yet' : done + ' of ' + total + ' completed'}</b>
          <span>${progHint}</span></span>
        </button>`;

    const cta = locked
      ? `<div class="report-cta locked">
          <span class="ico"><img src="${DS}icons/clock.png" alt=""></span>
          <span class="rt"><b>${esc(c.name)}'s ${esc(w.label)} snapshot</b>
            <span>Opens ${w.date ? esc(w.date) : 'soon'} — complete the window to unlock it.</span></span>
          <button class="btn btn-primary flex-none focus" disabled>Locked</button>
        </div>`
      : `<div class="report-cta ${reportReady ? 'ready' : 'locked'}">
          <span class="ico"><img src="${DS}icons/${reportReady ? 'chart-up.png' : 'clock.png'}" alt=""></span>
          <span class="rt">
            <b>${reportReady ? esc(c.name) + "'s snapshot is ready" : esc(c.name) + "'s parent snapshot"}</b>
            <span>${reportReady ? 'A warm summary of what you’re seeing at home, from your survey.' : 'Complete the Parent report to unlock your snapshot.'}</span>
          </span>
          ${reportReady
            ? (allDone
                ? `<button class="btn btn-primary flex-none focus" data-act="open-snapshot">See snapshot →</button>`
                : `<span class="snap-gate flex-none text-center">
                     <button class="btn btn-primary flex-none focus" disabled>See snapshot →</button>
                     <span class="snap-gate-note">Complete all assessments to access it</span>
                   </span>`)
            : `<button class="btn btn-primary flex-none focus" disabled>Locked</button>`}
        </div>`;

    return heroTop.replace('__EYEBROW__', eyebrow).replace('__SUB__', sub) + `

        <div class="sec-head">
          <h2>Assessments for ${esc(c.name)}</h2>
          ${dueTag}
        </div>

        ${progCard}

        <div class="timeline">${rows}</div>

        ${cta}

        <p class="footnote">Every check-in helps ${esc(c.name)}'s garden grow 🌱</p>`;
  }

  // ============================================================
  // CREATED-SCHOOL HOME — REAL deployments + completions (TilliAPI).
  // One screen: every phase the Platform Admin has deployed for the Parent
  // audience, each assessment tappable to mark done (persists via markComplete),
  // undeployed phases shown muted so they appear as the admin rolls them out.
  // ============================================================
  function createdView() {
    return `<div class="p-wrap">
      <div class="p-top">${lockup}${switcher()}</div>
      <div class="p-main">${createdMainInner()}</div>
    </div>`;
  }

  // Inner content only — patched in place on a mark-done so the hero doesn't
  // re-animate (mirrors patchHome for the demo path).
  // 'YYYY-MM-DD' → '2 Nov 2026' (window dates on created-school lanes).
  function fmtDay(v) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
    return m ? (+m[3]) + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m[2] - 1] + ' ' + m[1] : (v || '');
  }
  function createdMainInner() {
    const c = child();
    const sc = createdSchoolFor(c);
    const schoolId = sc.school_id;
    const faceColor = smileColor(state.selected);

    const chips = heroChips(c, sc.name);

    // Deployed Parent lanes, plus student direct assessments set to run at home
    // (a parent does those with the child), indexed by phase.
    const lanes = (API.deploymentsFor(schoolId, 'Parent', { includeEnded: true }) || []);
    const laneByPhase = {}, directByPhase = {};
    lanes.forEach((l) => { laneByPhase[l.phase] = l; });
    (API.deploymentsFor(schoolId, 'Direct Assessment', { includeEnded: true }) || []).forEach((l) => {
      if ((l.assessments || []).some((a) => a.mode === 'home')) directByPhase[l.phase] = l;
    });
    const anyLive = PARENT_PHASES.some((ph) => [laneByPhase[ph], directByPhase[ph]].some((l) => l && l.status === 'Live'));

    const heroTop = `
        <div class="p-hero" data-rise>
          <div class="p-face" style="background:${faceColor};box-shadow:0 10px 26px ${faceColor}3a">
            <img src="${SMILEY}" alt="">
          </div>
          <div>
            <p class="p-eyebrow">Parent home · ${esc(sc.name)}</p>
            <h1 class="p-title">Watch <span>${esc(c.name)}</span> grow</h1>
            <p class="p-sub">${anyLive
              ? 'Complete each check-in your school has opened — your answers save right away.'
              : 'No check-ins are open yet. They’ll appear here as your school deploys each window.'}</p>
            <div class="chips">${chips}</div>
          </div>
        </div>`;

    const sections = PARENT_PHASES.map((phase) => {
      const plane = laneByPhase[phase], dlane = directByPhase[phase];
      const lane = plane || dlane;   // the phase's window/status (both lanes share the phase dates)

      // Not deployed yet → muted resting card (appears once the admin deploys it).
      if (!lane) {
        return `<div class="sec-head"><h2>${esc(phase)}</h2><span class="muted due">Not deployed yet</span></div>
          <div class="ui-card md tint-cyan win-rest">
            <span class="ico">🌿</span>
            <div class="rt"><b>Not deployed yet</b>
              <span>${esc(c.name)}'s ${esc(phase)} check-ins will show up here once your school opens this window.</span></div>
          </div>`;
      }

      const ended = lane.status === 'Ended';
      // Everything this parent does in the phase: their check-ins, then at-home activities.
      const assessments = ((plane && plane.assessments) || []).map((a) => Object.assign({ aud: 'Parent' }, a))
        .concat(((dlane && dlane.assessments) || []).filter((a) => a.mode === 'home').map((a) => Object.assign({ aud: 'Direct Assessment' }, a)));
      const isDone = (a) => API.isComplete(schoolId, phase, a.aud, c.student_id, a.id);
      const stats = { done: assessments.filter(isDone).length, expected: assessments.length };

      // Scheduled → visible but closed until the start date.
      if (lane.status === 'Scheduled') {
        return `<div class="sec-head"><h2>${esc(phase)}</h2><span class="muted due">Opens ${esc(fmtDay(lane.start))}</span></div>
          <div class="ui-card md tint-cyan win-rest">
            <span class="ico">🗓️</span>
            <div class="rt"><b>Opens on ${esc(fmtDay(lane.start))}</b>
              <span>${assessments.length} check-in${assessments.length === 1 ? '' : 's'} for ${esc(c.name)} — open ${esc(fmtDay(lane.start))} to ${esc(fmtDay(lane.end))}.</span></div>
          </div>`;
      }
      // In-order items open once the one before them is done; any-time items are always open.
      const chains = {
        'Parent': API.chainFor ? API.chainFor(schoolId, phase, 'Parent', c.student_id) : [],
        'Direct Assessment': API.chainFor ? API.chainFor(schoolId, phase, 'Direct Assessment', c.student_id) : [],
      };
      const chainState = (a) => chains[a.aud].find((y) => y.id === a.id) || { state: 'open' };
      const kindLabel = (a) => a.aud === 'Parent' ? 'Parent check-in' : 'Activity to do with your child';

      const rows = assessments.length ? assessments.map((a) => {
        const done = isDone(a);
        const link = chainState(a);
        if (!done && !ended && link.state === 'locked') {
          return `<div class="t-row">
            <span class="t-dot pending"></span>
            <span class="t-body"><b>${esc(a.name)}</b><span>Opens after “${esc(link.after)}”</span></span>
            <span class="btn-locked">Locked</span>
          </div>`;
        }
        if (done) {
          return `<div class="t-row">
            <span class="t-dot done"></span>
            <span class="t-body"><b>${esc(a.name)}</b><span>${kindLabel(a)}</span></span>
            <span class="ui-chip lg ok">Completed</span>
          </div>`;
        }
        // Ended-but-unfinished stays visible but read-only; live is tappable.
        return ended
          ? `<div class="t-row">
              <span class="t-dot pending"></span>
              <span class="t-body"><b>${esc(a.name)}</b><span>Window ended · not completed</span></span>
              <span class="ui-chip lg muted">Missed</span>
            </div>`
          : `<button class="t-row focus" data-act="mark-done" data-phase="${esc(phase)}" data-aud="${esc(a.aud)}" data-assess="${esc(a.id)}">
              <span class="t-dot pending"></span>
              <span class="t-body"><b>${esc(a.name)}</b><span>${kindLabel(a)} · tap to mark done</span></span>
              <span class="ui-chip lg muted">Mark done</span>
            </button>`;
      }).join('') : `<div class="t-row"><span class="t-body"><b>No assessments in this window yet</b></span></div>`;

      return `<div class="sec-head">
          <h2>${esc(phase)}</h2>
          <span class="muted due"><b>${stats.done}</b> of <b>${stats.expected}</b> done${ended ? ' · Ended' : (lane.end ? ' · open until ' + esc(fmtDay(lane.end)) : '')}</span>
        </div>
        <div class="timeline">${rows}</div>`;
    }).join('');

    return heroTop + sections + `<p class="footnote">Every check-in helps ${esc(c.name)}'s garden grow 🌱</p>`;
  }

  // Targeted patch after a completion — rebuild just .p-main (no re-animate).
  function patchCreated() {
    const main = app.querySelector('.p-main');
    if (!main) return;
    main.innerHTML = createdMainInner();
    wire(main);
  }

    inhibition_distraction: [
      { t: 'Quiet focus bursts', b: 'Try a few minutes of one task in a calm spot, then a movement break. Slowly stretch the time.' },
      { t: 'Clear the deck',     b: 'Before something that needs focus, tidy away the other toys so there is less pulling {poss} attention.' },
      { t: 'Beat the timer',     b: 'Set a short, fun timer and see how much of one job {name} can finish before it rings.' },
    ],
    inhibition_response: [
      { t: 'Red light, green light', b: 'Play stop-and-go games. They make pausing before acting genuinely fun.' },
      { t: 'Wait for the word',      b: 'Play games where {name} waits for a signal before moving — good practice for holding on a beat.' },
      { t: 'Take a breath',          b: 'Coach one slow breath before answering or reacting. A tiny pause is a big skill.' },
    ],
    attention: [
      { t: 'A little longer',    b: 'Read or build together and gently stretch the time by a minute or two each week.' },
      { t: 'One thing at a time',b: 'Offer a single activity rather than several, so it is easier to stay with it to the end.' },
      { t: 'Finish-it moments',  b: 'Pick a small task to see all the way through together, and celebrate reaching the end.' },
    ],
  };

  // Pick the strengths (top 2–3) and the single growth area from the child's standings.
  function snapshotStandings(c, winId) {
    const skills = buildSkills(c.name, winId);
    const sorted = [...skills].sort((a, b) => b.pct - a.pct);
    // Mockup shows exactly three "places where {name} is shining".
    const strengths = sorted.slice(0, 3);
    const growth = sorted[sorted.length - 1];
    return { strengths, growth };
  }

  // Dummy metadata for the three try-at-home cards until real content is wired.
  // Card i gets ACT_TYPE[i] / ACT_FREQ[i], a border colour and a placeholder link.
  const ACT_TYPE = ['Playful game', 'Everyday chat', 'Daily routine'];
  const ACT_FREQ = ['A few times a week', 'Once a day', 'Once a week'];
  const ACT_LINK = 'https://www.tillikids.com'; // TODO placeholder — real how-to link (YouTube / article / steps)

  // Decorative flower row — reuses flowerSVG() in a cool brand palette (ART.FLOWER_ROW).
  function flowerRow() {
    return ART.FLOWER_ROW.map((col, i) =>
      `<span class="fl">${flowerSVG(col, 'blooming', i * 7 + 3, 40)}</span>`).join('');
  }

  function snapshotView() {
    const c = child();
    const w = curWindow();
    const winLabel = w.milestone ? w.label : TERM;
    const { strengths, growth } = snapshotStandings(c, w.id);
    const gf = GROWTH_FRAME[growth.key];
    const acts = GROWTH_ACTIONS[growth.key];

    const shine = strengths.map((s) =>
      `<li><span class="di">◆</span><p>${fill(STRENGTH_BEHAVIOUR[s.key], c)}</p></li>`).join('');

    const tryCards = acts.map((a, i) =>
      `<a class="try-card focus" href="${ACT_LINK}" target="_blank" rel="noopener"
          style="--c:${ART.TRY[i % ART.TRY.length]}">
        <div class="tc-tags"><span class="tc-type">${esc(ACT_TYPE[i] || 'Activity')}</span>
          <span class="tc-freq">${esc(ACT_FREQ[i] || '')}</span></div>
        <div class="tc-topic">${esc(a.t)}</div>
        <p class="tc-desc">${fill(a.b, c)}</p>
      </a>`).join('');

    return `<div class="p-wrap">
      <div class="p-top">${lockup}
        <button class="btn-ghost ml-auto focus" data-act="back-home">&#8592; Back to home</button>
      </div>
      <div class="p-main" data-rise>

        <!-- 1 · a note for the family -->
        <div class="note-hero">
          <p class="note-kicker">A note for</p>
          <h1 class="p-title"><span>${esc(c.name)}</span>’s family</h1>
          <p class="note-lead">Here is a brief analysis based on your observations and how ${esc(c.name)}
            did in the ${esc(winLabel)} Tilli games.</p>
        </div>

        <!-- grey band groups the graded report (shining → work with teacher) -->
        <div class="report-band">
        <div class="report-band-inner">

        <!-- 2 · three places where {name} is shining -->
        <section class="ui-card md tint-green panel">
          <h2 class="panel-title is-green">3 places where ${esc(c.name)} is shining</h2>
          <div class="panel-body"><ul class="shine-list">${shine}</ul></div>
        </section>

        <!-- 3 · where {name} needs support (single growth area) -->
        <section class="ui-card md tint-cyan panel">
          <h2 class="panel-title is-cyan">Where ${esc(c.name)} needs support</h2>
          <div class="panel-body support-body">
            <div class="support-text">
              <h3>${esc(gf.head)}</h3>
              <p>${fill(gf.desc, c)}</p>
            </div>
            <img class="support-ill" src="${DS}icons/people.png" alt="">
          </div>
        </section>

        <!-- 4 · three things you can try at home -->
        <div class="sec-head"><h2>3 things you can try at home</h2></div>
        <p class="try-sub">tap on each card to learn more</p>
        <div class="try-list">${tryCards}</div>

        <!-- 5 · decorative flower row -->
        <div class="flower-row">${flowerRow()}</div>

        <!-- 6 · work with the teacher -->
        <div class="sec-head"><h2 class="teach-head">Work with the teacher</h2></div>
        <p class="teach-copy">When you’re ready, ask ${esc(c.teacher)} for ${esc(c.name)}’s fuller report. It brings
          this survey together with ${esc(c.name)}’s own activities and what ${fill('{poss}', c)} teacher sees in
          class — three angles on the same wonderful child.</p>

        </div><!-- /report-band-inner -->
        </div><!-- /report-band -->

        <!-- 7 · download + footer -->
        <div class="download-row">
          <button class="btn btn-primary focus" data-act="save-pdf">${state.saved === 'pdf' ? 'Downloaded ✓' : 'Download PDF'}</button>
        </div>
        <p class="footnote">For family use only · for enquiry / questions email info@tillikids.com · a fresh snapshot follows each assessment window.</p>
      </div>
    </div>`;
  }

  // ============================================================
  // PROFILE VIEW — who the parent is, their linked children, and how
  // much each child still has to complete. Tapping a child opens that
  // child's home (image 2) via the shared [data-select] handler.
  // ============================================================
  function profileView() {
    const total = ASSESSMENTS.length;
    // Profile completion reflects the active milestone window (fall back to the
    // open window when the "in between" state is selected, which has no checklist).
    const pw = curWindow().milestone ? state.window : CURRENT_WINDOW;
    const kids = children.map((k, i) => {
      const st = STATUS[k.name][pw];
      const done = ASSESSMENTS.filter((a) => st[a.id] === 'done').length;
      const remaining = total - done;
      const pct = Math.round((done / total) * 100);
      const col = smileColor(i);
      const meta = classMeta(k) || 'No grade set';
      return `<button class="ui-card sm link kid-card focus" data-select="${i}">
        <span class="ui-avatar lg" style="background:${col}"><img src="${SMILEY}" alt=""></span>
        <span class="kid-info"><b>${esc(k.name)}</b><span>${esc(meta)}</span></span>
        <span class="kid-prog">
          ${donut(pct)}
          <span class="kid-status">
            <b style="color:${remaining ? 'var(--pink-600)' : 'var(--green-600)'}">${remaining ? remaining + ' to go' : 'All done ✓'}</b>
            <span>${done}/${total} check-ins</span>
          </span>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </button>`;
    }).join('');

    return `<div class="p-wrap">
      <div class="p-top">${lockup}
        <button class="btn-ghost ml-auto focus" data-act="back-home">&#8592; Back to home</button>
      </div>
      <div class="p-main" data-rise>
        <div class="profile-head">
          <span class="profile-face"><img src="${SMILEY}" alt=""></span>
          <div>
            <p class="p-eyebrow tight">Your profile</p>
            <h1 class="p-title">${esc(PARENT_NAME)}</h1>
          </div>
        </div>
        <p class="p-sub spaced">You're following ${children.length} ${children.length === 1 ? 'child' : 'children'} at ${esc(school)}. Tap a child to open their check-ins.</p>

        <div class="sec-head"><h2>Your children</h2><span class="muted">${children.length} linked</span></div>
        <div class="kid-list">${kids}
          <a href="index.html" class="btn-dashed lg focus">+ Add another child</a>
        </div>

        <div class="report-actions profile-actions">
          <button class="btn-ghost md logout focus" data-act="logout">Log out</button>
        </div>
      </div>
    </div>`;
  }

  // ============================================================
  // Render + events
  // ============================================================
  // Full (re)mount of a view: rebuilds everything and plays the entrance
  // animation once. Only used for view/child transitions — never for in-place
  // edits, which patch their own region so the header can't re-fade.
  let painted = false;
  function render() {
    const paint = () => {
      // Created-school children get the REAL deployment-driven screen in place
      // of the demo phases/home views; profile/report/snapshot are unchanged.
      const createdHome = createdSchoolFor(child()) && state.view !== 'profile'
        && state.view !== 'report' && state.view !== 'snapshot';
      app.innerHTML = createdHome ? createdView()
        : state.view === 'report' ? reportView()
        : state.view === 'snapshot' ? snapshotView()
        : state.view === 'profile' ? profileView()
        : state.view === 'phases' ? phasesView()
        : homeView();
      app.querySelectorAll('[data-rise]').forEach((el) => el.classList.add('tm-rise'));
      wire(app);
    };
    // Fade + subtle zoom between views (View Transitions API). The persistent
    // top bar is pinned via view-transition-name so only .p-main animates.
    // First paint and reduced-motion users get a plain, instant render.
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (painted && !reduce && document.startViewTransition) document.startViewTransition(paint);
    else paint();
    painted = true;
  }

  // Targeted patch: rebuild just .p-main's contents (home view). No tm-rise is
  // re-added, so the hero stays put instead of fading in on every tap.
  function patchHome() {
    const main = app.querySelector('.p-main');
    if (!main) return;
    main.innerHTML = homeMainInner();
    wire(main);
  }

  // Targeted patch: rebuild only the child switcher (open/close its menu)
  // without touching — or re-animating — the rest of the page.
  function patchSwitcher() {
    const cur = app.querySelector('.switcher');
    if (!cur) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = switcher();
    const next = tmp.firstElementChild;
    cur.replaceWith(next);
    wire(next);
  }

  // Targeted patch: just the two save-button labels (report/snapshot views).
  function patchSave() {
    const pdf = app.querySelector('[data-act="save-pdf"]');
    const png = app.querySelector('[data-act="save-png"]');
    if (pdf) pdf.textContent = state.saved === 'pdf' ? 'Downloaded ✓' : 'Download PDF';
    if (png) png.textContent = state.saved === 'png' ? 'Saved ✓' : 'Save image';
  }

  let saveTimer;
  function wire(root) {
    root.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      switch (b.dataset.act) {
        case 'toggle-switch': state.switcherOpen = !state.switcherOpen; patchSwitcher(); break;
        case 'mark-done': {
          // Created-school completion → persists in TilliAPI (localStorage),
          // survives reload; re-read on patch so state is never cached stale.
          const c = child(); const sc = createdSchoolFor(c);
          if (sc) {
            API.markComplete(sc.school_id, b.dataset.phase, b.dataset.aud || 'Parent', c.student_id, b.dataset.assess, PARENT_EMAIL);
            patchCreated();
          }
          break;
        }
        case 'progress-tap': {
          const st = status();
          const open = ASSESSMENTS.find((a) => st[a.id] === 'progress');
          if (open) { st[open.id] = 'done'; patchHome(); }
          break;
        }
        case 'open-profile': set({ view: 'profile', switcherOpen: false }); window.scrollTo(0, 0); break;
        case 'back-phases': set({ view: 'phases', switcherOpen: false }); window.scrollTo(0, 0); break;
        case 'phase-open': set({ view: 'home', window: b.dataset.win, switcherOpen: false }); window.scrollTo(0, 0); break;
        case 'phase-report': set({ view: 'snapshot', window: b.dataset.win, switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'logout': location.href = 'index.html'; break;
        case 'open-snapshot': set({ view: 'snapshot', switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'open-last-report': set({ view: 'snapshot', window: b.dataset.win, switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'open-report': set({ view: 'report', switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'back-home': set({ view: 'home' }); window.scrollTo(0, 0); break;
        case 'save-pdf':
        case 'save-png': {
          state.saved = b.dataset.act === 'save-pdf' ? 'pdf' : 'png';
          patchSave();
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => { state.saved = ''; patchSave(); }, 1600);
          break;
        }
      }
    }));

    // assessment cards cycle pending → progress → done → pending
    root.querySelectorAll('[data-tap]').forEach((b) => b.addEventListener('click', () => {
      const st = status();
      const next = { pending: 'progress', progress: 'done', done: 'pending' };
      st[b.dataset.tap] = next[st[b.dataset.tap]] || 'pending';
      patchHome();
    }));

    // switcher / profile select — a child switch opens that child's phase overview
    root.querySelectorAll('[data-select]').forEach((b) => b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      set({ selected: +b.dataset.select, switcherOpen: false, view: 'phases', window: CURRENT_WINDOW });
    }));

  }

  // click outside closes switcher (targeted — no full render)
  document.addEventListener('click', () => {
    if (state.switcherOpen) { state.switcherOpen = false; patchSwitcher(); }
  });

  render();
})();
</script>
</body>
</html>
