  // ============================================================
  // CONSENT — the parent agrees before using the app (wording + version from
  // TilliAPI.consentConfig). Gate: shown in place of every screen until the
  // required box is ticked. From the profile: review / change any time.
  // ============================================================
  const hasConsentAPI = () => !!(API && API.needsConsent);
  const consentMissing = () => hasConsentAPI() && API.needsConsent(PARENT_EMAIL);
  function consentCardHTML() {
    if (!hasConsentAPI()) return '';
    const r = API.consentFor(PARENT_EMAIL);
    return `<div class="sec-head"><h2>${esc(T('parent.consentHead'))}</h2><span class="muted">${esc(r ? T('parent.agreedOn', { date: I18N.fmtDate(r.at) }) : T('parent.notGiven'))}</span></div>
      <button class="ui-card sm link kid-card focus" data-act="open-consent">
        <span class="kid-info"><b>${esc(T('parent.whatAgreed'))}</b><span>${esc(T('parent.readAgain'))}</span></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>`;
  }
  // Small toast at the bottom of the screen (one at a time).
  let toastTimer = null;
  function showToast(msg) {
    let t = document.getElementById('p-toast');
    if (!t) { t = document.createElement('div'); t.id = 'p-toast'; t.className = 'p-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
  }
  // Consent text may carry links written as [label](https://…) — e.g. "Privacy notice".
  // Escaped first, so only that one pattern becomes HTML.
  function consentText(t) {
    return esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => `<a class="btn-link" href="${url}" target="_blank" rel="noopener">${label}</a>`);
  }
  // Unsaved ticks on the profile version (saving only happens on Save).
  function consentDirty() {
    if (!state.consentPick || !hasConsentAPI()) return false;
    const r = API.consentFor(PARENT_EMAIL), was = (r && r.items) || {};
    return API.consentConfig().items.some((it) => !!state.consentPick[it.id] !== !!was[it.id]);
  }
  function consentView(gate) {
    const cfg = API.consentConfig();
    if (!state.consentPick) { const r = API.consentFor(PARENT_EMAIL); state.consentPick = Object.assign({}, r && r.items); }
    const pick = state.consentPick, ready = cfg.items.every((it) => !it.required || pick[it.id]);
    // Required = a * (with a "* required" note below); optional = "(optional)".
    const rows = cfg.items.map((it) => `<label class="consent-row">
        <input type="checkbox" data-consent="${esc(it.id)}"${pick[it.id] ? ' checked' : ''}>
        <span>${consentText(T('consent.item.' + it.id, it.text))}${it.required ? ' <b class="consent-req" aria-label="required">*</b>' : ` <span class="consent-opt">(${esc(T('consent.optional', 'Optional').toLowerCase())})</span>`}</span>
      </label>`).join('');
    const note = state.consentSaved && !gate ? T('consent.saved', 'Saved ✓')
      : gate
      ? (ready ? T('consent.changeLater', 'You can change this any time from your profile.') : T('consent.tickRequired', 'Tick the required box to continue. You can come back and do it later.'))
      : (ready ? T('consent.savesNow', 'Press Save to keep your changes.') : T('consent.stopsApp', 'Without the required box, the parent app stops until you tick it again.'));
    return `<div class="p-wrap">
      <div class="p-top">${lockup}
        <span class="ml-auto">${I18N.switcherHTML()}</span>
        ${gate ? `<button class="btn-ghost focus" data-act="logout">${esc(T('consent.notNowLogout', 'Not now — log out'))}</button>` : `<button class="btn-ghost focus" data-act="open-profile">&#8592; ${esc(T('consent.backProfile', 'Back to profile'))}</button>`}
      </div>
      <div class="p-main" data-rise>
        <p class="p-eyebrow tight">${esc(gate ? T('consent.oneThing', 'One thing first') : T('consent.yourProfile', 'Your profile'))}</p>
        <h1 class="p-title">${esc(gate ? T('consent.title', cfg.title) : T('consent.profileTitle', 'Consent & privacy'))}</h1>
        <p class="p-sub">${esc(T('consent.short', 'Choose what you’re happy to share.'))}</p>
        <details class="consent-why"><summary>${esc(T('consent.whyAsk', 'Why we ask'))}</summary><p>${consentText(T('consent.intro', cfg.intro))}</p></details>
        <div class="ui-card md consent-card">
          <label class="consent-row consent-all"><input type="checkbox" data-consentall${cfg.items.every((it) => pick[it.id]) ? ' checked' : ''}> <span><b>${esc(T('consent.agreeAll', 'I agree to all of the above'))}</b></span></label>
          ${rows}
          ${cfg.privacyUrl ? `<a class="btn-link" href="${esc(cfg.privacyUrl)}" target="_blank" rel="noopener">${esc(T('consent.privacy', 'Read the full privacy notice'))}</a>` : ''}
          ${cfg.items.some((it) => it.required) ? `<p class="muted consent-reqnote">${esc(T('consent.requiredNote', '* required'))}</p>` : ''}
          <p class="muted consent-note${state.consentSaved && !gate ? ' saved' : ''}">${esc(note)}</p>
          <button class="btn btn-primary focus" data-act="consent-save"${gate && !ready ? ' disabled' : ''}>${esc(gate ? T('consent.continue', 'Continue') : T('consent.save', 'Save'))}${gate ? ' &#8594;' : ''}</button>
        </div>
      </div>
    </div>`;
  }

  // ============================================================
  // Render + events
  // ============================================================
  // Full (re)mount of a view: rebuilds everything and plays the entrance
  // animation once. Only used for view/child transitions — never for in-place
  // edits, which patch their own region so the header can't re-fade.
  let painted = false;
  function render() {
    const paint = () => {
      // Created-school children get the REAL deployment-driven screen in place
      // of the demo phases/home views; profile/report/snapshot are unchanged.
      const gate = consentMissing() && state.view !== 'consent';
      const createdHome = createdSchoolFor(child()) && state.view !== 'profile'
        && state.view !== 'report' && state.view !== 'snapshot' && state.view !== 'consent';
      app.innerHTML = gate ? consentView(true)
        : state.view === 'consent' ? consentView(false)
        : createdHome ? createdView()
        : state.view === 'report' ? reportView()
        : state.view === 'snapshot' ? snapshotView()
        : state.view === 'profile' ? profileView()
        : state.view === 'phases' ? phasesView()
        : homeView();
      app.querySelectorAll('[data-rise]').forEach((el) => el.classList.add('tm-rise'));
      wire(app);
    };
    // Fade + subtle zoom between views (View Transitions API). The persistent
    // top bar is pinned via view-transition-name so only .p-main animates.
    // First paint and reduced-motion users get a plain, instant render.
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (painted && !reduce && document.startViewTransition) document.startViewTransition(paint);
    else paint();
    painted = true;
  }

  // Targeted patch: rebuild just .p-main's contents (home view). No tm-rise is
  // re-added, so the hero stays put instead of fading in on every tap.
  function patchHome() {
    const main = app.querySelector('.p-main');
    if (!main) return;
    main.innerHTML = homeMainInner();
    wire(main);
  }

  // Targeted patch: rebuild only the child switcher (open/close its menu)
  // without touching — or re-animating — the rest of the page.
  function patchSwitcher() {
    const cur = app.querySelector('.switcher');
    if (!cur) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = switcher();
    const next = tmp.firstElementChild;
    cur.replaceWith(next);
    wire(next);
  }

  // Targeted patch: just the two save-button labels (report/snapshot views).
  function patchSave() {
    const pdf = app.querySelector('[data-act="save-pdf"]');
    const png = app.querySelector('[data-act="save-png"]');
    if (pdf) pdf.textContent = T(state.saved === 'pdf' ? 'snap.downloaded' : 'snap.download');
    if (png) png.textContent = T(state.saved === 'png' ? 'snap.saved' : 'snap.saveImage');
  }

  let saveTimer;
  function wire(root) {
    // A locked step says why on tap (hover shows the same line as a tooltip).
    root.querySelectorAll('[data-locked]').forEach((b) => b.addEventListener('click', () => showToast(b.dataset.locked)));
    root.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      switch (b.dataset.act) {
        case 'toggle-switch': state.switcherOpen = !state.switcherOpen; patchSwitcher(); break;
        case 'year-view': state.yearView = b.dataset.yv === 'last' ? 'last' : 'this'; patchCreated(); break;
        case 'year-seen': {
          const sc = createdSchoolFor(child());
          try { localStorage.setItem(YEAR_SEEN + PARENT_EMAIL + '.' + (sc && sc.school_id) + '.' + b.dataset.year, '1'); } catch (e) { /* stays until reload */ }
          patchCreated(); break;
        }
        case 'mark-done': {
          // Created-school completion → persists in TilliAPI (localStorage),
          // survives reload; re-read on patch so state is never cached stale.
          const c = child(); const sc = createdSchoolFor(c);
          if (sc) {
            API.markComplete(sc.school_id, b.dataset.phase, b.dataset.aud || 'Parent', c.student_id, b.dataset.assess, PARENT_EMAIL);
            patchCreated();
          }
          break;
        }
        case 'progress-tap': {
          const st = status();
          const open = ASSESSMENTS.find((a) => st[a.id] === 'progress');
          if (open) { st[open.id] = 'done'; patchHome(); }
          break;
        }
        case 'open-profile':
          // Leaving Consent & privacy with ticks not saved → ask first.
          if (state.view === 'consent' && consentDirty() && !window.confirm(T('consent.leaveUnsaved', 'Leave without saving your changes?'))) break;
          state.consentPick = null; state.consentSaved = false;
          set({ view: 'profile', switcherOpen: false }); window.scrollTo(0, 0); break;
        case 'open-consent': state.consentPick = null; set({ view: 'consent', switcherOpen: false }); window.scrollTo(0, 0); break;
        case 'consent-save': {
          const cfg = API.consentConfig(), pick = state.consentPick || {};
          const gated = consentMissing();
          if (gated && !cfg.items.every((it) => !it.required || pick[it.id])) return;
          API.saveConsent(PARENT_EMAIL, pick);
          state.consentPick = null;
          // From the profile: stay put and say "Saved ✓" (it used to jump away silently).
          if (!gated && state.view === 'consent') { state.consentSaved = true; set({ switcherOpen: false }); break; }
          set({ view: gated || state.view !== 'consent' ? 'phases' : 'profile', switcherOpen: false });
          window.scrollTo(0, 0);
          break;
        }
        case 'back-phases': set({ view: 'phases', switcherOpen: false }); window.scrollTo(0, 0); break;
        case 'phase-open': set({ view: 'home', window: b.dataset.win, switcherOpen: false }); window.scrollTo(0, 0); break;
        case 'phase-report': set({ view: 'snapshot', window: b.dataset.win, switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'logout': try { localStorage.removeItem('tilliMeasures.session'); localStorage.removeItem('tilliMeasures.assessSession'); } catch (e) {} location.href = 'index.html'; break;
        case 'open-snapshot': set({ view: 'snapshot', switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'open-last-report': set({ view: 'snapshot', window: b.dataset.win, switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'open-report': set({ view: 'report', switcherOpen: false, saved: '' }); window.scrollTo(0, 0); break;
        case 'back-home': set({ view: 'home' }); window.scrollTo(0, 0); break;
        case 'save-pdf':
        case 'save-png': {
          state.saved = b.dataset.act === 'save-pdf' ? 'pdf' : 'png';
          patchSave();
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => { state.saved = ''; patchSave(); }, 1600);
          break;
        }
      }
    }));

    I18N.wire(root);   // language change → reload in the new language
    root.querySelectorAll('[data-consentall]').forEach((cb) => cb.addEventListener('change', () => {
      const all = {}; API.consentConfig().items.forEach((it) => { all[it.id] = cb.checked; });
      state.consentPick = all; state.consentSaved = false; render();
    }));
    root.querySelectorAll('[data-consent]').forEach((cb) => cb.addEventListener('change', () => {
      state.consentPick = Object.assign({}, state.consentPick, { [cb.dataset.consent]: cb.checked });
      state.consentSaved = false; render();
    }));

    // assessment cards cycle pending → progress → done → pending
    root.querySelectorAll('[data-tap]').forEach((b) => b.addEventListener('click', () => {
      const st = status();
      const next = { pending: 'progress', progress: 'done', done: 'pending' };
      st[b.dataset.tap] = next[st[b.dataset.tap]] || 'pending';
      patchHome();
    }));

    // switcher / profile select — a child switch opens that child's phase overview
    root.querySelectorAll('[data-select]').forEach((b) => b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      set({ selected: +b.dataset.select, switcherOpen: false, view: 'phases', window: CURRENT_WINDOW });
    }));

  }

  // click outside closes switcher (targeted — no full render)
  document.addEventListener('click', () => {
    if (state.switcherOpen) { state.switcherOpen = false; patchSwitcher(); }
  });

  render();
})();
</script>
</body>
</html>
