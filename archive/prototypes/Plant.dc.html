<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-block;line-height:0">
  <svg width="{{ w }}" height="{{ h }}" viewBox="0 0 120 150" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
    <defs>
      <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#DCE8D4" stop-opacity="0.9"></stop>
        <stop offset="100%" stop-color="#DCE8D4" stop-opacity="0"></stop>
      </radialGradient>
      <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#F6D5D9" stop-opacity="0.95"></stop>
        <stop offset="100%" stop-color="#F6D5D9" stop-opacity="0"></stop>
      </radialGradient>
    </defs>

    <!-- BLOSSOMING -->
    <sc-if value="{{ isBloss }}">
      <g>
        <ellipse cx="60" cy="70" rx="52" ry="52" fill="url(#glowP)"></ellipse>
        <path d="M60 112 Q57 86 60 58" stroke="#6E9863" stroke-width="5.5" fill="none" stroke-linecap="round"></path>
        <path d="M60 92 Q40 86 33 70 Q52 68 60 84 Z" fill="#9DBE8D"></path>
        <path d="M60 100 Q82 96 90 80 Q70 76 60 92 Z" fill="#7FAE72"></path>
        <ellipse cx="60" cy="52" rx="23" ry="24" fill="#9DBE8D"></ellipse>
        <ellipse cx="60" cy="52" rx="23" ry="24" fill="#DCE8D4" opacity="0.25"></ellipse>
        <!-- blossom petals -->
        <g>
          <circle cx="60" cy="30" r="9" fill="#F6D5D9"></circle>
          <circle cx="74" cy="40" r="9" fill="#F6D5D9"></circle>
          <circle cx="46" cy="40" r="9" fill="#F6D5D9"></circle>
          <circle cx="69" cy="55" r="8.5" fill="#EFA9B8" opacity="0.85"></circle>
          <circle cx="51" cy="55" r="8.5" fill="#EFA9B8" opacity="0.85"></circle>
          <circle cx="60" cy="44" r="7.5" fill="#F2CE7B"></circle>
        </g>
        <sc-if value="{{ face }}">
          <g>
            <circle cx="53" cy="52" r="2.6" fill="#3A3A3A"></circle>
            <circle cx="67" cy="52" r="2.6" fill="#3A3A3A"></circle>
            <path d="M54 60 Q60 65 66 60" stroke="#3A3A3A" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
            <circle cx="48" cy="58" r="2.4" fill="#EFA9B8" opacity="0.6"></circle>
            <circle cx="72" cy="58" r="2.4" fill="#EFA9B8" opacity="0.6"></circle>
          </g>
        </sc-if>
      </g>
    </sc-if>

    <!-- GROWING -->
    <sc-if value="{{ isGrow }}">
      <g>
        <ellipse cx="60" cy="80" rx="46" ry="46" fill="url(#glowG)"></ellipse>
        <path d="M60 112 Q58 92 60 68" stroke="#6E9863" stroke-width="5.5" fill="none" stroke-linecap="round"></path>
        <path d="M60 98 Q38 92 30 74 Q51 72 60 90 Z" fill="#9DBE8D"></path>
        <path d="M60 104 Q84 99 92 82 Q71 78 60 96 Z" fill="#7FAE72"></path>
        <ellipse cx="60" cy="62" rx="24" ry="25" fill="#9DBE8D"></ellipse>
        <path d="M60 40 Q68 48 60 62 Q52 48 60 40 Z" fill="#7FAE72"></path>
        <sc-if value="{{ face }}">
          <g>
            <circle cx="52" cy="62" r="2.7" fill="#3A3A3A"></circle>
            <circle cx="68" cy="62" r="2.7" fill="#3A3A3A"></circle>
            <path d="M53 70 Q60 75 67 70" stroke="#3A3A3A" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
            <circle cx="47" cy="68" r="2.3" fill="#EFA9B8" opacity="0.5"></circle>
            <circle cx="73" cy="68" r="2.3" fill="#EFA9B8" opacity="0.5"></circle>
          </g>
        </sc-if>
      </g>
    </sc-if>

    <!-- READY FOR TENDING -->
    <sc-if value="{{ isTend }}">
      <g>
        <path d="M60 112 Q59 100 60 88" stroke="#9DBE8D" stroke-width="5" fill="none" stroke-linecap="round"></path>
        <path d="M60 100 Q44 96 38 84 Q54 82 60 96 Z" fill="#B7CFA9"></path>
        <ellipse cx="60" cy="82" rx="18" ry="19" fill="#B7CFA9"></ellipse>
        <path d="M60 66 Q66 72 60 82 Q54 72 60 66 Z" fill="#9DBE8D"></path>
        <sc-if value="{{ face }}">
          <g>
            <path d="M50 82 Q53 85 56 82" stroke="#3A3A3A" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
            <path d="M64 82 Q67 85 70 82" stroke="#3A3A3A" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
            <path d="M55 89 Q60 92 65 89" stroke="#3A3A3A" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
          </g>
        </sc-if>
        <!-- watering-can cue -->
        <g transform="translate(84 40)">
          <circle cx="6" cy="8" r="15" fill="#D9E9F2"></circle>
          <path d="M-1 4 h10 a3 3 0 0 1 3 3 v5 a3 3 0 0 1 -3 3 h-10 a3 3 0 0 1 -3 -3 v-5 a3 3 0 0 1 3 -3 Z" fill="#A7CDE2"></path>
          <path d="M9 5 l7 -3 v3 Z" fill="#A7CDE2"></path>
          <path d="M-3 7 q-5 -2 -6 3" stroke="#A7CDE2" stroke-width="2" fill="none" stroke-linecap="round"></path>
          <path d="M-8 11 l-1 4 M-6 12 l0 4 M-4 12 l1 4" stroke="#A7CDE2" stroke-width="1.6" stroke-linecap="round"></path>
        </g>
      </g>
    </sc-if>

    <!-- WAITING FOR SUNSHINE -->
    <sc-if value="{{ isWait }}">
      <g>
        <circle cx="90" cy="34" r="10" fill="#F9E6B3"></circle>
        <path d="M90 18 v-6 M90 56 v6 M74 34 h-6 M106 34 h6 M79 23 l-4 -4 M101 45 l4 4 M101 23 l4 -4 M79 45 l-4 4" stroke="#F2CE7B" stroke-width="2" stroke-linecap="round"></path>
        <path d="M60 112 Q60 104 60 96" stroke="#9DBE8D" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="1 5"></path>
        <path d="M60 100 Q50 98 46 90 Q56 89 60 98 Z" fill="#C9DBBD"></path>
        <path d="M60 100 Q70 98 74 90 Q64 89 60 98 Z" fill="#C9DBBD"></path>
        <ellipse cx="60" cy="97" rx="6" ry="6.5" fill="#B7CFA9"></ellipse>
        <sc-if value="{{ face }}">
          <g>
            <path d="M56 96 Q57.5 98 59 96" stroke="#3A3A3A" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
            <path d="M61 96 Q62.5 98 64 96" stroke="#3A3A3A" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
          </g>
        </sc-if>
      </g>
    </sc-if>

    <!-- shared pot -->
    <g>
      <path d="M41 111 L79 111 L74 139 Q73 145 67 145 L53 145 Q47 145 46 139 Z" fill="#E8C4A8"></path>
      <path d="M41 111 L79 111 L77.5 119 L42.5 119 Z" fill="#DBB08C"></path>
      <rect x="37" y="105" width="46" height="11" rx="5.5" fill="#E3B896"></rect>
      <ellipse cx="60" cy="110.5" rx="20" ry="4.2" fill="#B08968"></ellipse>
    </g>

    <!-- growth sparkles -->
    <sc-if value="{{ grew }}">
      <g fill="#F2CE7B">
        <path d="M26 44 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6 Z"></path>
        <path d="M96 66 l1.2 3.4 3.4 1.2 -3.4 1.2 -1.2 3.4 -1.2 -3.4 -3.4 -1.2 3.4 -1.2 Z" fill="#EFA9B8"></path>
        <circle cx="40" cy="24" r="2.2" fill="#F6D5D9"></circle>
      </g>
    </sc-if>
  </svg>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:180},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;blossoming&quot;,&quot;growing&quot;,&quot;tending&quot;,&quot;waiting&quot;],&quot;default&quot;:&quot;growing&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:110,&quot;min&quot;:32,&quot;max&quot;:220,&quot;tsType&quot;:&quot;number&quot;},&quot;face&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;grew&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state || "growing";
    const size = Number(this.props.size) || 96;
    const face = this.props.face !== false && this.props.face !== "false" && size >= 52;
    const grew = this.props.grew === true || this.props.grew === "true";
    return {
      isBloss: state === "blossoming",
      isGrow: state === "growing",
      isTend: state === "tending",
      isWait: state === "waiting",
      face,
      grew: grew && (state === "blossoming" || state === "growing"),
      w: size,
      h: Math.round(size * 1.25),
    };
  }
}

</script>
</body>
</html>
