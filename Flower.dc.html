<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ wrap }}">
  <svg width="{{ w }}" height="{{ h }}" viewBox="0 0 60 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow:visible" stroke-linecap="round" stroke-linejoin="round">

    <!-- EXPERT: loose hand-drawn bloom on a wobbly stem -->
    <sc-if value="{{ isExpert }}">
      <g>
        <sc-if value="{{ stemA }}">
          <g>
            <path d="M31 100 C29 84 31 66 28 42" stroke="#2E9E4A" stroke-width="3" fill="none"></path>
            <path d="M29 66 C22 66 15 61 12 54 C20 54 27 59 30 64" stroke="#2E9E4A" stroke-width="2.6" fill="none"></path>
          </g>
        </sc-if>
        <sc-if value="{{ stemB }}">
          <g>
            <path d="M30 100 C32 82 27 64 29 42" stroke="#2E9E4A" stroke-width="2.8" fill="none"></path>
            <path d="M30 72 C37 73 44 69 48 62 C40 61 33 65 30 70" stroke="#2E9E4A" stroke-width="2.5" fill="none"></path>
          </g>
        </sc-if>
        <sc-if value="{{ stemC }}">
          <g>
            <path d="M30 100 C30 82 30 62 29 42" stroke="#2E9E4A" stroke-width="3.2" fill="none"></path>
            <path d="M29 60 C22 58 17 52 15 45 C22 46 28 51 30 57" stroke="#2E9E4A" stroke-width="2.5" fill="none"></path>
            <path d="M30 80 C36 80 41 77 44 71 C38 71 32 74 30 78" stroke="#2E9E4A" stroke-width="2.3" fill="none"></path>
          </g>
        </sc-if>

        <g fill="currentColor" fill-opacity="0.6" stroke="currentColor" stroke-width="2.2" opacity="{{ tint }}">
          <sc-if value="{{ v1 }}">
            <g>
              <g transform="rotate(-8 29 30)"><ellipse cx="29" cy="18" rx="10" ry="7.4"></ellipse></g>
              <g transform="rotate(64 29 30)"><ellipse cx="29" cy="18" rx="10" ry="7.4"></ellipse></g>
              <g transform="rotate(136 29 30)"><ellipse cx="29" cy="18" rx="10" ry="7.4"></ellipse></g>
              <g transform="rotate(208 29 30)"><ellipse cx="29" cy="18" rx="10" ry="7.4"></ellipse></g>
              <g transform="rotate(280 29 30)"><ellipse cx="29" cy="18" rx="10" ry="7.4"></ellipse></g>
            </g>
          </sc-if>
          <sc-if value="{{ v2 }}">
            <g>
              <g transform="rotate(-22 29 30)"><ellipse cx="29" cy="17" rx="11.5" ry="8"></ellipse></g>
              <g transform="rotate(68 29 30)"><ellipse cx="29" cy="17" rx="11.5" ry="8"></ellipse></g>
              <g transform="rotate(158 29 30)"><ellipse cx="29" cy="17" rx="11.5" ry="8"></ellipse></g>
              <g transform="rotate(248 29 30)"><ellipse cx="29" cy="17" rx="11.5" ry="8"></ellipse></g>
            </g>
          </sc-if>
          <sc-if value="{{ v3 }}">
            <g>
              <g transform="rotate(-14 29 30)"><path d="M29 29 C19 27 12 19 15 12 C22 8 30 17 29 29 Z"></path></g>
              <g transform="rotate(76 29 30)"><path d="M29 29 C19 27 12 19 15 12 C22 8 30 17 29 29 Z"></path></g>
              <g transform="rotate(166 29 30)"><path d="M29 29 C19 27 12 19 15 12 C22 8 30 17 29 29 Z"></path></g>
              <g transform="rotate(256 29 30)"><path d="M29 29 C19 27 12 19 15 12 C22 8 30 17 29 29 Z"></path></g>
            </g>
          </sc-if>
        </g>
        <circle cx="29" cy="30" r="{{ coreR }}" fill="currentColor" fill-opacity="0.55" stroke="currentColor" stroke-width="1.8" opacity="{{ tint }}"></circle>
      </g>
    </sc-if>

    <!-- LEARNER: single small petal opening at the tip -->
    <sc-if value="{{ isLearner }}">
      <g>
        <sc-if value="{{ stemA }}">
          <g>
            <path d="M30 100 C29 86 31 72 29 58" stroke="#2E9E4A" stroke-width="2.9" fill="none"></path>
            <path d="M30 80 C23 80 18 76 15 70 C22 70 28 74 30 78" stroke="#2E9E4A" stroke-width="2.5" fill="none"></path>
          </g>
        </sc-if>
        <sc-if value="{{ stemB }}">
          <g>
            <path d="M30 100 C32 86 28 72 30 58" stroke="#2E9E4A" stroke-width="2.8" fill="none"></path>
            <path d="M30 82 C37 82 43 78 46 72 C39 72 33 76 30 80" stroke="#2E9E4A" stroke-width="2.4" fill="none"></path>
          </g>
        </sc-if>
        <sc-if value="{{ stemC }}">
          <g>
            <path d="M30 100 C30 84 30 70 29 58" stroke="#2E9E4A" stroke-width="3" fill="none"></path>
            <path d="M29 74 C22 73 17 69 14 63 C21 63 27 67 30 72" stroke="#2E9E4A" stroke-width="2.4" fill="none"></path>
            <path d="M30 88 C36 88 41 85 43 80 C37 80 32 83 30 86" stroke="#2E9E4A" stroke-width="2.2" fill="none"></path>
          </g>
        </sc-if>
        <g opacity="{{ tint }}" fill="currentColor" fill-opacity="0.62" stroke="currentColor" stroke-width="2.1">
          <sc-if value="{{ budA }}"><g transform="rotate(-28 30 56)"><ellipse cx="33" cy="53" rx="7.4" ry="4.8"></ellipse></g></sc-if>
          <sc-if value="{{ budB }}"><g transform="rotate(24 30 56)"><ellipse cx="27" cy="52" rx="7" ry="5.2"></ellipse></g></sc-if>
          <sc-if value="{{ budC }}"><g transform="rotate(-8 30 56)"><path d="M30 58 C23 55 23 47 30 45 C37 47 37 55 30 58 Z"></path></g></sc-if>
        </g>
      </g>
    </sc-if>

    <!-- BEGINNER: green sprout, tip still furled -->
    <sc-if value="{{ isBeginner }}">
      <g stroke="#2E9E4A">
        <sc-if value="{{ stemA }}">
          <g>
            <path d="M30 100 C29 90 31 80 29 70" stroke-width="2.9" fill="none"></path>
            <path d="M29 86 C23 86 18 82 15 77 C21 77 27 80 29 84" stroke-width="2.5" fill="none"></path>
          </g>
        </sc-if>
        <sc-if value="{{ stemB }}">
          <g>
            <path d="M30 100 C32 90 28 80 30 70" stroke-width="2.8" fill="none"></path>
            <path d="M30 88 C36 88 42 85 45 79 C38 79 33 82 30 86" stroke-width="2.4" fill="none"></path>
          </g>
        </sc-if>
        <sc-if value="{{ stemC }}">
          <g>
            <path d="M30 100 C30 90 30 79 29 68" stroke-width="3" fill="none"></path>
            <path d="M29 84 C23 83 18 79 16 74 C22 74 27 77 30 82" stroke-width="2.4" fill="none"></path>
          </g>
        </sc-if>
        <g fill="#6FCB86" fill-opacity="0.6" stroke-width="2.2">
          <sc-if value="{{ budA }}"><g transform="rotate(34 30 70)"><ellipse cx="36" cy="68" rx="7" ry="4.4"></ellipse></g></sc-if>
          <sc-if value="{{ budB }}"><g transform="rotate(-30 30 70)"><ellipse cx="24" cy="67" rx="6.6" ry="4.6"></ellipse></g></sc-if>
          <sc-if value="{{ budC }}"><g transform="rotate(20 30 70)"><path d="M30 72 C25 70 25 64 31 63 C36 65 35 70 30 72 Z"></path></g></sc-if>
        </g>
      </g>
    </sc-if>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:200},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;expert&quot;,&quot;learner&quot;,&quot;beginner&quot;],&quot;default&quot;:&quot;expert&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5AA9E6&quot;,&quot;options&quot;:[&quot;#5AA9E6&quot;,&quot;#F0A84A&quot;,&quot;#EFA9B8&quot;,&quot;#A99BD6&quot;,&quot;#6FC3B8&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:54,&quot;min&quot;:20,&quot;max&quot;:160,&quot;tsType&quot;:&quot;number&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:96,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state || "learner";
    const size = Number(this.props.size) || 54;
    // Deterministic per-flower variation: stem curve, bloom shape, tilt, mirror, tint.
    const seed = Math.abs(Number(this.props.seed) || 0) % 97;
    const r = (k) => { const v = Math.sin((seed + 1) * (k * 12.9898 + 4.1414)) * 43758.5453; return v - Math.floor(v); };
    const pick = (k, n) => Math.floor(r(k) * n) % n;
    const stem = pick(1, 3), shape = pick(2, 3), bud = pick(3, 3);
    const tilt = (r(4) * 16 - 8).toFixed(1);
    const flip = pick(5, 2) === 1 ? -1 : 1;
    return {
      isExpert: state === "expert" || state === "blossoming",
      isLearner: state === "learner" || state === "growing",
      isBeginner: state === "beginner" || state === "tending" || state === "waiting",
      stemA: stem === 0, stemB: stem === 1, stemC: stem === 2,
      v1: shape === 0, v2: shape === 1, v3: shape === 2,
      budA: bud === 0, budB: bud === 1, budC: bud === 2,
      coreR: (4.4 + r(6) * 1.8).toFixed(1),
      tint: (0.88 + r(10) * 0.12).toFixed(2),
      wrap: {
        display: "inline-block", lineHeight: 0,
        color: this.props.color || "#5AA9E6",
        transform: `rotate(${tilt}deg) scaleX(${flip})`,
        transformOrigin: "50% 100%",
      },
      w: size,
      h: Math.round(size * 1.66),
    };
  }
}
</script>
</body>
</html>
