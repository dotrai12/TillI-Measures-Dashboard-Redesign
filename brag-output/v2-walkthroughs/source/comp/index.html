<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tilli Measures — walkthrough</title>
<style>
  @font-face { font-family: 'Quicksand'; font-weight: 300 700; src: url('fonts/quicksand-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 300 700; src: url('fonts/montserrat-normal-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F8F9FB; }
  * { box-sizing: border-box; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Montserrat', sans-serif; color: #141414; }
  .sky { position: absolute; inset: 0; background: linear-gradient(180deg, #EAF6FB 0%, #F8F9FB 50%, #F2FAEC 100%); }
  .sun { position: absolute; width: 340px; height: 340px; right: -90px; top: -130px; border-radius: 50%; background: radial-gradient(circle at 40% 60%, #FFE27A 0%, #FCC30B 70%); opacity: .5; }

  /* section caption (title + one line), like the reference tour */
  .cap { position: absolute; left: 0; right: 0; top: 46px; text-align: center; }
  .cap h2 { margin: 0; font: 700 56px/1.1 'Quicksand'; letter-spacing: -.01em; }
  .cap p { margin: 10px 0 0; font: 500 28px/1.35 'Montserrat'; color: #5B6170; }
  .cap p b { color: #348C11; font-weight: 700; }

  /* the app window; content is the real screenshot (1440×900 CSS px, 2× pixels) */
  #view { position: absolute; left: 0; right: 0; top: 176px; bottom: 0; overflow: hidden; }
  #win { position: absolute; left: 0; top: 0; width: 1440px; height: 940px; transform-origin: 0 0;
    border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 30px 80px rgba(20,20,20,.16), 0 0 0 1px rgba(20,20,20,.06); }
  .chrome { height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 16px; background: #F3F5F8; border-bottom: 1px solid #E6E9EE; }
  .chrome i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .chrome .url { margin-left: 18px; flex: 0 1 520px; height: 24px; border-radius: 12px; background: #fff; border: 1px solid #E6E9EE; font: 600 13px/22px 'Montserrat'; color: #5B6170; padding: 0 14px; }
  .shots { position: relative; width: 1440px; height: 900px; }
  .shots .shot { position: absolute; left: 0; top: 0; width: 1440px; height: 100%; opacity: 0; }
  .shots img.base { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; }
  /* a scrolling page: the tall capture of everything that scrolls, clipped to the scrolling area */
  .shots .clip { position: absolute; overflow: hidden; background: #fff; }
  .shots .clip img { position: absolute; left: 0; top: 0; }

  #cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 10; pointer-events: none; transform-origin: 3px 2px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.28)); }
  #ripple { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 3px solid #56C02B; z-index: 9; opacity: 0; }

  /* intro / outro lockup */
  .lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
  .lock .row { display: flex; align-items: center; gap: 20px; }
  .lock .row img { height: 120px; }
  .lock .row span { font: 700 74px 'Quicksand'; color: #348C11; }
  .lock h1 { margin: 6px 0 0; font: 700 64px/1.1 'Quicksand'; }
  .lock p { margin: 0; font: 500 30px 'Montserrat'; color: #5B6170; }
  .lock .who { font: 700 22px 'Montserrat'; letter-spacing: .08em; text-transform: uppercase; color: #348C11; background: #F1FFEC; border: 2px solid #BFE6AE; padding: 10px 22px; border-radius: 999px; }
  /* TIMELINE.line: one sentence in the website's pill, as the opening and closing card */
  .lock .pill { font: 500 40px/1.2 'Montserrat'; color: #141414; background: #fff; border: 3px solid #26BDE2; border-radius: 999px; padding: 22px 52px; }
  .lock .pill b { color: #1B7F99; font-weight: 700; }
  .lock .url { font: 700 30px 'Montserrat'; color: #1B7F99; background: #D9F5FF; border-radius: 999px; padding: 12px 30px; }
</style>
</head>
<body>
<div id="stage">
  <div class="sky"></div><div class="sun"></div>
  <div class="cap" id="cap"><h2 id="capT"></h2><p id="capS"></p></div>
  <div id="view">
    <div id="win"><div class="chrome"><i style="background:#E866B0"></i><i style="background:#FCC30B"></i><i style="background:#56C02B"></i><span class="url" id="url">measures.tilli.app</span></div><div class="shots" id="shots"></div></div>
  </div>
  <div id="ripple"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2 L3 19 L7.6 14.8 L10.6 21.4 L13.4 20.2 L10.4 13.7 L16.6 13.4 Z" fill="#141414" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div class="lock" id="intro"><div class="row"><img src="assets/tilli-wordmark-crop.png" alt=""><span>Measures</span></div><span class="who" id="introWho"></span><h1 id="introT"></h1></div>
  <div class="lock" id="outro"><div class="row"><img src="assets/tilli-wordmark-crop.png" alt=""><span>Measures</span></div><h1>See how every child is growing.</h1><span class="url">tillikids.com</span></div>
</div>
<script src="rects.js"></script>
<script src="timeline.js"></script>
<script>
(function () {
  'use strict';
  var V = window.TIMELINE, RECTS = window.RECTS || {};
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (x, a, b) { return x < a ? a : x > b ? b : x; };
  var ease = function (x) { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var lerp = function (a, b, p) { return a + (b - a) * p; };

  // ---- window geometry: the app (1440 × APP_H) shown at scale K inside #view ----
  // TIMELINE.layout overrides these per video (the teacher video uses a bigger window).
  var L = V.layout || {};
  var K = L.k || 0.86, CH = 40, VIEW_TOP = L.viewTop || 176, APP_H = L.appH || 900;
  var WX = (1920 - 1440 * K) / 2, WY = L.winTop == null ? 26 : L.winTop;   // window top-left inside #view
  var CENTER = { x: 960, y: (1080 - VIEW_TOP) / 2 + 10 };  // where a zoom focus drifts to (view coords)
  $('view').style.top = VIEW_TOP + 'px';
  $('win').style.height = (CH + APP_H) + 'px';
  $('shots').style.height = APP_H + 'px';
  if (L.capTop != null) $('cap').style.top = L.capTop + 'px';
  if (L.capTitle) $('capT').style.fontSize = L.capTitle + 'px';
  if (L.capLine) { $('capS').style.fontSize = L.capLine + 'px'; $('capS').style.marginTop = '6px'; }
  if (L.cursor) $('cursor').style.width = $('cursor').style.height = L.cursor + 'px';
  if (L.bg === 'white') { $('stage').style.background = '#fff'; [].forEach.call(document.querySelectorAll('.sky,.sun'), function (e) { e.style.display = 'none'; }); }
  var curT = 0;                                              // time of the frame being drawn
  function pt(target) {                                     // app point for a rect name or [x, y]
    if (Array.isArray(target)) return { x: target[0], y: target[1] };
    var r = RECTS[target.name || target]; if (!r) return { x: 720, y: 450 };
    var fx = target.fx == null ? 0.5 : target.fx, fy = target.fy == null ? 0.5 : target.fy;
    var sy = typeof r[4] === 'string' ? scrollNow(curT, r[4]) : 0;   // rect inside scrolling content
    return { x: r[0] + r[2] * fx + (target.dx || 0), y: r[1] + r[3] * fy + (target.dy || 0) - sy };
  }
  function zoomAt(t) {
    var cur = { s: 1, x: 720, y: 450 };
    (V.zoom || []).forEach(function (z) {
      if (t < z[0]) return;
      var f = pt(z[2] || [720, 450]), p = ease((t - z[0]) / (z[3] || 0.9));
      cur = { s: lerp(cur.s, z[1], p), x: lerp(cur.x, f.x, p), y: lerp(cur.y, f.y, p) };
    });
    return cur;
  }
  // view coords of an app point under zoom z
  function mapper(z) {
    var S = z.s * K, qx = z.x, qy = z.y + CH;
    var bx = WX + K * qx, by = WY + K * qy, w = clamp((z.s - 1) / 0.5, 0, 1);
    var Tx = lerp(bx, CENTER.x, w), Ty = lerp(by, CENTER.y, w);
    return { S: S, ox: Tx - S * qx, oy: Ty - S * qy, map: function (p) { return { x: Tx + S * (p.x - qx), y: Ty + S * (p.y + CH - qy) }; } };
  }

  // ---- scrolling: scroll: [time, channel, px | {to: rect, at: y}, seconds, clamp-to-shot] ----
  // One scroll position per channel ('doc' = the page, 'modal' = a scrolling dialog), eased
  // between keyframes like the zoom; each scrolling shot shows its channel's position.
  function scrollVal(k) {
    var v = k[2], max = k[4] && scrollInfo[k[4]] ? scrollInfo[k[4]].max : 1e9;
    if (typeof v !== 'number') { var r = RECTS[v.to]; v = r ? r[1] - (v.at == null ? 120 : v.at) : 0; }
    return clamp(v, 0, max);
  }
  function scrollAt(t, ch) {
    var cur = 0;
    (V.scroll || []).forEach(function (k) {
      if (k[1] !== ch || t < k[0]) return;
      cur = lerp(cur, scrollVal(k), k[3] ? ease((t - k[0]) / k[3]) : 1);
    });
    return cur;
  }
  function shotAt(t) { var list = V.shots, i = 0; for (var j = 0; j < list.length; j++) if (list[j][0] <= t) i = j; return list[i][1]; }
  function scrollNow(t, ch) {                               // as drawn: limited to the current page's length
    var info = scrollInfo[shotAt(t)], s = scrollAt(t, ch);
    return info && info.ch === ch ? clamp(s, 0, info.max) : Math.max(0, s);
  }

  // ---- shots ----
  var shotEls = {}, scrollInfo = {};
  (V.shots || []).forEach(function (s) {
    if (shotEls[s[1]]) return;
    var w = document.createElement('div'); w.className = 'shot';
    var im = document.createElement('img'); im.className = 'base'; im.src = 'shots/' + s[1] + '.png'; im.alt = ''; im.style.height = APP_H + 'px'; w.appendChild(im);
    var g = RECTS[s[1] + '@s'];
    if (g) {
      var clip = document.createElement('div'); clip.className = 'clip';
      clip.style.cssText = 'left:' + g[0] + 'px;top:' + g[1] + 'px;width:' + g[2] + 'px;height:' + g[3] + 'px';
      var tall = document.createElement('img'); tall.src = 'shots/' + s[1] + '@s.png'; tall.alt = '';
      tall.style.width = g[2] + 'px'; tall.style.height = (g[4] + g[3]) + 'px';
      clip.appendChild(tall); w.appendChild(clip);
      scrollInfo[s[1]] = { max: g[4], ch: g[5], img: tall };
    }
    $('shots').appendChild(w); shotEls[s[1]] = w;
  });
  function drawShots(t) {
    Object.keys(scrollInfo).forEach(function (k) {
      var info = scrollInfo[k];
      info.img.style.transform = 'translateY(' + (-clamp(scrollAt(t, info.ch), 0, info.max)) + 'px)';
    });
    var list = V.shots, i = -1;
    for (var j = 0; j < list.length; j++) if (list[j][0] <= t) i = j;
    Object.keys(shotEls).forEach(function (k) { shotEls[k].style.opacity = 0; shotEls[k].style.zIndex = 0; });
    if (i < 0) i = 0;
    var cur = list[i], prev = list[i - 1];
    var fade = cur[2] == null ? 0.3 : cur[2], a = fade > 0 ? ease((t - cur[0]) / fade) : 1;
    if (prev && a < 1) { shotEls[prev[1]].style.opacity = 1; shotEls[prev[1]].style.zIndex = 1; }
    shotEls[cur[1]].style.opacity = prev ? a : 1; shotEls[cur[1]].style.zIndex = 2;
    if (cur[3]) $('url').textContent = cur[3];
    else for (var u = i; u >= 0; u--) if (list[u][3]) { $('url').textContent = list[u][3]; break; }
  }

  // ---- captions: old out, then new in ----
  function drawCaption(t) {
    var C = V.captions, i = -1;
    for (var j = 0; j < C.length; j++) if (C[j][0] <= t) i = j;
    if (i < 0) { $('cap').style.opacity = 0; return; }
    var next = C[i + 1], lt = t - C[i][0];
    var a = ease((lt - 0.15) / 0.45) * (next ? 1 - ease((t - (next[0] - 0.3)) / 0.28) : 1);
    if (V.outro && t > V.outro) a *= 1 - ease((t - V.outro) / 0.4);
    $('capT').textContent = C[i][1]; $('capS').innerHTML = C[i][2];
    $('cap').style.opacity = a; $('cap').style.transform = 'translateY(' + ((1 - ease((lt - 0.15) / 0.45)) * 14) + 'px)';
  }

  // ---- cursor ----
  function cursorAt(t) {
    var K2 = V.cursor; if (!K2 || !K2.length || t < K2[0][0] || t > K2[K2.length - 1][0] + 0.6) return null;
    var a = K2[0], b = K2[0];
    for (var i = 0; i < K2.length - 1; i++) if (t >= K2[i][0] && t <= K2[i + 1][0]) { a = K2[i]; b = K2[i + 1]; break; }
    if (t > K2[K2.length - 1][0]) a = b = K2[K2.length - 1];
    var p = a === b ? 1 : ease((t - a[0]) / (b[0] - a[0])), pa = pt(a[1]), pb = pt(b[1]);
    return { x: lerp(pa.x, pb.x, p), y: lerp(pa.y, pb.y, p) };
  }

  window.render = function (t) {
    curT = t;
    var introEnd = V.intro || 0, outro = V.outro || 1e9;
    // intro lockup, then the window rises into place
    var io = t < introEnd - 0.7 ? 1 : 1 - ease((t - (introEnd - 0.7)) / 0.5);
    if (V.line) $('intro').style.opacity = io;                // on screen from frame 0, so a loop is seamless
    else {
      $('intro').style.opacity = t < 0.15 ? 0 : io * ease((t - 0.15) / 0.5);
      $('intro').style.transform = 'translateY(' + ((1 - ease((t - 0.15) / 0.5)) * 18) + 'px)';
    }
    var wIn = introEnd ? ease((t - (introEnd - 0.5)) / 0.8) : 1, wOut = ease((t - outro) / 0.7);
    // never fully 0: a hidden window isn't painted, so its first visible frames came up blank
    $('view').style.opacity = Math.max(0.002, wIn * (1 - wOut));
    var z = zoomAt(t), m = mapper(z);
    var lift = (1 - wIn) * 160 + wOut * 60, sc = 1 - wOut * 0.05;
    $('win').style.transform = 'translate(' + (m.ox + (1 - sc) * 720 * m.S) + 'px,' + (m.oy + lift) + 'px) scale(' + (m.S * sc) + ')';
    drawShots(t);
    drawCaption(t);
    $('outro').style.opacity = ease((t - outro - 0.5) / 0.6);
    if (!V.line) $('outro').style.transform = 'translateY(' + ((1 - ease((t - outro - 0.5) / 0.6)) * 18) + 'px)';
    // cursor + click ripple (in stage coords)
    var c = (!introEnd || t > introEnd - 0.2) && t < outro ? cursorAt(t) : null;
    if (c) {
      var v = m.map(c), press = 1;
      (V.clicks || []).forEach(function (ck) { var d = t - ck; if (d >= 0 && d < 0.2) press = 1 - Math.sin(d / 0.2 * Math.PI) * 0.18; });
      $('cursor').style.opacity = 1;
      $('cursor').style.transform = 'translate(' + (v.x - 3) + 'px,' + (v.y + VIEW_TOP + lift - 2) + 'px) scale(' + press + ')';
      var rp = 0; (V.clicks || []).forEach(function (ck) { var d = t - ck; if (d >= 0 && d < 0.5) rp = d / 0.5; });
      var rip = $('ripple');
      if (rp > 0) { var r = 10 + rp * 46; rip.style.opacity = (1 - rp) * 0.9; rip.style.width = rip.style.height = r + 'px'; rip.style.left = (v.x - r / 2) + 'px'; rip.style.top = (v.y + VIEW_TOP + lift - r / 2) + 'px'; }
      else rip.style.opacity = 0;
    } else { $('cursor').style.opacity = 0; $('ripple').style.opacity = 0; }
  };

  // The renderer awaits this: draw the frame, then make sure every screenshot on
  // screen is decoded (big PNGs are decoded lazily and can be evicted).
  window.renderAsync = function (t) {
    window.render(t);
    var on = [];
    Object.keys(shotEls).forEach(function (k) { if (+shotEls[k].style.opacity > 0) on = on.concat([].slice.call(shotEls[k].querySelectorAll('img'))); });
    return Promise.all(on.map(function (im) { return im.decode ? im.decode().catch(function () {}) : 0; })).then(function () { return 1; });
  };

  // ---- sound cues for the soundtrack ----
  var EV = [];
  (V.clicks || []).forEach(function (t) { EV.push({ t: t, kind: 'click' }); });
  (V.captions || []).forEach(function (c, i) { if (c[0] > 0.05) EV.push({ t: c[0], kind: 'chime', note: i % 3 }); });
  (V.shots || []).forEach(function (s) { if (s[2] === 0) EV.push({ t: s[0], kind: 'tick', note: 0 }); });
  (V.zoom || []).forEach(function (z) { if (z[1] > 1.01) EV.push({ t: z[0], kind: 'send' }); });
  if (V.intro && !V.line) EV.push({ t: 0.2, kind: 'success' });
  if (V.outro) EV.push({ t: V.outro + 0.5, kind: 'success' });
  window.__events = EV.sort(function (a, b) { return a.t - b.t; });
  window.__total = V.total; window.__poster = V.poster;
  $('introWho').textContent = V.who || ''; $('introT').textContent = V.title || '';
  if (V.line) $('intro').innerHTML = $('outro').innerHTML = '<div class="pill">' + V.line + '</div>';
  if (!V.intro) $('intro').style.display = 'none';
  if (!V.outro) $('outro').style.display = 'none';

  // Every screenshot fully decoded before the first frame (big PNGs otherwise
  // decode lazily and a snapshot can catch a blank window).
  window.__ready = Promise.all([document.fonts.ready].concat([].map.call(document.images, function (im) {
    return (im.complete ? Promise.resolve() : new Promise(function (r) { im.onload = im.onerror = r; })).then(function () { return im.decode ? im.decode().catch(function () {}) : 0; });
  })))
    .then(function () { return document.fonts.load('700 40px Quicksand'); }).then(function () { return document.fonts.load('500 30px Montserrat'); })
    .then(function () { window.render(0); return true; });
})();
</script>
</body>
</html>
