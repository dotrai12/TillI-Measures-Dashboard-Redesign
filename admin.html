<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures — Leadership</title>
<link rel="stylesheet" href="_ds/tilli/tokens/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css?v=20261016zm">
<style>
  /* ============================================================
     Tilli Measures — School Admin (leadership) dashboard chrome.
     Shared chrome / cards / chips / tables / modals come from the
     ui-* components in tilli.css; this block only holds what is
     unique to the leadership surface.
     Deliberately NO garden/plant metaphor anywhere (spec §1, §9):
     a calm, operational data surface for infrequent, high-stakes
     leadership visits.
     ============================================================ */
  :root {
    /* Admin's per-page accent is cyan (btn-outline hover, link buttons,
       role badge, crumbs, card hover) — everything else stays green. */
    --accent: var(--cyan-500);
    --accent-ink: var(--cyan-700);
    --accent-wash: var(--wash-cyan);
    --ad-side-w: 232px;
    --ad-header-h: 66px;
    --ad-gap: var(--page-gap);   /* alias kept for any old references */
    --ad-maxw: 1180px;
  }
  body { background: var(--surface-100); }

  /* ---- App grid: sidebar + (header / main) ---- */
  /* minmax(0,…) lets the content track shrink below its min-content, so a wide
     table scrolls inside its own .ui-tablewrap instead of forcing a page-wide
     horizontal scrollbar. */
  .ad-app { min-height: 100dvh; display: grid; grid-template-columns: var(--ad-side-w) minmax(0, 1fr); }
  /* min-width:0 lets the content column shrink below its children's intrinsic
     min-width (tables carry min-width:520–640px). Without it a wide card forces
     the track past the viewport and the whole page scrolls sideways. */
  .ad-app > * { min-width: 0; }

  /* ---- Sidebar / header extras (base styles: .ui-side, .ui-header) ---- */
  .ui-side .lockup { padding: 4px 8px 14px; }
  .ui-nav-item.disabled { color: var(--ink-300); cursor: default; }
  .ui-nav-item.disabled:hover { background: none; color: var(--ink-300); }
  .ad-year {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-100);
    border: 1px solid var(--line-200); border-radius: var(--radius-pill);
    padding: 6px 12px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600);
  }
  /* "Updated 2 h ago by …" header chip → History screen */
  .ad-updated { display: inline-flex; align-items: center; border: none; background: none; padding: 4px 6px; border-radius: var(--radius-sm); cursor: pointer; font: inherit; }
  .ad-updated:hover { background: var(--surface-100); }
  .ad-updated:hover .hist-last { color: var(--green-700); }
  /* Account dropdown — .ui-menu supplies the look; this only positions it. */
  .ad-acct-menu { position: absolute; top: calc(var(--ad-header-h) - 8px); right: clamp(16px, 3vw, 32px); z-index: 40; min-width: 220px; }

  /* ---- Main ---- */
  .ad-main { padding: var(--page-gap) clamp(16px, 3vw, 32px) 96px; }
  .ad-wrap { max-width: var(--ad-maxw); margin: 0 auto; }

  /* ---- Layout grids ---- */
  .ad-grid { display: grid; gap: var(--page-gap); }
  /* minmax(0,…) + min-width:0 on children: a card holding a min-width table must
     not stretch its 1fr track past half the row and overflow the page sideways. */
  .ad-grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ad-grid.tri { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ad-grid > * { min-width: 0; }

  /* ---- Cadence label (periodic modules) ---- */
  .ad-cadence {
    display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--wash-cyan); color: var(--cyan-700); border-radius: var(--radius-pill);
    padding: 5px 12px; font-weight: 700; font-size: var(--fs-xs);
  }
  .ad-cadence .next { color: var(--cyan-700); opacity: .72; }

  /* ---- Status line ---- */
  .ad-status {
    background: var(--white); border: 1px solid var(--line-200); border-left: 4px solid var(--cyan-500);
    border-radius: var(--radius-lg); padding: 16px 20px; font-family: var(--font-heading);
    font-weight: 600; font-size: var(--fs-lg); color: var(--ink-900); line-height: 1.5;
  }

  /* ---- Table extras (base: .ui-table) — sticky, sortable headers ---- */
  .ui-table th { position: sticky; top: 0; }
  .ui-table th.sortable { cursor: pointer; user-select: none; }
  .ui-table th.sortable:hover { color: var(--ink-900); }
  .ui-table th .arw { font-size: var(--fs-xs); margin-left: 4px; color: var(--cyan-500); }
  .ad-num { font-variant-numeric: tabular-nums; }

  /* ---- Stacked band bar ---- */
  .ad-bar { display: flex; height: 22px; border-radius: var(--radius-xs); overflow: hidden; background: var(--surface-100); }
  .ad-bar > span { display: block; height: 100%; }
  .ad-bar.slim { height: 14px; border-radius: var(--radius-xs); }
  .ad-skillrow { display: grid; grid-template-columns: 190px 1fr; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-200); }
  .ad-skillrow:last-child { border-bottom: none; }
  .ad-skillname { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .ad-skillname small { display: block; font-weight: 600; font-size: var(--fs-xs); color: var(--ink-300); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .ad-interp { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); line-height: 1.5; margin: 6px 0 0; }
  .ad-interp.placeholder { color: var(--warn-700); background: var(--warn-wash); border-radius: var(--radius-sm); padding: 8px 10px; display: inline-block; }

  /* ---- Collapsible skill buckets (Social-Emotional / Cognitive) ---- */
  .ad-bucket { border: 1px solid var(--line-200); border-radius: var(--radius-md); margin-bottom: 12px; overflow: hidden; background: var(--white); }
  .ad-bucket:last-child { margin-bottom: 0; }
  .ad-bucket-sum { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-100); user-select: none; }
  .ad-bucket-sum::-webkit-details-marker { display: none; }
  .ad-bucket-title { font-weight: 800; font-size: var(--fs-md); color: var(--ink-900); letter-spacing: .01em; }
  .ad-bucket-count { font-weight: 700; font-size: var(--fs-xs); color: var(--ink-300); text-transform: uppercase; letter-spacing: .04em; margin-left: auto; }
  .ad-bucket-chev { font-size: var(--fs-sm); color: var(--ink-450); transition: transform .18s var(--ease); }
  .ad-bucket[open] .ad-bucket-chev { transform: rotate(0deg); }
  .ad-bucket:not([open]) .ad-bucket-chev { transform: rotate(-90deg); }
  .ad-bucket-body { padding: 4px 16px 8px; }

  /* ---- Progress-over-time stacked-area chart ---- */
  .ad-proghead { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .ad-progselects { display: flex; gap: 10px; flex-wrap: wrap; }
  .ad-proghead .select-wrap { min-width: 150px; }
  .ad-progcap { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-450); margin: 2px 0 12px; }
  .ad-progchart { width: 100%; }
  .ad-progchart svg { display: block; width: 100%; overflow: hidden; }
  .ad-progfuts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .ad-progfut { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-300); background: var(--surface-100); border: 1px dashed var(--line-200); border-radius: var(--radius-pill); padding: 4px 11px; }
  .ad-progfut i { font-style: normal; font-weight: 800; color: var(--ink-450); }

  /* ---- Filters bar ---- */
  .ad-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: var(--page-gap); }
  .ad-filters .select-wrap { min-width: 150px; }
  .ad-refresh { margin-left: auto; }

  /* ---- States ---- */
  .ad-err { text-align: center; padding: 24px; color: var(--danger-700); font-weight: 700; font-size: var(--fs-sm); }
  .ad-err button { margin-top: 12px; }
  .ad-skel { height: 14px; border-radius: var(--radius-xs); margin: 8px 0; }

  /* ---- Concern rows ---- */
  .ad-concern { border: 1px solid var(--line-200); border-radius: var(--radius-lg); padding: 15px 17px; }
  .ad-concern + .ad-concern { margin-top: 12px; }
  .ad-concern .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ad-concern .who { font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .ad-concern .meta { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-300); margin-top: 2px; }
  .ad-concern .note { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); line-height: 1.55; margin: 10px 0 0; }
  .ad-concern .outcome { background: var(--surface-100); border-radius: var(--radius-sm); padding: 9px 12px; font-size: var(--fs-sm); color: var(--ink-450); font-weight: 600; margin-top: 10px; }
  .ad-concern .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* ============================================================
     Hover info boxes (tooltips). One trigger class `.ad-tip` with
     a `data-tip="..."` string; the bubble is drawn with ::after and
     the arrow with ::before, so no JS wiring is needed and they
     survive every re-render. `.ad-info` is the little ⓘ affordance.
     Modifiers: `.down` opens the bubble below (used inside the
     scroll-clipped table headers); `.end` right-anchors it so a
     right-edge trigger doesn't overflow. `--tx` carries the x-offset
     so the same hover-reset works for centred and end-anchored tips.
     ============================================================ */
  .ad-tip { position: relative; display: inline-flex; align-items: center; cursor: help; }
  .ad-tip:hover, .ad-tip:focus-within { z-index: 70; }
  .ad-tip:focus { outline: none; }
  .ad-tip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-xs); }
  .ad-info {
    display: inline-grid; place-items: center; flex: none;
    width: 15px; height: 15px; margin-left: 5px; border-radius: 50%;
    border: 1.3px solid var(--ink-300); color: var(--ink-300);
    font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xs); line-height: 1;
    text-transform: none; letter-spacing: 0; transition: border-color .15s, color .15s;
  }
  .ad-tip:hover .ad-info, .ad-tip:focus-within .ad-info { border-color: var(--cyan-500); color: var(--cyan-700); }

  .ad-tip[data-tip]::after {
    content: attr(data-tip); --tx: -50%;
    position: absolute; left: 50%; bottom: calc(100% + 9px);
    transform: translate(var(--tx), 4px);
    width: max-content; max-width: 240px; white-space: normal; text-align: left;
    background: var(--ink-900); color: var(--white);
    font-family: var(--font-body); font-weight: 600; font-size: var(--fs-sm); line-height: 1.45;
    letter-spacing: 0; text-transform: none;
    padding: 9px 12px; border-radius: var(--radius-sm); box-shadow: var(--shadow-pop);
    opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s;
  }
  .ad-tip[data-tip]::before {
    content: ''; position: absolute; left: 50%; bottom: calc(100% + 3px);
    transform: translate(-50%, 4px); border: 6px solid transparent; border-top-color: var(--ink-900);
    opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s;
  }
  .ad-tip.down[data-tip]::after { bottom: auto; top: calc(100% + 9px); transform: translate(var(--tx), -4px); }
  .ad-tip.down[data-tip]::before { bottom: auto; top: calc(100% + 3px); transform: translate(-50%, -4px); border-top-color: transparent; border-bottom-color: var(--ink-900); }
  .ad-tip.end[data-tip]::after { --tx: 0; left: auto; right: 0; }
  .ad-tip.end[data-tip]::before { display: none; }
  .ad-tip:hover::after, .ad-tip:focus-within::after { opacity: 1; transform: translate(var(--tx), 0); }
  .ad-tip:hover::before, .ad-tip:focus-within::before { opacity: 1; transform: translate(-50%, 0); }

  /* ---- Copy block (newsletter / message / note textareas) ---- */
  .ad-copyblock { border: 1px solid var(--line-200); border-radius: var(--radius-md); padding: 14px; font-family: var(--font-body); font-size: var(--fs-md); line-height: 1.6; color: var(--ink-700); width: 100%; resize: vertical; min-height: 150px; }
  .ad-copyblock:focus { outline: none; border-color: var(--focus); }
  .ad-copyblock.sm { min-height: 110px; }

  /* ============================================================
     Mockup-inspired additive modules (same DS tokens/colours).
     ============================================================ */

  /* ---- Meta chip row (Overview quick counts; chips are .ui-metachip) ---- */
  .ad-chiprow { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: var(--page-gap); }

  /* ---- Grade / section navigator cards (Outcomes drill) ---- */
  .ad-navcards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--page-gap); }
  .ad-navcards > * { min-width: 0; }
  .ad-navcard { display: block; width: 100%; text-align: left; background: var(--white); border: 1px solid var(--line-200); border-radius: var(--radius-card); padding: 16px 18px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .ad-navcard:hover { border-color: var(--accent); box-shadow: var(--shadow-hover); }
  .ad-navcard .nc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ad-navcard .nc-name { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .ad-navcard .nc-meta { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-300); margin: 4px 0 12px; }
  .ad-navcard .nc-pcts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 9px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }

  /* ---- Per-grade breakdown (Outcomes school scope — Overview snapshot format) ---- */
  .ad-gradebreaks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--page-gap); }
  @media (max-width: 900px) { .ad-gradebreaks { grid-template-columns: 1fr; } }
  .ad-gradebreak { border: 1px solid var(--line-200); border-radius: var(--radius-card); padding: 16px 18px; background: var(--white); }
  .ad-gradebreak .gb-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .ad-gradebreak .gb-name { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-lg); color: var(--ink-900); }
  .ad-gradebreak .gb-meta { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-300); margin-top: 4px; }
  .ad-gradebreak .gb-snap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 14px 0 16px; }
  .ad-gradebreak .gb-bar { flex: 1; min-width: 220px; }
  .ad-gradebreak .gb-gs { margin: 0; }

  /* ---- Grade drill snapshot (Outcomes grade scope — mirrors the grade card's headline) ---- */
  .ad-gradesnap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 4px 0 20px; }
  .ad-gradesnap .gs-bar { flex: 1; min-width: 220px; }

  /* ---- Areas of growth / strength (--band / --bandwash set inline from the level scale) ---- */
  /* Student class history (leadership) — no levels, history + notes only */
  .ad-hist-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-200); }
  .ad-hist-row:first-child { padding-top: 0; }
  .ad-hist-row:last-child { border-bottom: none; padding-bottom: 0; }
  .ad-hist-row .ui-dot { margin-top: 6px; }
  .ad-hist-t { font-family: var(--font-heading); font-size: var(--fs-md); color: var(--ink-900); }
  .ad-hist-y { font-weight: 700; font-size: var(--fs-sm); }
  .ad-hist-sub { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 2px; }
  .ad-hist-note { background: var(--surface-100); border-radius: var(--radius-md); padding: 10px 12px; margin-top: 8px; }
  .ad-hist-note p { margin: 0; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); line-height: 1.55; }
  .ad-gs { border-radius: var(--radius-card); padding: 16px 18px; border: 1.5px solid var(--band, var(--line-200)); background: var(--bandwash, var(--white)); }
  .ad-gs h4 { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); margin: 0 0 10px; color: var(--ink-900); }
  .ad-gs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .ad-gs li { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700); }
  .ad-gs li .p { font-weight: 800; font-size: var(--fs-sm); color: var(--ink-450); }
  /* Overview growth/strength header: scope pill + drill-in link */
  .ad-gs-head { display: flex; align-items: center; gap: 12px; }
  .ad-scopepill { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700); background: var(--surface-100); border: 1.5px solid var(--line-200); border-radius: var(--radius-pill); padding: 6px 14px; }

  /* ---- Compare two classes (Outcomes) — two full section reads, side by side ---- */
  .cmp-head { margin-bottom: 18px; }
  .cmp-head-kicker { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-450); }
  .cmp-head-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
  .cmp-head-title { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl); color: var(--ink-900); margin: 0; }
  .cmp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--page-gap); align-items: start; }
  .cmp-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .cmp-select { width: 100%; }
  .cmp-select .select { width: 100%; text-align: center; font-family: var(--font-heading); font-weight: 700; }
  .cmp-body { display: flex; flex-direction: column; gap: 18px; }
  .cmp-gs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cmp-legend { margin: -4px 0 -6px; }
  .cmp-skills { display: flex; flex-direction: column; }
  .cmp-skillrow { display: grid; grid-template-columns: minmax(84px, 1.05fr) 1.5fr auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-200); }
  .cmp-skillrow:last-child { border-bottom: none; }
  .cmp-sk-name { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700); line-height: 1.25; }
  .cmp-sk-bar { min-width: 0; }
  .cmp-sk-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: var(--fs-sm); white-space: nowrap; justify-self: end; }
  .cmp-sk-status i { width: 8px; height: 8px; border-radius: var(--radius-pill); flex: none; }
  .cmp-radar { margin-top: 2px; }
  @media (max-width: 860px) { .cmp-cols { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) { .cmp-gs { grid-template-columns: minmax(0, 1fr); } }

  /* ---- Multi-perspective radar (legend is .ui-legend) ---- */
  .ad-radar-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ad-radar-wrap svg { width: 100%; max-width: 380px; height: auto; }
  .ad-radar-wrap .ui-legend { justify-content: center; margin-top: 0; }

  /* ---- Mobile bottom tab bar (.ui-bottomnav) — shown ≤860px only ---- */
  .ui-bottomnav { display: none; }

  @media (max-width: 860px) {
    /* minmax(0,1fr) + min-width:0 lets the single column actually shrink to the
       viewport. Without this, the tables' min-width:640px forces the whole grid
       track wider than the screen and the entire page scrolls sideways (clipping
       content) instead of the tables scrolling inside their own wrapper. */
    .ad-app { grid-template-columns: minmax(0, 1fr); overflow-x: clip; }
    .ad-app > * { min-width: 0; }
    .ui-side { display: none; }
    /* Same minmax(0,1fr) + min-width:0 on every inner grid: a child with an
       intrinsic min-width (e.g. a table's min-width:420px) must NOT be able to
       stretch its track past the viewport and re-introduce sideways page scroll
       (which also drags the fixed bottom nav along). */
    .ad-grid.two, .ad-grid.tri { grid-template-columns: minmax(0, 1fr); }
    .ad-navcards { grid-template-columns: minmax(0, 1fr); }
    .ad-grid > *, .ad-navcards > * { min-width: 0; }
    .ad-skillrow { grid-template-columns: 1fr; gap: 8px; }
    .ad-main { padding-bottom: 96px; }
    .ui-bottomnav { display: flex; }
    .ui-header { gap: 10px; padding: 0 16px; }
    .ui-header .ad-year, .ui-header .desk-only { display: none; }
    /* Let the school-name block shrink and truncate instead of wrapping past the fixed header height. */
    .ui-header > div:first-child { min-width: 0; }
    .ui-header .ui-h-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }

  /* ---- Phone-specific tightening (portrait) ---- */
  @media (max-width: 560px) {
    .ad-main { padding: 16px 14px 96px; }
    .ad-main .ui-card:not(.tight):not(.pad0):not(.sm):not(.md) { padding: 15px 14px; }
    /* Role badge is redundant on a phone and steals header width — drop it, keep the avatar. */
    .ui-header .ui-rolebadge { display: none; }
    .ui-header .ui-avatar { width: 34px; height: 34px; }
    /* Filters go full-width and stack cleanly; hide the decorative divider span. */
    .ad-filters .select-wrap { min-width: 0; flex: 1 1 46%; }
    .ad-filters .input { flex: 1 1 100%; max-width: none !important; }
    .ad-filters .ad-refresh { margin-left: 0; flex: 1 1 100%; }
    .ad-filters > span[style] { display: none; }
    .ui-bottomnav button { letter-spacing: -0.01em; gap: 2px; }
  }

  /* ============================================================
     Verdict banner (feedback §1/§3) — the one-line answer at the top
     of Overview. Lead with the conclusion; evidence sits below it.
     ============================================================ */
  .ad-verdict { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .ad-verdict.good { border-left-color: var(--green-500); }
  .ad-verdict.watch { border-left-color: var(--warn-500); }
  .ad-verdict-main { flex: 1 1 300px; min-width: 260px; }

  /* ---- Band-bar target marker (feedback §2) — "compared to what?" ----

  .ad-barwrap { position: relative; }

  .ad-targetdelta.met { color: var(--green-700); }

  .ask-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 11px; background: var(--surface-100); }

  .ask-msg.tilli { background: var(--white); border: 1px solid var(--line-200); color: var(--ink-700); align-self: flex-start; border-bottom-left-radius: 5px; }
  .ask-msg.me { background: var(--green-600); color: var(--white); align-self: flex-end; border-bottom-right-radius: 5px; }
  .ask-msg b { font-weight: 800; }
  .ask-sugs { display: flex; flex-wrap: wrap; gap: 7px; align-self: flex-start; }
  .ask-foot { display: flex; gap: 8px; padding: 11px; border-top: 1px solid var(--line-200); background: var(--white); }
  .ask-input { flex: 1; border: 1px solid var(--line-200); border-radius: var(--radius-pill); padding: 10px 15px; font-family: var(--font-body); font-size: var(--fs-sm); color: var(--ink-900); outline: none; }
  .ask-input:focus { border-color: var(--focus); }
  .ask-send { border: none; background: var(--green-600); color: var(--white); border-radius: 50%; width: 40px; height: 40px; flex: none; cursor: pointer; font-size: var(--fs-md); }
  .ask-send:hover { background: var(--green-700); }

  /* Ask Tilli full screen (nav destination) — same engine, roomier shell. */
  .ask-screen { max-width: 720px; }
  .ask-shell { display: flex; flex-direction: column; height: min(62dvh, 560px); border: 1px solid var(--line-200); border-radius: var(--radius-card); overflow: hidden; background: var(--white); }

  /* ---- Preview-stage panel (demo tooling; remove to ship) ---- */
