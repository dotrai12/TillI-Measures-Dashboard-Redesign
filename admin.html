<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures — Leadership</title>
<link rel="stylesheet" href="_ds/tilli/tokens/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css?v=20261019d">
<style>
  /* ============================================================
     Tilli Measures — School Admin (leadership) dashboard chrome.
     Shared chrome / cards / chips / tables / modals come from the
     ui-* components in tilli.css; this block only holds what is
     unique to the leadership surface.
     Deliberately NO garden/plant metaphor anywhere (spec §1, §9):
     a calm, operational data surface for infrequent, high-stakes
     leadership visits.
     ============================================================ */
  :root {
    /* Accent, sidebar width, header height, content width and page padding
       all come from tilli.css tokens — same values as the teacher dashboard. */
  }
  body { background: var(--white); }   /* pure white, same as the teacher dashboard — cards keep their 1px border */

  /* ---- App grid: sidebar + (header / main) ---- */
  /* minmax(0,…) lets the content track shrink below its min-content, so a wide
     table scrolls inside its own .ui-tablewrap instead of forcing a page-wide
     horizontal scrollbar. */
  .ad-app { min-height: 100dvh; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); }
  /* min-width:0 lets the content column shrink below its children's intrinsic
     min-width (tables carry min-width:520–640px). Without it a wide card forces
     the track past the viewport and the whole page scrolls sideways. */
  .ad-app > * { min-width: 0; }

  /* ---- Sidebar / header extras (base styles: .ui-side, .ui-header) ---- */
  .ui-nav-item.disabled { color: var(--ink-300); cursor: default; }
  .ui-nav-item.disabled:hover { background: none; color: var(--ink-300); }
  .ad-year {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-100);
    border: 1px solid var(--line-200); border-radius: var(--radius-pill);
    padding: 6px 12px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600);
  }
  /* "Updated 2 h ago by …" header chip → History screen */
  .ad-updated { display: inline-flex; align-items: center; border: none; background: none; padding: 4px 6px; border-radius: var(--radius-sm); cursor: pointer; font: inherit; }
  .ad-updated:hover { background: var(--surface-100); }
  .ad-updated:hover .hist-last { color: var(--green-700); }

  /* ---- Main ---- */
  .ad-main { padding: var(--page-pad-y) var(--page-pad-x) 96px; }
  .ad-wrap { max-width: var(--content-max); margin: 0 auto; }

  /* ---- Layout grids ---- */
  .ad-grid { display: grid; gap: var(--page-gap); }
  /* minmax(0,…) + min-width:0 on children: a card holding a min-width table must
     not stretch its 1fr track past half the row and overflow the page sideways. */
  .ad-grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ad-grid.tri { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ad-grid > * { min-width: 0; }

  /* ---- Cadence label (periodic modules) — a .ui-chip.info that can wrap ---- */
  .ad-cadence { gap: 8px; flex-wrap: wrap; white-space: normal; }
  .ad-cadence .next { opacity: .72; }

  /* ---- Table extras (base: .ui-table) — sticky, sortable headers ---- */
  .ui-table th { position: sticky; top: 0; }
  .ui-table th.sortable { cursor: pointer; user-select: none; }
  .ui-table th.sortable:hover { color: var(--ink-900); }
  .ui-table th .arw { font-size: var(--fs-xs); margin-left: 4px; color: var(--accent); }
  .ad-num { font-variant-numeric: tabular-nums; }

  /* ---- Skill rows (band bar = .ui-bandbar, tilli.css) ---- */
  .ad-skillrow { display: grid; grid-template-columns: 190px 1fr; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-200); }
  .ad-skillrow:last-child { border-bottom: none; }
  .ad-skillname { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .ad-skillname small { display: block; font-weight: 600; font-size: var(--fs-xs); color: var(--text-meta); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .ad-interp { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); line-height: 1.5; margin: 6px 0 0; }

  /* ---- Collapsible skill buckets (Social-Emotional / Cognitive) ---- */
  .ad-bucket { border: 1px solid var(--line-200); border-radius: var(--radius-md); margin-bottom: 12px; overflow: hidden; background: var(--white); }
  .ad-bucket:last-child { margin-bottom: 0; }
  .ad-bucket-sum { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-100); user-select: none; }
  .ad-bucket-sum::-webkit-details-marker { display: none; }
  .ad-bucket-title { font-weight: 800; font-size: var(--fs-md); color: var(--ink-900); letter-spacing: .01em; }
  .ad-bucket-count { font-weight: 700; font-size: var(--fs-xs); color: var(--text-meta); text-transform: uppercase; letter-spacing: .04em; margin-left: auto; }
  .ad-bucket-chev { font-size: var(--fs-sm); color: var(--ink-450); transition: transform .18s var(--ease); }
  .ad-bucket[open] .ad-bucket-chev { transform: rotate(0deg); }
  .ad-bucket:not([open]) .ad-bucket-chev { transform: rotate(-90deg); }
  .ad-bucket-body { padding: 4px 16px 8px; }

  /* ---- Progress-over-time stacked-area chart ---- */
  .ad-proghead { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .ad-progselects { display: flex; gap: 10px; flex-wrap: wrap; }
  .ad-proghead .select-wrap { min-width: 150px; }
  .ad-progcap { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-450); margin: 2px 0 12px; }
  .ad-progchart { width: 100%; }
  .ad-progchart svg { display: block; width: 100%; overflow: hidden; }
  .ad-progfuts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .ad-progfut { gap: 6px; }   /* .ui-metachip.dashed */
  .ad-progfut i { font-style: normal; font-weight: 800; color: var(--ink-450); }

  /* ---- Filters bar ---- */
  .ad-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: var(--page-gap); }
  .ad-filters .select-wrap { min-width: 150px; }

  /* ---- States ---- */
  .ad-err { text-align: center; padding: 24px; color: var(--danger-700); font-weight: 700; font-size: var(--fs-sm); }
  .ad-err button { margin-top: 12px; }
  .ad-skel { height: 14px; border-radius: var(--radius-xs); margin: 8px 0; }

  /* ---- Concern rows ---- */
  .ad-concern + .ad-concern { margin-top: 12px; }
  .ad-concern .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ad-concern .who { font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .ad-concern .meta { margin-top: 2px; }   /* .ui-meta */
  .ad-concern .note { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); line-height: 1.55; margin: 10px 0 0; }
  .ad-concern .outcome { margin-top: 10px; }   /* .ui-inset */
  .ad-concern .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* Hover info boxes: .ui-tooltip.help + .ui-info (tilli.css), shared with the teacher dashboard. */

  /* ---- Copy block (newsletter / message / note textareas) ---- */
  .ad-copyblock { border: 1px solid var(--line-200); border-radius: var(--radius-md); padding: 14px; font-family: var(--font-body); font-size: var(--fs-md); line-height: 1.6; color: var(--ink-700); width: 100%; resize: vertical; min-height: 150px; }
  .ad-copyblock:focus { outline: none; border-color: var(--focus); }
  .ad-copyblock.sm { min-height: 110px; }

  /* ============================================================
     Mockup-inspired additive modules (same DS tokens/colours).
     ============================================================ */


  /* ---- Grade / section navigator cards (Outcomes drill) ---- */
  .ad-navcards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--page-gap); }
  .ad-navcards > * { min-width: 0; }
  .ad-navcard { display: block; width: 100%; text-align: left; font: inherit; }   /* .ui-card.tight.link */
  .ad-navcard .nc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ad-navcard .nc-meta { margin: 4px 0 12px; }   /* .ui-meta */
  .ad-navcard .nc-pcts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 9px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }

  /* ---- Per-grade breakdown (Outcomes school scope — Overview snapshot format) ---- */
  .ad-gradebreaks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--page-gap); }
  @media (max-width: 900px) { .ad-gradebreaks { grid-template-columns: 1fr; } }
  /* .ad-gradebreak = .ui-card.tight; name = .ui-title, meta = .ui-meta */
  .ad-gradebreak .gb-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .ad-gradebreak .gb-meta { margin-top: 4px; }
  .ad-gradebreak .gb-snap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 14px 0 16px; }
  .ad-gradebreak .gb-bar { flex: 1; min-width: 220px; }
  .ad-gradebreak .gb-gs { margin: 0; }

  /* ---- Grade drill snapshot (Outcomes grade scope — mirrors the grade card's headline) ---- */
  .ad-gradesnap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 4px 0 20px; }
  .ad-gradesnap .gs-bar { flex: 1; min-width: 220px; }

  /* ---- Areas of growth / strength (--band / --bandwash set inline from the level scale) ---- */
  /* Student class history (leadership) — no levels, history + notes only */
  .ad-hist-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-200); }
  .ad-hist-row:first-child { padding-top: 0; }
  .ad-hist-row:last-child { border-bottom: none; padding-bottom: 0; }
  .ad-hist-row .ui-dot { margin-top: 6px; }
  .ad-hist-t { font-family: var(--font-heading); font-size: var(--fs-md); color: var(--ink-900); }
  .ad-hist-y { font-weight: 700; font-size: var(--fs-sm); }
  .ad-hist-sub { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 2px; }
  .ad-hist-note { margin-top: 8px; }   /* .ui-inset */
  .ad-gs { border-radius: var(--radius-card); padding: 16px 18px; border: 1.5px solid var(--band, var(--line-200)); background: var(--bandwash, var(--white)); }
  .ad-gs h4 { margin: 0 0 10px; }   /* .ui-title.md */
  .ad-gs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .ad-gs li { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700); }
  .ad-gs li .p { font-weight: 800; font-size: var(--fs-sm); color: var(--ink-450); }
  /* Overview growth/strength header: scope pill + drill-in link */

  /* ---- Compare two classes (Outcomes) — two full section reads, side by side ---- */
  .cmp-head { margin-bottom: 18px; }
  .cmp-head-kicker { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-450); }
  .cmp-head-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
  .cmp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--page-gap); align-items: start; }
  .cmp-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .cmp-select { width: 100%; }
  .cmp-select .select { width: 100%; text-align: center; font-family: var(--font-heading); font-weight: 700; }
  .cmp-body { display: flex; flex-direction: column; gap: 18px; }
  .cmp-gs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cmp-legend { margin: -4px 0 -6px; }
  .cmp-skills { display: flex; flex-direction: column; }
  .cmp-skillrow { display: grid; grid-template-columns: minmax(84px, 1.05fr) 1.5fr auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-200); }
  .cmp-skillrow:last-child { border-bottom: none; }
  .cmp-sk-name { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700); line-height: 1.25; }
  .cmp-sk-bar { min-width: 0; }
  .cmp-sk-status { justify-self: end; }   /* .ui-bandword */
  .cmp-views { margin-top: 14px; }
  @media (max-width: 860px) { .cmp-cols { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) { .cmp-gs { grid-template-columns: minmax(0, 1fr); } }

  /* ---- Where views differ (teacher / parent / child) ---- */
  .ad-views td.name { font-weight: 700; }
  .ad-views-note { font-size: var(--fs-xs); font-weight: 600; color: var(--text-meta); margin: 8px 2px 0; }

  /* ---- Mobile bottom tab bar (.ui-bottomnav) — shown ≤860px only ---- */
  .ui-bottomnav { display: none; }
  /* Header avatar is the account entry only when the sidebar (and its profile) is hidden. */
  .ui-header .ad-acct-m { display: none; }

  @media (max-width: 860px) {
    /* minmax(0,1fr) + min-width:0 lets the single column actually shrink to the
       viewport. Without this, the tables' min-width:640px forces the whole grid
       track wider than the screen and the entire page scrolls sideways (clipping
       content) instead of the tables scrolling inside their own wrapper. */
    .ad-app { grid-template-columns: minmax(0, 1fr); overflow-x: clip; }
    .ad-app > * { min-width: 0; }
    .ui-side { display: none; }
    /* Same minmax(0,1fr) + min-width:0 on every inner grid: a child with an
       intrinsic min-width (e.g. a table's min-width:420px) must NOT be able to
       stretch its track past the viewport and re-introduce sideways page scroll
       (which also drags the fixed bottom nav along). */
    .ad-grid.two, .ad-grid.tri { grid-template-columns: minmax(0, 1fr); }
    .ad-navcards { grid-template-columns: minmax(0, 1fr); }
    .ad-grid > *, .ad-navcards > * { min-width: 0; }
    .ad-skillrow { grid-template-columns: 1fr; gap: 8px; }
    .ad-main { padding-bottom: 96px; }
    .ui-bottomnav { display: flex; }
    .ui-header .ad-acct-m { display: grid; }
    .ui-header { gap: 10px; padding: 0 16px; }
    .ui-header .ad-year, .ui-header .desk-only { display: none; }
    /* Let the school-name block shrink and truncate instead of wrapping past the fixed header height. */
    .ui-header > div:first-child { min-width: 0; }
    .ui-header .ui-h-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }

  /* ---- Phone-specific tightening (portrait) ---- */
  @media (max-width: 560px) {
    .ad-main .ui-card:not(.tight):not(.pad0):not(.sm):not(.md) { padding: 15px 14px; }
    /* Role badge is redundant on a phone and steals header width — drop it, keep the avatar. */
    .ui-header .ui-rolebadge { display: none; }
    .ui-header .ui-avatar { width: 34px; height: 34px; }
    /* Filters go full-width and stack cleanly; hide the decorative divider span. */
    .ad-filters .select-wrap { min-width: 0; flex: 1 1 46%; }
    .ad-filters .input { flex: 1 1 100%; max-width: none !important; }
    .ad-filters > span[style] { display: none; }
    .ui-bottomnav button { letter-spacing: -0.01em; gap: 2px; }
  }

  /* ============================================================
     Verdict banner (feedback §1/§3) — the one-line answer at the top
     of Overview. Lead with the conclusion; evidence sits below it.
     ============================================================ */

  /* n = … children, and the small-group caution (< 10 children) */
  .ad-n { font-weight: 700; color: var(--ink-450); white-space: nowrap; }
  .ad-small { margin-left: 6px; }   /* .ui-chip.warn */
  .ad-scope-n { font-size: var(--fs-sm); }

  /* ============================================================
     OVERVIEW — the living dandelion + guided story, free-flowing on
     the page (no cards). A soft wash sits behind it. Type ramp:
     32 story headline · 15 body · 13 meta. SVG text = 11 / 13.
     ============================================================ */
  .ov-dl { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(240px, 0.8fr) minmax(0, 2fr); gap: 8px 32px; align-items: center; }
  .ov-dl::before { content: ''; position: absolute; inset: -32px 0; z-index: -1; pointer-events: none; filter: blur(30px); opacity: .9;
    background: radial-gradient(40% 50% at 22% 40%, var(--wash-green), transparent 70%),
                radial-gradient(35% 45% at 70% 25%, var(--wash-yellow), transparent 70%),
                radial-gradient(40% 50% at 55% 85%, var(--wash-cyan), transparent 70%),
                radial-gradient(30% 40% at 90% 70%, var(--wash-pink), transparent 70%); }
  .dl-head { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .dl-head .ui-crumbs { margin: 0; }
  .dl-viz { min-width: 0; }
  .dl-stage { position: relative; touch-action: none; }
  .dl-svg { display: block; width: 100%; height: auto; overflow: visible; user-select: none; }
  .dl-spoke { stroke-linecap: round; transition: opacity .35s; }
  .dl-spoke.hub { stroke: var(--ink-300); }
  .dl-spoke.kid { opacity: .45; }
  .dl-hit { fill: transparent; }
  .dl-kid { cursor: grab; transition: opacity .35s; }
  .dl-hub { cursor: grab; transition: opacity .35s; }
  .dl-hub.nav { cursor: pointer; }
  .dl-hub.nav:hover .dl-hit, .dl-hub.nav:focus-visible .dl-hit { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.5; }
  .dl-hub:focus { outline: none; }
  .dl-stage.dragging, .dl-stage.dragging * { cursor: grabbing; }
  .dl-name { font-family: var(--font-body); font-weight: 700; fill: var(--ink-700); paint-order: stroke; stroke: var(--white); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; transition: opacity .35s; }
  .dl-name.d0 { fill: var(--ink-900); }
  .dl-name.d2 { font-weight: 600; fill: var(--ink-450); }
  .dl-stage [data-dl-i].dim { opacity: var(--dl-dim, .14); }
  .dl-spoke.kid.dim { opacity: calc(var(--dl-dim, .14) * .45); }
  /* outside the zoomed-in grade/section: faded context, not interactive */
  .dl-stage [data-dl-i].ctx { opacity: var(--dl-ctx, .18); pointer-events: none; }
  .dl-spoke.kid.ctx { opacity: calc(var(--dl-ctx, .18) * .45); }
  .dl-tip { position: absolute; z-index: 5; transform: translate(-50%, calc(-100% - 16px)); pointer-events: none; background: var(--ink-900); color: var(--white);
    border-radius: var(--radius-sm); padding: 8px 12px; box-shadow: var(--shadow-pop); font-size: var(--fs-sm); font-weight: 600; line-height: 1.45; white-space: nowrap; }
  .dl-tip.below { transform: translate(-50%, 16px); }
  .dl-tip b { display: block; font-weight: 800; }
  .dl-tip span { display: block; color: var(--ink-300); }
  .dl-tip em { display: block; font-style: normal; color: var(--green-500); margin-top: 2px; }
  .dl-counts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 28px; margin-top: 10px; }
  .dl-counts span { display: inline-flex; align-items: baseline; gap: 6px; font-weight: 700; font-size: var(--fs-sm); color: var(--text-meta); }
  .dl-counts b { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl); line-height: 1; color: var(--ink-900); font-variant-numeric: tabular-nums; }
  .dl-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-top: 6px; }
  .dl-hint { font-weight: 600; font-size: var(--fs-xs); color: var(--text-meta); }
  .ui-legend i.ring { box-shadow: inset 0 0 0 2px var(--ink-300); }
  /* Guided story */
  .dl-story { min-width: 0; }
  .dl-headline { margin: 8px 0 0; font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-2xl); line-height: 1.15; color: var(--ink-900); letter-spacing: -.01em; }
  .dl-body { margin: 12px 0 0; font-weight: 600; font-size: var(--fs-md); line-height: 1.55; color: var(--ink-600); }
  /* story points: hover / focus lights the dandelion, click pins */
  .dl-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .dl-points li { position: relative; padding: 10px 12px 10px 28px; border-radius: var(--radius-md); cursor: pointer; transition: background .2s; }
  .dl-points li::before { content: ''; position: absolute; left: 10px; top: 19px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-300); transition: background .2s; }
  .dl-points li.on { background: color-mix(in srgb, var(--white) 70%, transparent); }
  .dl-points li.on::before, .dl-points li.pinned::before { background: var(--accent); }
  .dl-points li:focus { outline: none; }
  .dl-points li:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .dl-pt-head { margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-lg); line-height: 1.3; color: var(--ink-900); }
  .dl-pt-head em { font-style: normal; }
  .dl-pt-body { margin: 4px 0 0; font-weight: 600; font-size: var(--fs-sm); line-height: 1.5; color: var(--ink-600); }
  .dl-source { margin: 10px 0 0 12px; font-weight: 700; font-size: var(--fs-xs); color: var(--text-meta); }
  .dl-out { margin-top: 18px; }   /* .btn.btn-primary — the way into Outcomes (not in the nav) */
  @media (prefers-reduced-motion: reduce) {
    .dl-spoke, .dl-kid, .dl-hub, .dl-name, .dl-points li, .dl-points li::before { transition: none; }
  }
  @media (max-width: 860px) {
    .ov-dl { grid-template-columns: minmax(0, 1fr); }
    .dl-viz { order: 1; }   /* phone: dandelion above the story */
    .dl-story { order: 2; }
  }
  /* Dandelion tuning GUI (dev tooling) */
  #dl-gui { position: fixed; top: 76px; right: 16px; z-index: 9999; width: 260px; max-height: calc(100dvh - 96px); overflow: auto; background: var(--white);
    border: 1px solid var(--line-200); border-radius: 14px; box-shadow: var(--shadow-pop); font-family: var(--font-body); }
  #dl-gui .dlg-head { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: none; cursor: pointer; padding: 12px 16px; font: inherit; }
  #dl-gui .dlg-head b { font-size: 13px; color: var(--ink-900); }
  #dl-gui.collapsed .dlg-body { display: none; }
  #dl-gui .dlg-body { padding: 0 16px 14px; border-top: 1px solid var(--line-200); }
  #dl-gui label { display: block; margin: 10px 0 0; cursor: ns-resize; }
  #dl-gui .dlg-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; font-weight: 700; }
  #dl-gui .dlg-new { color: #F0A84A; }   /* newly added control (CLAUDE.md) */
  #dl-gui .dlg-val { color: var(--ink-450); font-weight: 600; font-family: var(--font-heading); }
  #dl-gui input[type=range] { width: 100%; accent-color: var(--green-500); margin-top: 3px; }
  #dl-gui select { width: 100%; margin-top: 4px; font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid var(--line-200); border-radius: var(--radius-xs); }
  #dl-gui .dlg-actions { display: flex; gap: 8px; margin-top: 14px; }
  #dl-gui .dlg-actions button { flex: 1; font-family: var(--font-body); font-weight: 700; font-size: 12px; border-radius: 999px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--line-200); background: var(--white); color: var(--ink-450); }
  #dl-gui .dlg-actions button.primary { border: none; background: var(--green-500); color: var(--white); }

  /* Roster: quiet year-end row + neutral user actions */
  .ad-yearend { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 18px; border: 1px dashed var(--line-200); border-radius: var(--radius-md); }
  .ad-yearend b { display: block; font-size: var(--fs-sm); color: var(--ink-700); }
  .ad-yearend span { font-size: var(--fs-sm); color: var(--ink-450); font-weight: 600; }
  .ad-useracts .btn-link.muted { color: var(--ink-450); }
  .ad-useracts .ad-revoke:hover { color: var(--danger-700); }

  /* ---- Band-bar target marker (feedback §2) — "compared to what?" ----
     Secure is the right-most segment, so a target of N% Secure sits at
     (100−N)% from the left: the green should reach this line. */
  .ad-barwrap { position: relative; }
  .ad-bar-target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-700); border-radius: 2px; pointer-events: none; }
  .ad-bar-target::after { content: ''; position: absolute; top: -3px; left: -2px; border: 3px solid transparent; border-top-color: var(--ink-700); }
  .ad-targetdelta { display: inline-block; margin-top: 6px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }
  .ad-targetdelta.met { color: var(--green-700); }

  /* ============================================================
     Ask Tilli — floating assistant + full screen (feedback §5).
     A chat surface that answers from the school's own dashboard data.
     ============================================================ */
  /* Floating Ask Tilli + Need help bubbles: assets/float-help.js (styles in tilli.css).
     Lift them above the mobile bottom nav. */
  @media (max-width: 860px) { :root { --tf-bottom: 78px; --tf-right: 14px; } }

  /* Ask Tilli full screen — same .askx layout as the teacher view (tilli.css).
     The page header is hidden and the main column goes full height. */
  .ad-app.ask-mode .ad-col { display: flex; flex-direction: column; height: 100dvh; min-height: 0; }
  .ad-app.ask-mode .ui-header { display: none; }
  .ad-app.ask-mode .ad-main { flex: 1; min-height: 0; padding: 0; display: flex; }
  .ad-app.ask-mode .ad-wrap { max-width: none; margin: 0; flex: 1; min-height: 0; display: flex; }
  .ad-app.ask-mode #ad-main-body { flex: 1; min-width: 0; min-height: 0; display: flex; }
  /* Floating chat window look = .ask-panel / .ask-* (tilli.css, shared with teacher).
     Admin has no bubble-anchored positioning, so on tablet/phone it sits above the bottom nav. */
  @media (max-width: 860px) { .ask-panel { right: 8px; left: 8px; bottom: 74px; width: auto; max-width: none; height: min(72dvh, 560px); } }
  /* Admin-only extras inside a Tilli answer */
  .ask-src { margin-top: 8px; font-size: var(--fs-xs); font-weight: 700; color: var(--text-meta); }
  .ask-quote { margin: 8px 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--white); border-radius: var(--radius-sm); font-weight: 600; color: var(--ink-700); }
  .ask-sugs { display: flex; flex-wrap: wrap; gap: 7px; align-self: flex-start; }

  /* ---- Preview-stage panel (demo tooling; remove to ship) ----
     Look comes from .ui-devpanel (tilli.css). Docked in the sidebar on desktop;
     floats above the bottom nav when the sidebar is hidden. */
  .ad-statepanel.float { left: 8px; bottom: 74px; width: 200px; }
