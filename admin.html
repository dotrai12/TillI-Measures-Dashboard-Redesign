<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures — Leadership</title>
<link rel="stylesheet" href="_ds/tilli/tokens/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css">
<style>
  /* ============================================================
     Tilli Measures — School Admin (leadership) dashboard chrome.
     Reuses tilli.css tokens (colour, type, buttons, skeleton).
     Deliberately NO garden/plant metaphor anywhere (spec §1, §9):
     a calm, operational data surface for infrequent, high-stakes
     leadership visits.
     ============================================================ */
  :root {
    --ad-side-w: 232px;
    --ad-header-h: 66px;
    --ad-gap: clamp(16px, 2vw, 24px);
    --ad-maxw: 1180px;
  }
  body { background: var(--surface-100); }

  /* ---- App grid: sidebar + (header / main) ---- */
  /* minmax(0,…) lets the content track shrink below its min-content, so a wide
     table scrolls inside its own .ad-tablewrap instead of forcing a page-wide
     horizontal scrollbar. */
  .ad-app { min-height: 100dvh; display: grid; grid-template-columns: var(--ad-side-w) minmax(0, 1fr); }
  /* min-width:0 lets the content column shrink below its children's intrinsic
     min-width (tables carry min-width:520–640px). Without it a wide card forces
     the track past the viewport and the whole page scrolls sideways. */
  .ad-app > * { min-width: 0; }

  /* ---- Sidebar (desktop) ---- */
  .ad-side {
    position: sticky; top: 0; align-self: start; height: 100dvh;
    background: #fff; border-right: 1px solid var(--line-200);
    display: flex; flex-direction: column; padding: 20px 16px; gap: 8px;
  }
  .ad-side .lockup { padding: 4px 8px 14px; }
  .ad-nav { display: flex; flex-direction: column; gap: 4px; }
  .ad-nav-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    border: none; background: none; cursor: pointer; text-align: left;
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14.5px;
    color: var(--ink-600); padding: 11px 13px; border-radius: 12px;
    transition: background .15s, color .15s;
  }
  .ad-nav-item:hover { background: var(--surface-100); color: var(--ink-900); }
  .ad-nav-item.on { background: var(--wash-green); color: var(--green-700); }
  .ad-nav-item .ic { width: 20px; height: 20px; flex: none; display: grid; place-items: center; }
  .ad-nav-item svg { width: 19px; height: 19px; }
  .ad-side-foot { margin-top: auto; font-family: 'Quicksand', sans-serif; font-size: 11.5px; color: var(--ink-300); font-weight: 600; padding: 0 10px; line-height: 1.5; }

  /* ---- Header ---- */
  .ad-header {
    position: sticky; top: 0; z-index: 30;
    height: var(--ad-header-h); background: #fff; border-bottom: 1px solid var(--line-200);
    display: flex; align-items: center; gap: 16px; padding: 0 clamp(16px, 3vw, 32px);
  }
  .ad-header .ad-school { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 17px; color: var(--ink-900); }
  .ad-header .ad-sub { font-weight: 600; font-size: 12.5px; color: var(--ink-300); }
  .ad-year {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-100);
    border: 1px solid var(--line-200); border-radius: var(--radius-pill);
    padding: 6px 12px; font-weight: 700; font-size: 12.5px; color: var(--ink-600);
  }
  .ad-rolebadge {
    display: inline-flex; align-items: center; gap: 7px; background: var(--wash-cyan);
    color: var(--cyan-700); border-radius: var(--radius-pill); padding: 6px 13px;
    font-weight: 800; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase;
  }
  .ad-acct {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-200);
    background: var(--wash-green); color: var(--green-700); font-family: 'Quicksand', sans-serif;
    font-weight: 700; font-size: 15px; cursor: pointer; display: grid; place-items: center;
  }
  .ad-acct-menu {
    position: absolute; top: calc(var(--ad-header-h) - 8px); right: clamp(16px, 3vw, 32px); z-index: 40;
    background: #fff; border: 1px solid var(--line-200); border-radius: 14px;
    box-shadow: 0 12px 30px rgba(20,20,20,.14); padding: 8px; min-width: 220px;
  }
  .ad-acct-menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line-200); margin-bottom: 6px; }
  .ad-acct-menu .who b { display: block; font-size: 14px; color: var(--ink-900); }
  .ad-acct-menu .who span { font-size: 12px; color: var(--ink-300); font-weight: 600; }
  .ad-acct-menu button {
    width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13.5px; color: var(--ink-600);
    padding: 10px; border-radius: 9px;
  }
  .ad-acct-menu button:hover { background: var(--surface-100); }

  /* ---- Main ---- */
  .ad-main { padding: var(--ad-gap) clamp(16px, 3vw, 32px) 96px; }
  .ad-wrap { max-width: var(--ad-maxw); margin: 0 auto; }
  .ad-screen-title { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: clamp(22px, 3vw, 28px); color: var(--ink-900); margin: 4px 0 2px; }
  .ad-screen-sub { font-weight: 600; font-size: 14px; color: var(--ink-450); margin: 0 0 var(--ad-gap); }

  /* ---- Cards / modules ---- */
  .ad-grid { display: grid; gap: var(--ad-gap); }
  /* minmax(0,…) + min-width:0 on children: a card holding a min-width table must
     not stretch its 1fr track past half the row and overflow the page sideways. */
  .ad-grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ad-grid.tri { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ad-grid > * { min-width: 0; }
  .ad-card {
    background: #fff; border: 1px solid var(--line-200); border-radius: var(--radius-card);
    padding: clamp(16px, 2vw, 22px);
  }
  .ad-card.pad0 { padding: 0; overflow: hidden; }
  .ad-card.span2 { grid-column: 1 / -1; }
  .ad-card.accent { border-color: var(--pink-400); }
  .ad-mod-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .ad-mod-title { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 16px; color: var(--ink-900); margin: 0; }
  .ad-mod-note { font-weight: 600; font-size: 12.5px; color: var(--ink-300); margin: 3px 0 0; }

  /* ---- Cadence label (periodic modules) ---- */
  .ad-cadence {
    display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--wash-cyan); color: var(--cyan-700); border-radius: var(--radius-pill);
    padding: 5px 12px; font-weight: 700; font-size: 11.5px;
  }
  .ad-cadence .next { color: var(--cyan-700); opacity: .72; }

  /* ---- Status line ---- */
  .ad-status {
    background: #fff; border: 1px solid var(--line-200); border-left: 4px solid var(--cyan-500);
    border-radius: 16px; padding: 16px 20px; font-family: 'Quicksand', sans-serif;
    font-weight: 600; font-size: clamp(15px, 1.8vw, 18px); color: var(--ink-900); line-height: 1.5;
  }

  /* ---- Chips ---- */
  .ad-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-pill); padding: 4px 11px; font-weight: 800; font-size: 11px; letter-spacing: .02em; }
  .ad-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .ad-chip.active { background: var(--wash-green); color: var(--green-700); }
  .ad-chip.active .dot { background: var(--green-500); }
  .ad-chip.slowing { background: #FFF1DC; color: #A96518; }
  .ad-chip.slowing .dot { background: #F0A84A; }
  .ad-chip.quiet { background: #F1F1F4; color: #5B6170; }
  .ad-chip.quiet .dot { background: #9AA3AF; }
  .ad-chip.status-new { background: var(--wash-cyan); color: var(--cyan-700); }
  .ad-chip.status-routed { background: #FFF1DC; color: #A96518; }
  .ad-chip.status-closed { background: #F1F1F4; color: #5B6170; }
  /* Toggleable filter chips (section filter in grade roster) */
  .ad-filterchip { display: inline-flex; align-items: center; cursor: pointer; background: #fff; border: 1px solid var(--line-200); color: var(--ink-450); border-radius: var(--radius-pill); padding: 7px 15px; font-weight: 700; font-size: 12.5px; transition: background .12s, border-color .12s, color .12s; }
  .ad-filterchip:hover { border-color: var(--green-500); color: var(--green-700); }
  .ad-filterchip.on { background: var(--wash-green); border-color: var(--green-500); color: var(--green-700); }
  .ad-filterchip:focus-visible { outline: 2px solid var(--green-500); outline-offset: 2px; }

  /* band chips */
  .ad-bandchip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 11.5px; color: var(--ink-600); }
  .ad-bandchip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* ---- Tables ---- */
  .ad-tablewrap { overflow-x: auto; }
  table.ad-table { width: 100%; border-collapse: collapse; min-width: 640px; }
  .ad-table th, .ad-table td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line-200); font-size: 13.5px; }
  .ad-table th {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 11.5px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink-450); background: var(--surface-100); white-space: nowrap;
    position: sticky; top: 0;
  }
  .ad-table th.sortable { cursor: pointer; user-select: none; }
  .ad-table th.sortable:hover { color: var(--ink-900); }
  .ad-table th .arw { font-size: 10px; margin-left: 4px; color: var(--cyan-500); }
  .ad-table td.name { font-weight: 700; color: var(--ink-900); }
  .ad-table tr:last-child td { border-bottom: none; }
  .ad-table tr.clickable { cursor: pointer; }
  .ad-table tr.clickable:hover td { background: var(--wash-green); }
  .ad-num { font-variant-numeric: tabular-nums; }

  /* ---- Stacked band bar ---- */
  .ad-bar { display: flex; height: 22px; border-radius: 7px; overflow: hidden; background: var(--surface-100); }
  .ad-bar > span { display: block; height: 100%; }
  .ad-bar.slim { height: 14px; border-radius: 5px; }
  .ad-skillrow { display: grid; grid-template-columns: 190px 1fr; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-200); }
  .ad-skillrow:last-child { border-bottom: none; }
  .ad-skillname { font-weight: 700; font-size: 13.5px; color: var(--ink-900); }
  .ad-skillname small { display: block; font-weight: 600; font-size: 11px; color: var(--ink-300); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .ad-interp { font-weight: 600; font-size: 12.5px; color: var(--ink-450); line-height: 1.5; margin: 6px 0 0; }
  .ad-interp.placeholder { color: #A96518; background: #FFF1DC; border-radius: 8px; padding: 8px 10px; display: inline-block; }

  /* ---- Collapsible skill buckets (Social-Emotional / Executive Function) ---- */
  .ad-bucket { border: 1px solid var(--line-200); border-radius: 12px; margin-bottom: 12px; overflow: hidden; background: var(--surface-0, #fff); }
  .ad-bucket:last-child { margin-bottom: 0; }
  .ad-bucket-sum { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-100); user-select: none; }
  .ad-bucket-sum::-webkit-details-marker { display: none; }
  .ad-bucket-title { font-weight: 800; font-size: 14px; color: var(--ink-900); letter-spacing: .01em; }
  .ad-bucket-count { font-weight: 700; font-size: 11.5px; color: var(--ink-300); text-transform: uppercase; letter-spacing: .04em; margin-left: auto; }
  .ad-bucket-chev { font-size: 12px; color: var(--ink-450); transition: transform .18s var(--ease); }
  .ad-bucket[open] .ad-bucket-chev { transform: rotate(0deg); }
  .ad-bucket:not([open]) .ad-bucket-chev { transform: rotate(-90deg); }
  .ad-bucket-body { padding: 4px 16px 8px; }

  /* ---- Legend ---- */
  .ad-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; }

  /* ---- Column chart (continuous activity) ---- */
  .ad-cols { display: flex; align-items: flex-end; gap: 6px; height: 130px; }
  .ad-cols .col { flex: 1; background: var(--cyan-500); border-radius: 5px 5px 0 0; min-height: 3px; transition: height .3s var(--ease); }
  .ad-cols .col.dim { background: var(--line-200); }
  .ad-colx { display: flex; gap: 6px; margin-top: 8px; }
  .ad-colx span { flex: 1; text-align: center; font-size: 10px; color: var(--ink-300); font-weight: 700; }

  /* ---- Progress-over-time markers ---- */
  .ad-track { display: flex; align-items: stretch; gap: 10px; }
  .ad-point { flex: 1; text-align: center; }
  .ad-point .plabel { font-weight: 800; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-450); margin-bottom: 8px; }
  .ad-point.pending .ad-bar { opacity: .5; }
  .ad-point .pmeta { font-size: 10.5px; color: var(--ink-300); font-weight: 700; margin-top: 6px; }
  .ad-point.pending .pmeta { color: #A96518; }

  /* ---- Movement indicator ---- */
  .ad-move { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; }
  .ad-move .up { color: var(--green-600); }
  .ad-move .down { color: #C05A2B; }
  .ad-move .same { color: var(--ink-300); }

  /* ---- Filters bar ---- */
  .ad-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: var(--ad-gap); }
  .ad-filters .select-wrap { min-width: 150px; }
  .ad-filters .grow { flex: 1; }
  .ad-refresh { margin-left: auto; }

  /* ---- Breadcrumbs ---- */
  .ad-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; font-weight: 700; font-size: 13px; }
  .ad-crumbs button { background: none; border: none; cursor: pointer; color: var(--cyan-700); font: inherit; padding: 2px 4px; border-radius: 6px; }
  .ad-crumbs button:hover { text-decoration: underline; }
  .ad-crumbs .sep { color: var(--ink-300); }
  .ad-crumbs .cur { color: var(--ink-900); }

  /* ---- States ---- */
  .ad-empty { text-align: center; padding: 26px 20px; color: var(--ink-450); font-weight: 600; font-size: 13.5px; line-height: 1.6; }
  .ad-empty .big { display: block; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; color: var(--ink-700); margin-bottom: 4px; }
  .ad-empty.ok .big { color: var(--green-700); }
  .ad-err { text-align: center; padding: 24px; color: #B22447; font-weight: 700; font-size: 13.5px; }
  .ad-err button { margin-top: 12px; }
  .ad-skel { height: 14px; border-radius: 7px; margin: 8px 0; }

  /* ---- Concern rows ---- */
  .ad-concern { border: 1px solid var(--line-200); border-radius: 16px; padding: 15px 17px; }
  .ad-concern + .ad-concern { margin-top: 12px; }
  .ad-concern .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ad-concern .who { font-weight: 700; font-size: 14.5px; color: var(--ink-900); }
  .ad-concern .meta { font-weight: 600; font-size: 12px; color: var(--ink-300); margin-top: 2px; }
  .ad-concern .note { font-weight: 600; font-size: 13px; color: var(--ink-600); line-height: 1.55; margin: 10px 0 0; }
  .ad-concern .outcome { background: var(--surface-100); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; color: var(--ink-450); font-weight: 600; margin-top: 10px; }
  .ad-concern .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* ---- Privacy note (the trust artefact — spec §5.1.4) ---- */
  .ad-privacy { display: flex; gap: 9px; align-items: flex-start; font-weight: 600; font-size: 12px; color: var(--ink-450); background: var(--surface-100); border-radius: 10px; padding: 10px 12px; margin-top: 12px; line-height: 1.5; }

  /* ---- Stat tiles ---- */
  .ad-stat { text-align: left; }
  .ad-stat .num { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: clamp(26px, 3.4vw, 34px); color: var(--ink-900); line-height: 1; }
  .ad-stat .lbl { font-weight: 700; font-size: 12.5px; color: var(--ink-450); margin-top: 7px; }

  /* ---- Buttons (small) ---- */
  .btn-sm { padding: 8px 16px; font-size: 13px; }
  .btn-cyan { background: var(--cyan-500); color: #fff; }
  .btn-cyan:hover { background: var(--cyan-700); }
  .btn-outline { background: #fff; border: 1.5px solid var(--line-200); color: var(--ink-700); }
  .btn-outline:hover { border-color: var(--cyan-500); color: var(--cyan-700); }
  .link-btn { background: none; border: none; color: var(--cyan-700); font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; padding: 0; }
  .link-btn:hover { text-decoration: underline; }

  /* ---- Toast ---- */
  .ad-toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px);
    background: var(--ink-900); color: #fff; font-weight: 700; font-size: 13.5px;
    padding: 12px 20px; border-radius: var(--radius-pill); z-index: 80; opacity: 0;
    transition: opacity .25s, transform .25s; box-shadow: 0 10px 30px rgba(20,20,20,.28);
  }
  .ad-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============================================================
     Hover info boxes (tooltips). One trigger class `.ad-tip` with
     a `data-tip="..."` string; the bubble is drawn with ::after and
     the arrow with ::before, so no JS wiring is needed and they
     survive every re-render. `.ad-info` is the little ⓘ affordance.
     Modifiers: `.down` opens the bubble below (used inside the
     scroll-clipped table headers); `.end` right-anchors it so a
     right-edge trigger doesn't overflow. `--tx` carries the x-offset
     so the same hover-reset works for centred and end-anchored tips.
     ============================================================ */
  .ad-tip { position: relative; display: inline-flex; align-items: center; cursor: help; }
  .ad-tip:hover, .ad-tip:focus-within { z-index: 70; }
  .ad-tip:focus { outline: none; }
  .ad-tip:focus-visible { outline: 2px solid var(--cyan-500); outline-offset: 2px; border-radius: 6px; }
  .ad-info {
    display: inline-grid; place-items: center; flex: none;
    width: 15px; height: 15px; margin-left: 5px; border-radius: 50%;
    border: 1.3px solid var(--ink-300); color: var(--ink-300);
    font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 10px; line-height: 1;
    text-transform: none; letter-spacing: 0; transition: border-color .15s, color .15s;
  }
  .ad-tip:hover .ad-info, .ad-tip:focus-within .ad-info { border-color: var(--cyan-500); color: var(--cyan-700); }

  .ad-tip[data-tip]::after {
    content: attr(data-tip); --tx: -50%;
    position: absolute; left: 50%; bottom: calc(100% + 9px);
    transform: translate(var(--tx), 4px);
    width: max-content; max-width: 240px; white-space: normal; text-align: left;
    background: var(--ink-900); color: #fff;
    font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 12px; line-height: 1.45;
    letter-spacing: 0; text-transform: none;
    padding: 9px 12px; border-radius: 10px; box-shadow: 0 12px 30px rgba(20, 20, 20, .24);
    opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s;
  }
  .ad-tip[data-tip]::before {
    content: ''; position: absolute; left: 50%; bottom: calc(100% + 3px);
    transform: translate(-50%, 4px); border: 6px solid transparent; border-top-color: var(--ink-900);
    opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s;
  }
  .ad-tip.down[data-tip]::after { bottom: auto; top: calc(100% + 9px); transform: translate(var(--tx), -4px); }
  .ad-tip.down[data-tip]::before { bottom: auto; top: calc(100% + 3px); transform: translate(-50%, -4px); border-top-color: transparent; border-bottom-color: var(--ink-900); }
  .ad-tip.end[data-tip]::after { --tx: 0; left: auto; right: 0; }
  .ad-tip.end[data-tip]::before { display: none; }
  .ad-tip:hover::after, .ad-tip:focus-within::after { opacity: 1; transform: translate(var(--tx), 0); }
  .ad-tip:hover::before, .ad-tip:focus-within::before { opacity: 1; transform: translate(-50%, 0); }

  /* ---- Copy block (newsletter) ---- */
  .ad-copyblock { border: 1px solid var(--line-200); border-radius: 14px; padding: 14px; font-family: 'Montserrat', sans-serif; font-size: 14px; line-height: 1.6; color: var(--ink-700); width: 100%; resize: vertical; min-height: 150px; }
  .ad-copyblock:focus { outline: none; border-color: var(--cyan-500); }

  /* ---- Modal (grade migration, compose, etc.) ---- */
  .ad-modal-card {
    width: 100%; max-width: 760px; max-height: calc(100dvh - 48px); overflow-y: auto;
    background: #fff; border-radius: var(--radius-card); padding: clamp(20px, 3vw, 30px); position: relative;
  }
  .ad-modal-card.wide { max-width: 940px; }
  .ad-modal-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .ad-modal-h h3 { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 20px; margin: 0; }

  /* ============================================================
     Mockup-inspired additive modules (same DS tokens/colours).
     ============================================================ */

  /* ---- Meta chip row (Overview quick counts) ---- */
  .ad-chiprow { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: var(--ad-gap); }
  .ad-metachip { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line-200); border-radius: var(--radius-pill); padding: 9px 16px; font-weight: 600; font-size: 13px; color: var(--ink-450); }
  .ad-metachip b { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; color: var(--ink-900); }

  /* ---- Skill-summary cards (neutral band colours — NO red/alarm) ---- */
  .ad-sumgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ad-gap); }
  .ad-sumgrid > * { min-width: 0; }
  .ad-sumcard { border: 1px solid var(--line-200); border-top: 4px solid var(--band, var(--line-200)); border-radius: var(--radius-card); padding: 16px 18px; background: #fff; }
  .ad-sumcard .n { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; color: var(--ink-900); }
  .ad-sumcard .h { font-weight: 800; font-size: 12px; letter-spacing: .01em; color: var(--ink-600); margin: 8px 0 12px; }
  .ad-sumcard ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .ad-sumcard li { font-weight: 700; font-size: 12.5px; color: var(--ink-700); }
  .ad-sumcard .none { font-weight: 600; font-size: 12.5px; color: var(--ink-300); }

  /* ---- Grade / section navigator cards (Outcomes drill) ---- */
  .ad-navcards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--ad-gap); }
  .ad-navcards > * { min-width: 0; }
  .ad-navcard { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line-200); border-radius: var(--radius-card); padding: 16px 18px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .ad-navcard:hover { border-color: var(--cyan-500); box-shadow: 0 6px 18px rgba(20,20,20,.06); }
  .ad-navcard .nc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ad-navcard .nc-name { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 16px; color: var(--ink-900); }
  .ad-navcard .nc-meta { font-weight: 700; font-size: 12px; color: var(--ink-300); margin: 4px 0 12px; }
  .ad-navcard .nc-pcts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 9px; font-weight: 700; font-size: 11.5px; color: var(--ink-450); }

  /* ---- Per-grade breakdown (Outcomes school scope — Overview snapshot format) ---- */
  .ad-gradebreaks { display: flex; flex-direction: column; gap: var(--ad-gap); }
  .ad-gradebreak { border: 1px solid var(--line-200); border-radius: var(--radius-card); padding: 16px 18px; background: #fff; }
  .ad-gradebreak .gb-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .ad-gradebreak .gb-name { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 17px; color: var(--ink-900); }
  .ad-gradebreak .gb-meta { font-weight: 700; font-size: 12px; color: var(--ink-300); margin-top: 4px; }
  .ad-gradebreak .gb-snap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 14px 0 16px; }
  .ad-gradebreak .gb-bar { flex: 1; min-width: 220px; }
  .ad-gradebreak .gb-gs { margin: 0; }

  /* ---- Areas of growth / strength ---- */
  .ad-gs { border-radius: var(--radius-card); padding: 16px 18px; border: 1.5px solid var(--band, var(--line-200)); background: var(--bandwash, #fff); }
  .ad-gs h4 { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; margin: 0 0 10px; color: var(--ink-900); }
  .ad-gs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .ad-gs li { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 13px; color: var(--ink-800); }
  .ad-gs li .p { font-weight: 800; font-size: 12px; color: var(--ink-450); }
  /* Overview growth/strength header: scope pill + drill-in link */
  .ad-gs-head { display: flex; align-items: center; gap: 12px; }
  .ad-scopepill { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 13px; color: var(--ink-800); background: var(--surface-100, #fff); border: 1.5px solid var(--line-200); border-radius: 999px; padding: 6px 14px; }

  /* ---- Compare two classes (Outcomes) ---- */
  .cmp-pickers { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
  .cmp-pick { display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px; min-width: 0; }
  .cmp-cap { font-weight: 800; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-450); }
  .cmp-vs { font-weight: 800; font-size: 12px; color: var(--ink-300); padding-bottom: 14px; }
  .cmp-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; }
  .cmp-row-lbl { font-size: 11.5px; font-weight: 700; color: var(--ink-450); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmp-table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 520px; }
  .cmp-table th { text-align: left; font-size: 12px; font-weight: 800; color: var(--ink-450); text-transform: uppercase; letter-spacing: .04em; padding: 0 0 10px; border-bottom: 1px solid var(--line-200); }
  .cmp-table th:first-child { width: 190px; }
  .cmp-table td { padding: 12px 0; border-bottom: 1px solid var(--line-200); vertical-align: middle; }
  .cmp-table th + th, .cmp-table td + td { padding-left: 18px; }
  .cmp-table tbody tr:last-child td, .cmp-table tr:last-child td { border-bottom: none; }
  .cmp-skill { font-weight: 700; font-size: 13.5px; color: var(--ink-900); }

  /* ---- Multi-perspective radar ---- */
  .ad-radar-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ad-radar-wrap svg { width: 100%; max-width: 380px; height: auto; }
  .ad-radar-legend { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .ad-radar-legend span { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; color: var(--ink-600); }
  .ad-radar-legend i { width: 11px; height: 11px; border-radius: 3px; }

  /* ---- Disabled nav item (Ask Tilli placeholder) ---- */
  .ad-nav-item.disabled { color: var(--ink-300); cursor: default; }
  .ad-nav-item.disabled:hover { background: none; color: var(--ink-300); }
  .ad-soon { margin-left: auto; font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-300); background: var(--surface-100); border: 1px solid var(--line-200); border-radius: var(--radius-pill); padding: 2px 7px; }

  /* ---- Mobile bottom tab bar ---- */
  .ad-bottomnav { display: none; }

  @media (max-width: 860px) {
    /* minmax(0,1fr) + min-width:0 lets the single column actually shrink to the
       viewport. Without this, the tables' min-width:640px forces the whole grid
       track wider than the screen and the entire page scrolls sideways (clipping
       content) instead of the tables scrolling inside their own wrapper. */
    .ad-app { grid-template-columns: minmax(0, 1fr); overflow-x: clip; }
    .ad-app > * { min-width: 0; }
    .ad-side { display: none; }
    /* Same minmax(0,1fr) + min-width:0 on every inner grid: a child with an
       intrinsic min-width (e.g. a table's min-width:420px) must NOT be able to
       stretch its track past the viewport and re-introduce sideways page scroll
       (which also drags the fixed bottom nav along). */
    .ad-grid.two, .ad-grid.tri { grid-template-columns: minmax(0, 1fr); }
    .ad-sumgrid, .ad-navcards { grid-template-columns: minmax(0, 1fr); }
    .ad-grid > *, .ad-sumgrid > *, .ad-navcards > * { min-width: 0; }
    .ad-skillrow { grid-template-columns: 1fr; gap: 8px; }
    .ad-main { padding-bottom: 96px; }
    .ad-bottomnav {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      background: #fff; border-top: 1px solid var(--line-200); height: 64px;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .ad-bottomnav button {
      flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      background: none; border: none; cursor: pointer; color: var(--ink-300);
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 10.5px;
    }
    /* Keep every tab label on one line inside its slice — no wrap, no overflow. */
    .ad-bottomnav button span {
      max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ad-bottomnav button.on { color: var(--green-700); }
    .ad-bottomnav svg { width: 21px; height: 21px; flex: none; }
    .ad-header { gap: 10px; padding: 0 16px; }
    .ad-header .ad-year, .ad-header .desk-only { display: none; }
    /* Let the school-name block shrink and truncate instead of wrapping past the fixed header height. */
    .ad-header > div:first-child { min-width: 0; }
    .ad-header .ad-school { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Module headers stack their cadence pill below the title rather than crushing it. */
    .ad-mod-h { flex-wrap: wrap; }
  }

  /* ---- Phone-specific tightening (portrait) ---- */
  @media (max-width: 560px) {
    :root { --ad-gap: 16px; }
    .ad-main { padding: 16px 14px 96px; }
    .ad-card { padding: 15px 14px; }
    /* Role badge is redundant on a phone and steals header width — drop it, keep the avatar. */
    .ad-header .ad-rolebadge { display: none; }
    .ad-header .ad-acct { width: 34px; height: 34px; font-size: 14px; }
    .ad-header .ad-school { font-size: 15.5px; }
    /* Filters go full-width and stack cleanly; hide the decorative divider span. */
    .ad-filters .select-wrap { min-width: 0; flex: 1 1 46%; }
    .ad-filters .input { flex: 1 1 100%; max-width: none !important; }
    .ad-filters .ad-refresh { margin-left: 0; flex: 1 1 100%; }
    .ad-filters > span[style] { display: none; }
    .ad-bottomnav button { font-size: 9.5px; letter-spacing: -0.01em; gap: 2px; }
    /* 3-marker progress tracks read better stacked than squeezed into thirds. */
    .ad-track { flex-wrap: wrap; gap: 8px; }
    .ad-track .ad-point { flex: 1 1 100%; }
    /* Stack the two class pickers; the "vs" reads oddly between stacked rows. */
    .cmp-pick { flex: 1 1 100%; }
    .cmp-vs { display: none; }
  }
  @media (max-width: 640px) { .brand-rail { display: none; } }
  /* ---- Preview-stage panel (demo tooling; remove to ship) ---- */
  .ad-statepanel { position: fixed; left: 16px; bottom: 16px; z-index: 60; width: 214px;
    background: #fff; border: 1px solid var(--line-200, #E7E9EF); border-radius: 14px;
    box-shadow: 0 8px 30px rgba(20,20,20,.16); font-family: Montserrat, system-ui, sans-serif; overflow: hidden; }
  .ad-sp-head { display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; background: var(--surface-100, #F5F6F9); border-bottom: 1px solid var(--line-200, #E7E9EF); }
  .ad-sp-title { font-size: 12px; font-weight: 800; color: var(--ink-700, #141414); letter-spacing: .02em; }
  .ad-sp-new { color: #E0348B; font-weight: 900; }
  .ad-sp-toggle { border: none; background: none; cursor: pointer; font-size: 13px; color: var(--ink-450, #5B6170); line-height: 1; padding: 2px 4px; }
  .ad-sp-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; }
  .ad-statepanel.collapsed .ad-sp-body { display: none; }
  .ad-sp-hint { margin: 0 0 4px; font-size: 10.5px; line-height: 1.45; color: var(--ink-450, #5B6170); }
  .ad-sp-btn { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 8px 10px; border: 1px solid var(--line-200, #E7E9EF); border-radius: 9px; background: #fff;
    cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink-600, #2C2F36); transition: border-color .12s, background .12s; }
  .ad-sp-btn:hover { border-color: #26BDE2; }
  .ad-sp-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-200, #D3D7E0); flex: none; }
  .ad-sp-btn.on { background: #EAF8FD; border-color: #26BDE2; color: #0E7CA0; }
  .ad-sp-btn.on .ad-sp-dot { background: #26BDE2; }
  @media (max-width: 900px) { .ad-statepanel { left: 8px; bottom: 74px; width: 176px; } }
</style>
