<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilli Measures — Leadership</title>
<link rel="stylesheet" href="_ds/tilli/tokens/fonts.css?v=20261020nb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tilli.css?v=20261020nb">
<style>
  /* ============================================================
     Tilli Measures — School Admin (leadership) dashboard chrome.
     Shared chrome / cards / chips / tables / modals come from the
     ui-* components in tilli.css; this block only holds what is
     unique to the leadership surface.
     Deliberately NO garden/plant metaphor anywhere (spec §1, §9):
     a calm, operational data surface for infrequent, high-stakes
     leadership visits.
     ============================================================ */
  :root {
    /* Accent, sidebar width, header height, content width and page padding
       all come from tilli.css tokens — same values as the teacher dashboard. */
  }
  body { background: var(--white); }   /* pure white, same as the teacher dashboard — cards keep their 1px border */

  /* ---- App grid: sidebar + (header / main) ---- */
  /* minmax(0,…) lets the content track shrink below its min-content, so a wide
     table scrolls inside its own .ui-tablewrap instead of forcing a page-wide
     horizontal scrollbar. */
  /* --topbar-h = the sticky header's height (the Overview's full-height panel sits under it). */
  :root { --topbar-h: var(--header-h); }
  .ad-app { min-height: 100dvh; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); }
  /* min-width:0 lets the content column shrink below its children's intrinsic
     min-width (tables carry min-width:520–640px). Without it a wide card forces
     the track past the viewport and the whole page scrolls sideways. */
  .ad-app > * { min-width: 0; }

  /* ---- Sidebar / header extras (base styles: .ui-side, .ui-header) ---- */
  .ui-nav-item.disabled { color: var(--ink-300); cursor: default; }
  .ui-nav-item.disabled:hover { background: none; color: var(--ink-300); }
  .ad-year {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-100);
    border: 1px solid var(--line-200); border-radius: var(--radius-pill);
    padding: 6px 12px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-600);
  }
  /* "Updated 2 h ago by …" header chip → History screen */
  .ad-updated { display: inline-flex; align-items: center; border: none; background: none; padding: 4px 6px; border-radius: var(--radius-sm); cursor: pointer; font: inherit; }
  .ad-updated:hover { background: var(--surface-100); }
  .ad-updated:hover .hist-last { color: var(--green-700); }

  /* ---- Main ---- */
  .ad-main { padding: var(--page-pad-y) var(--page-pad-x) 96px; }
  .ad-wrap { max-width: var(--content-max); margin: 0 auto; }

  /* ---- Layout grids ---- */
  .ad-grid { display: grid; gap: var(--page-gap); }
  /* minmax(0,…) + min-width:0 on children: a card holding a min-width table must
     not stretch its 1fr track past half the row and overflow the page sideways. */
  .ad-grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ad-grid.tri { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ad-grid > * { min-width: 0; }

  /* ---- Cadence label (periodic modules) — a .ui-chip.info that can wrap ---- */
  .ad-cadence { gap: 8px; flex-wrap: wrap; white-space: normal; }
  .ad-cadence .next { opacity: .72; }

  /* ---- Table extras (base: .ui-table) — sticky, sortable headers ---- */
  .ui-table th { position: sticky; top: 0; }
  .ui-table th.sortable { cursor: pointer; user-select: none; }
  .ui-table th.sortable:hover { color: var(--ink-900); }
  .ui-table th .arw { font-size: var(--fs-xs); margin-left: 4px; color: var(--accent); }
  .ad-num { font-variant-numeric: tabular-nums; }

  /* ---- Skill rows (band bar = .ui-bandbar, tilli.css) ---- */
  .ad-skillrow { display: grid; grid-template-columns: 190px 1fr; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-200); }
  .ad-skillrow:last-child { border-bottom: none; }
  .ad-skillname { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-900); }
  .ad-skillname small { display: block; font-weight: 600; font-size: var(--fs-xs); color: var(--text-meta); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .ad-interp { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); line-height: 1.5; margin: 6px 0 0; }

  /* ---- Collapsible skill buckets (Social-Emotional / Cognitive) ---- */
  .ad-bucket { border: 1px solid var(--line-200); border-radius: var(--radius-md); margin-bottom: 12px; overflow: hidden; background: var(--white); }
  .ad-bucket:last-child { margin-bottom: 0; }
  .ad-bucket-sum { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-100); user-select: none; }
  .ad-bucket-sum::-webkit-details-marker { display: none; }
  .ad-bucket-title { font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); letter-spacing: .01em; }
  .ad-bucket-count { font-weight: 700; font-size: var(--fs-xs); color: var(--text-meta); text-transform: uppercase; letter-spacing: .04em; margin-left: auto; }
  .ad-bucket-chev { font-size: var(--fs-sm); color: var(--ink-450); transition: transform .18s var(--ease); }
  .ad-bucket[open] .ad-bucket-chev { transform: rotate(0deg); }
  .ad-bucket:not([open]) .ad-bucket-chev { transform: rotate(-90deg); }
  .ad-bucket-body { padding: 4px 16px 8px; }

  /* ---- Progress-over-time stacked-area chart ---- */
  .ad-proghead { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .ad-progselects { display: flex; gap: 10px; flex-wrap: wrap; }
  .ad-proghead .select-wrap { min-width: 150px; }
  .ad-progcap { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-450); margin: 2px 0 12px; }
  .ad-progchart { width: 100%; }
  .ad-progchart svg { display: block; width: 100%; overflow: hidden; }
  .ad-progfuts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .ad-progfut { gap: 6px; }   /* .ui-metachip.dashed */
  .ad-progfut i { font-style: normal; font-weight: 700; color: var(--ink-450); }

  /* ---- Filters bar ---- */
  .ad-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: var(--page-gap); }
  .ad-filters .select-wrap { min-width: 150px; }

  /* ---- States ---- */
  .ad-err { text-align: center; padding: 24px; color: var(--danger-700); font-weight: 700; font-size: var(--fs-sm); }
  .ad-err button { margin-top: 12px; }
  .ad-skel { height: 14px; border-radius: var(--radius-xs); margin: 8px 0; }

  /* ---- Concern rows ---- */
  .ad-concern + .ad-concern { margin-top: 12px; }
  .ad-concern .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ad-concern .who { font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .ad-concern .meta { margin-top: 2px; }   /* .ui-meta */
  .ad-concern .note { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); line-height: 1.55; margin: 10px 0 0; }
  .ad-concern .outcome { margin-top: 10px; }   /* .ui-inset */
  .ad-concern .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* Hover info boxes: .ui-tooltip.help + .ui-info (tilli.css), shared with the teacher dashboard. */

  /* ---- Copy block (newsletter / message / note textareas) ---- */
  .ad-copyblock { border: 1px solid var(--line-200); border-radius: var(--radius-md); padding: 14px; font-family: var(--font-body); font-size: var(--fs-md); line-height: 1.6; color: var(--ink-700); width: 100%; resize: vertical; min-height: 150px; }
  .ad-copyblock:focus { outline: none; border-color: var(--focus); }
  .ad-copyblock.sm { min-height: 110px; }

  /* ============================================================
     Mockup-inspired additive modules (same DS tokens/colours).
     ============================================================ */


  /* ---- Grade / section navigator cards (Outcomes drill) ---- */
  .ad-navcards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--page-gap); }
  .ad-navcards > * { min-width: 0; }
  .ad-navcard { display: block; width: 100%; text-align: left; font: inherit; }   /* .ui-card.tight.link */
  .ad-navcard .nc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ad-navcard .nc-meta { margin: 4px 0 12px; }   /* .ui-meta */
  /* Roster grade cards: one brand colour per grade — a stripe down the left, a dot by
     the name and a faint wash. */
  /* grade colours live on :root so the dandelion (Overview) uses the very same ones */
  /* Hues the bands never use (bands = cyan / amber / green), so a grade can't be mistaken for a result. */
  :root { --grade-1: #E866B0; --grade-2: #8E6CD8; --grade-3: #F06A3B; --grade-4: #2A78D6; --grade-5: #B5487E; --grade-6: #6B7A90; }
  .ad-navcards { --grade-wash: 7%; --grade-stripe: 6px; }
  .ui-card.tight.ad-gradecard { position: relative; overflow: hidden; padding-left: calc(18px + var(--grade-stripe));
    background: color-mix(in srgb, var(--grade-c) var(--grade-wash), var(--white)); border-color: color-mix(in srgb, var(--grade-c) 35%, var(--line-200)); }
  .ad-gradecard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: var(--grade-stripe); background: var(--grade-c); }
  .ui-card.ad-gradecard:hover { border-color: var(--grade-c); }
  .ad-teamtable td:nth-child(3), .ad-teamtable .nowrap { white-space: nowrap; }
  /* Your team: search box beside Invite, sortable column heads */
  .ad-teamtop { justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ad-teamq { flex: 1 1 240px; max-width: 360px; }
  .ad-sortbtn { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: none; background: none; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
  .ad-sortbtn:hover, .ad-sortbtn.on { color: var(--ink-900); }
  .ad-sortbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .ad-sortic { font-size: 10px; color: var(--ink-300); }
  .ad-sortbtn.on .ad-sortic { color: var(--green-600); }
  .ad-teamnone { padding: 24px 16px; text-align: center; }
  /* Invite status tooltip (hover / tap) + expiring-invite alert */
  .ad-statustip { display: inline-flex; cursor: help; --tip-max-w: 280px; }
  .ad-statustip:focus { outline: none; }
  .ad-statustip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 999px; }
  .ad-invalert { margin-bottom: 16px; align-items: center; }
  .ad-invalert .btn-link { font-weight: 700; white-space: nowrap; }
  /* History: date range (Past 7 / 30 days / Custom) + Download CSV, above the type chips */
  .hist-range { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 12px; }
  .hist-dates { display: inline-flex; flex-wrap: wrap; gap: 8px 12px; }
  .hist-dates[hidden] { display: none; }
  .hist-dates label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); }
  .hist-dates .input { width: auto; }
  .hist-csv { margin-left: auto; }
  @media (max-width: 640px) { .hist-csv { margin-left: 0; } }
  /* Student details: a second pop-up stacked over the grade roster */
  .overlay.ad-stack { z-index: 60; }
  .ad-stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
  .ad-stage { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border: 1px solid var(--line-200); border-radius: var(--radius-md); background: var(--white); }
  .ad-stage.later { background: var(--surface-100); border-style: dashed; }
  .ad-stage-h { display: flex; align-items: center; gap: 8px; font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-md); color: var(--ink-900); }
  .ad-stage-s { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-600); }
  .ad-stage.done .ad-stage-s { color: var(--green-700); }
  .ad-stage.prog .ad-stage-s { color: var(--lvl-2-ink); }
  .ad-stage-none { font-weight: 600; font-size: var(--fs-xs); color: var(--text-meta); }
  .ad-stutabs { margin-bottom: 14px; }
  @media (max-width: 560px) { .ad-stages { grid-template-columns: minmax(0, 1fr); } }
  /* ⋮ row-actions menu on Your team */
  .ad-kebab { display: inline-grid; place-items: center; width: 34px; height: 34px; border: none; border-radius: 50%; background: none; color: var(--ink-450); cursor: pointer; }
  .ad-kebab:hover, .ad-kebab.on { background: var(--surface-100); color: var(--ink-900); }
  .ad-kebab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .ad-rowmenu { position: fixed; z-index: 80; min-width: 180px; }
  /* Quieter sidebar link to the Ask Tilli full screen (the main way in is the Overview) */
  .ad-nav-mini { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; padding: 7px 13px; border: none; background: none; border-radius: var(--radius-md); cursor: pointer;
    font: 600 var(--fs-xs) var(--font-body); color: var(--ink-450); text-align: left; }
  .ad-nav-mini svg { width: 15px; height: 15px; flex: none; }
  .ad-nav-mini:hover { background: var(--surface-100); color: var(--ink-900); }
  .ad-nav-mini.on { color: var(--green-700); }
  /* Outcomes: a sub-item under Overview (indented, smaller, a guide line on the left) */
  .ui-nav-item.open { color: var(--green-700); }
  .ui-nav-item.ad-nav-sub { position: relative; width: calc(100% - 22px); margin-left: 22px; padding: 8px 12px; gap: 10px; font-size: var(--fs-sm); }
  .ui-nav-item.ad-nav-sub::before { content: ''; position: absolute; left: -10px; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: var(--line-200); }
  .ui-nav-item.ad-nav-sub.on::before { background: var(--green-500); }
  .ui-nav-item.ad-nav-sub .ic { width: 16px; height: 16px; }
  .ui-nav-item.ad-nav-sub svg { width: 16px; height: 16px; }
  /* Outcomes › School: Progress over time drops its own legend (the school card above has one) */
  #o-prog.no-legend .ad-proghead > div:first-child { display: none; }
  #o-prog.no-legend .ad-proghead { justify-content: flex-end; }
  .ad-tabalert { display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: var(--warn-700); vertical-align: 2px; }   /* "School admin", "No section yet" on one line */
  .ad-navcard .nc-pcts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 9px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }

  /* ---- Per-grade breakdown (Outcomes school scope — Overview snapshot format) ---- */
  .ad-gradebreaks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--page-gap); }
  @media (max-width: 900px) { .ad-gradebreaks { grid-template-columns: 1fr; } }
  /* .ad-gradebreak = .ui-card.tight; name = .ui-title, meta = .ui-meta */
  .ad-gradebreak .gb-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .ad-gradebreak .gb-meta { margin-top: 4px; }
  .ad-gradebreak .gb-snap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 14px 0 16px; }
  .ad-gradebreak .gb-bar { flex: 1; min-width: 220px; }
  .ad-gradebreak .gb-gs { margin: 0; }

  /* ---- Grade drill snapshot (Outcomes grade scope — mirrors the grade card's headline) ---- */
  .ad-gradesnap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 4px 0 20px; }
  .ad-gradesnap .gs-bar { flex: 1; min-width: 220px; }

  /* ---- Areas of growth / strength (--band / --bandwash set inline from the level scale) ---- */
  /* Student class history (leadership) — no levels, history + notes only */
  .ad-hist-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-200); }
  .ad-hist-row:first-child { padding-top: 0; }
  .ad-hist-row:last-child { border-bottom: none; padding-bottom: 0; }
  .ad-hist-row .ui-dot { margin-top: 6px; }
  .ad-hist-t { font-family: var(--font-heading); font-size: var(--fs-md); color: var(--ink-900); }
  .ad-hist-y { font-weight: 700; font-size: var(--fs-sm); }
  .ad-hist-sub { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-450); margin-top: 2px; }
  .ad-hist-note { margin-top: 8px; }   /* .ui-inset */
  .ad-gs { border-radius: var(--radius-card); padding: 16px 18px; border: 1.5px solid var(--band, var(--line-200)); background: var(--bandwash, var(--white)); }
  .ad-gs h4 { margin: 0 0 10px; }   /* .ui-title.md */
  .ad-gs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .ad-gs li { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700); }
  .ad-gs li .p { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-450); }
  /* Overview growth/strength header: scope pill + drill-in link */

  /* ---- Compare two classes (Outcomes) — two full section reads, side by side ---- */
  .cmp-head { margin-bottom: 18px; }
  .cmp-head-kicker { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-450); }
  .cmp-head-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
  .cmp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--page-gap); align-items: start; }
  .cmp-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .cmp-select { width: 100%; }
  .cmp-select .select { width: 100%; text-align: center; font-family: var(--font-heading); font-weight: 700; }
  .cmp-body { display: flex; flex-direction: column; gap: 18px; }
  .cmp-gs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cmp-legend { margin: -4px 0 -6px; }
  .cmp-skills { display: flex; flex-direction: column; }
  .cmp-skillrow { display: grid; grid-template-columns: minmax(84px, 1.05fr) 1.5fr auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-200); }
  .cmp-skillrow:last-child { border-bottom: none; }
  .cmp-sk-name { font-weight: 700; font-size: var(--fs-sm); color: var(--ink-700); line-height: 1.25; }
  .cmp-sk-bar { min-width: 0; }
  .cmp-sk-status { justify-self: end; }   /* .ui-bandword */
  .cmp-views { margin-top: 14px; }
  @media (max-width: 860px) { .cmp-cols { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) { .cmp-gs { grid-template-columns: minmax(0, 1fr); } }

  /* ---- Where views differ (teacher / parent / child) ---- */
  .ad-views td.name { font-weight: 700; }
  .ad-views-note { font-size: var(--fs-xs); font-weight: 600; color: var(--text-meta); margin: 8px 2px 0; }

  /* ---- Mobile bottom tab bar (.ui-bottomnav) — shown ≤860px only ---- */
  .ui-bottomnav { display: none; }
  /* Header avatar is the account entry only when the sidebar (and its profile) is hidden. */
  .ui-header .ad-acct-m { display: none; }

  @media (max-width: 860px) {
    /* minmax(0,1fr) + min-width:0 lets the single column actually shrink to the
       viewport. Without this, the tables' min-width:640px forces the whole grid
       track wider than the screen and the entire page scrolls sideways (clipping
       content) instead of the tables scrolling inside their own wrapper. */
    .ad-app { grid-template-columns: minmax(0, 1fr); overflow-x: clip; }
    .ad-app > * { min-width: 0; }
    .ui-side { display: none; }
    /* Same minmax(0,1fr) + min-width:0 on every inner grid: a child with an
       intrinsic min-width (e.g. a table's min-width:420px) must NOT be able to
       stretch its track past the viewport and re-introduce sideways page scroll
       (which also drags the fixed bottom nav along). */
    .ad-grid.two, .ad-grid.tri { grid-template-columns: minmax(0, 1fr); }
    .ad-navcards { grid-template-columns: minmax(0, 1fr); }
    .ad-grid > *, .ad-navcards > * { min-width: 0; }
    .ad-skillrow { grid-template-columns: 1fr; gap: 8px; }
    .ad-main { padding-bottom: 96px; }
    .ui-bottomnav { display: flex; }
    .ui-header .ad-acct-m { display: grid; }
    .ui-header { gap: 10px; padding: 0 16px; }
    .ui-header .ad-year, .ui-header .desk-only { display: none; }
    /* Let the school-name block shrink and truncate instead of wrapping past the fixed header height. */
    .ui-header > div:first-child { min-width: 0; }
    .ui-header .ui-h-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  }

  /* ---- Phone-specific tightening (portrait) ---- */
  @media (max-width: 560px) {
    .ad-main .ui-card:not(.tight):not(.pad0):not(.sm):not(.md) { padding: 15px 14px; }
    /* Role badge is redundant on a phone and steals header width — drop it, keep the avatar. */
    .ui-header .ui-rolebadge { display: none; }
    .ui-header .ui-avatar { width: 34px; height: 34px; }
    /* Filters go full-width and stack cleanly; hide the decorative divider span. */
    .ad-filters .select-wrap { min-width: 0; flex: 1 1 46%; }
    .ad-filters .input { flex: 1 1 100%; max-width: none !important; }
    .ad-filters > span[style] { display: none; }
    .ui-bottomnav button { letter-spacing: -0.01em; gap: 2px; }
  }

  /* ============================================================
     Verdict banner (feedback §1/§3) — the one-line answer at the top
     of Overview. Lead with the conclusion; evidence sits below it.
     ============================================================ */

  /* n = … children, and the small-group caution (< 10 children) */
  .ad-n { font-weight: 700; color: var(--ink-450); white-space: nowrap; }
  .ad-small { margin-left: 6px; }   /* .ui-chip.warn */
  .ad-scope-n { font-size: var(--fs-sm); }

  /* ============================================================
     OVERVIEW — the living dandelion + guided story, free-flowing on
     the page (no cards). Plain white behind it (no wash). Type ramp:
     32 story headline · 15 body · 13 meta. SVG text = 11 / 13.
     ============================================================ */
  /* Full-bleed: points on the left, the dandelion on a cream panel that runs to the right edge. */
  .ad-app.ov-mode .ad-main { padding: 0; }
  .ad-app.ov-mode .ad-wrap { max-width: none; margin: 0; }
  .ov-dl { --dl-story-col: 0.85fr; --dl-panel: #FBF8EE;
    position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(320px, var(--dl-story-col)) minmax(0, 1.45fr); align-items: stretch;
    min-height: calc(100dvh - var(--topbar-h)); }
  .dl-viz { min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 26px 40px 32px; background: var(--dl-panel); }
  .dl-viz > #dl-viz { width: 100%; }
  /* Desktop: the panel is exactly one screen tall; the dandelion fills what's left between
     the ask box and the legend (the SVG letterboxes, so the whole tree stays in view). */
  @media (min-width: 861px) {
    .dl-viz { position: sticky; top: var(--topbar-h); height: calc(100dvh - var(--topbar-h)); }
    .dl-viz > #dl-viz { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .dl-viz .dl-stage { flex: 1; min-height: 0; }
    .dl-viz .dl-svg { height: 100%; }
  }
  .dl-head { display: flex; margin: 0 0 8px; align-items: center; justify-content: center; gap: 12px 20px; flex-wrap: wrap; }   /* zoomed: School › Grade (+ mode tabs) */
  .dl-head .ui-crumbs { margin: 0; }
  .dl-hint { margin: 2px 0 12px; text-align: center; font-weight: 600; font-size: var(--fs-sm); color: var(--text-meta); }
  /* "Or just ask Tilli": a soft pill search above the dandelion */
  .dl-ask { display: flex; align-items: center; gap: 10px; width: min(100%, 520px); margin: 0 0 6px; padding: 10px 18px; border: 1px solid var(--line-200); border-radius: 999px; background: var(--white); }
  .dl-ask:focus-within { border-color: var(--green-500); box-shadow: 0 0 0 3px var(--wash-green); }
  .dl-ask-ic { display: grid; color: var(--ink-450); }
  .dl-ask-input { flex: 1; min-width: 0; border: none; outline: none; background: none; text-align: center; font: 600 var(--fs-md) var(--font-body); color: var(--ink-900); }
  .dl-ask-input::placeholder { color: var(--ink-450); }
  /* Rotating suggestion, drawn over the empty input (fades between questions) */
  .dl-ask { position: relative; }
  .dl-ask-sug { position: absolute; left: 52px; right: 24px; top: 50%; transform: translateY(-50%); text-align: center; pointer-events: none;
    font: 600 var(--fs-md) var(--font-body); color: var(--ink-450); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .25s; }
  .dl-ask-sug.out { opacity: 0; }
  .dl-ask.typing .dl-ask-sug { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .dl-ask-sug { transition: none; } }
  .dl-stage { position: relative; touch-action: none; }
  .dl-stage.can-up .dl-svg { cursor: zoom-out; }   /* zoomed in: empty space steps back a level */
  /* The dandelion stays inside its own column (nothing drifts behind the points), and
     fades out softly over its left edge (--dl-edge-fade) instead of being cut off hard. */
  .ov-dl { --dl-edge-fade: 64px; }
  .dl-svg { display: block; width: 100%; height: auto; overflow: hidden; user-select: none;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--dl-edge-fade));
            mask-image: linear-gradient(to right, transparent 0, #000 var(--dl-edge-fade)); }
  /* Dotted spokes: zero-length dashes + round caps = round dots, spaced --dl-dot-gap apart
     (screen pixels — spokes use non-scaling-stroke, so dots stay the same size at every zoom). */
  .ov-dl { --dl-dot-gap: 5px; --dl-dot-hub: 2.2px; --dl-dot-kid: 1.6px; }
  .dl-spoke { stroke-linecap: round; stroke-dasharray: 0 var(--dl-dot-gap); transition: opacity .35s; }
  .dl-spoke.hub { stroke-width: var(--dl-dot-hub); }   /* colour = gradient parent → child, set inline */
  .dl-spoke.kid { opacity: .45; stroke-width: var(--dl-dot-kid); }
  .dl-hit { fill: transparent; }
  .dl-kid { cursor: pointer; transition: opacity .35s; }   /* click = who is this + Open profile */
  .dl-hub { cursor: grab; transition: opacity .35s; }
  .dl-hub.nav { cursor: pointer; }
  .dl-hub.nav:hover .dl-hit, .dl-hub.nav:focus-visible .dl-hit { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.5; }
  .dl-hub:focus { outline: none; }
  .dl-stage.dragging, .dl-stage.dragging * { cursor: grabbing; }
  .dl-name { font-family: var(--font-body); font-weight: 700; fill: var(--ink-700); paint-order: stroke; stroke: var(--white); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; transition: opacity .35s; }
  .dl-name.d0 { fill: var(--ink-900); }
  .dl-name.d2 { font-weight: 600; fill: var(--ink-450); }
  .dl-stage [data-dl-i].dim { opacity: var(--dl-dim, .14); }
  .dl-spoke.kid.dim { opacity: calc(var(--dl-dim, .14) * .45); }
  /* outside the zoomed-in grade/section: faded context, not interactive */
  .dl-stage [data-dl-i].ctx { opacity: var(--dl-ctx, .05); pointer-events: none; }
  .dl-spoke.kid.ctx { opacity: calc(var(--dl-ctx, .05) * .45); }
  .dl-tip { position: absolute; z-index: 5; transform: translate(-50%, calc(-100% - 16px)); pointer-events: none; background: var(--ink-900); color: var(--white);
    border-radius: var(--radius-sm); padding: 8px 12px; box-shadow: var(--shadow-pop); font-size: var(--fs-sm); font-weight: 600; line-height: 1.45; white-space: nowrap; }
  .dl-tip.below { transform: translate(-50%, 16px); }
  .dl-tip.pinned { pointer-events: auto; }   /* clicked child: the card stays and its button works */
  .dl-tip-open { display: block; margin-top: 8px; padding: 6px 12px; border: none; border-radius: 999px; background: var(--green-500); color: var(--white);
    font: 700 var(--fs-xs) var(--font-body); cursor: pointer; white-space: nowrap; }
  .dl-tip-open:hover { background: var(--green-600); }
  .dl-tip b { display: block; font-weight: 700; }
  .dl-tip span { display: block; color: var(--ink-300); }
  .dl-tip em { display: block; font-style: normal; color: var(--green-500); margin-top: 2px; }
  .ui-legend i.ring { box-shadow: inset 0 0 0 2px var(--ink-300); }
  /* Guided story */
  .dl-story { min-width: 0; padding: 40px 36px 48px 48px; }
  /* "Currently selected" (follows the zoom) + headcounts + source */
  .dl-sel-eyebrow { margin: 0 0 4px; font-weight: 700; font-size: var(--fs-sm); color: var(--lvl-2-ink); }
  .dl-sel-name { margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl); line-height: 1.2; color: var(--ink-900); }
  .dl-sel-sub { margin: 2px 0 0; font-weight: 600; font-size: var(--fs-md); color: var(--text-meta); }
  .dl-counts { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 18px 0 0; padding-top: 18px; border-top: 1px solid var(--line-200); }
  .dl-counts span { display: inline-flex; align-items: baseline; gap: 6px; font-weight: 700; font-size: var(--fs-sm); color: var(--text-meta); }
  .dl-counts b { font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-xl); line-height: 1; color: var(--ink-900); font-variant-numeric: tabular-nums; }
  .dl-headline { margin: 8px 0 0; font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-2xl); line-height: 1.15; color: var(--ink-900); letter-spacing: -.01em; }
  .dl-body { margin: 12px 0 0; font-weight: 600; font-size: var(--fs-md); line-height: 1.55; color: var(--ink-600); }
  /* story points: hover / focus lights the dandelion, click pins */
  /* Each point is a card. All warnings share one card; "+ N more" expands the rest in place. */
  .dl-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .dl-points li { position: relative; padding: 14px 18px; border: 1px solid var(--line-200); border-radius: var(--radius-lg); background: var(--white);
    cursor: pointer; transition: border-color .2s, box-shadow .2s, background .2s, opacity .2s; }
  .dl-points li.on, .dl-points li.pinned { border-color: var(--accent); box-shadow: var(--shadow-card); }
  .dl-points li.warn { border-color: color-mix(in srgb, var(--attn) 30%, var(--line-200)); }
  .dl-points li.warn.on, .dl-points li.warn.pinned { border-color: var(--attn); }
  .dl-points li.warn { padding-right: 96px; }
  .dl-more { position: absolute; right: 14px; top: 12px; padding: 3px 6px; border: none; border-radius: 999px; background: none; cursor: pointer;
    font: 700 var(--fs-sm) var(--font-body); color: var(--attn-ink); }
  .dl-more:hover { background: var(--attn-wash); }
  .dl-more:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .dl-stack-row { margin-top: 12px; padding-top: 12px; border-top: 1px dashed color-mix(in srgb, var(--attn) 25%, var(--line-200)); }
  .dl-points li:focus { outline: none; }
  .dl-points li:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  /* Point = small kind eyebrow · one-ink Montserrat headline · body. Warnings: amber eyebrow + icon. */
  .dl-pt-kind { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0 0 5px; font-weight: 700; font-size: var(--fs-xs); letter-spacing: .04em; text-transform: uppercase; color: var(--text-meta); }
  /* "Needs attention" = a small red pill (icon + label); the topic follows it in grey */
  /* "Needs attention": super-light warm red pill, darker warm red text (4.97:1, AA) + a bright red dot */
  .ov-dl { --attn: #D9361F; --attn-ink: #C2361C; --attn-wash: #FFF1EE; }
  .dl-attn { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 999px;
    background: var(--attn-wash); color: var(--attn-ink); letter-spacing: .03em; }
  /* Results cards in band colours: good news = Blooming green, needs help = Sprouting blue
     (tinted card + border + label pill; pill text darkened for AA: 5.3:1 / 5.8:1). */
  .ov-dl { --tone-bloom-ink: #2A700D; --tone-sprout-ink: #14657A; }
  .dl-points li.tone-bloom { border-color: color-mix(in srgb, var(--lvl-3) 40%, var(--line-200)); background: color-mix(in srgb, var(--lvl-3-wash) 45%, var(--white)); }
  .dl-points li.tone-sprout { border-color: color-mix(in srgb, var(--lvl-1) 40%, var(--line-200)); background: color-mix(in srgb, var(--lvl-1-wash) 45%, var(--white)); }
  .dl-points li.tone-bloom.on, .dl-points li.tone-bloom.pinned { border-color: var(--lvl-3); }
  .dl-points li.tone-sprout.on, .dl-points li.tone-sprout.pinned { border-color: var(--lvl-1); }
  .dl-tone { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; letter-spacing: .03em; }
  .dl-points li.tone-bloom .dl-tone { background: var(--lvl-3-wash); color: var(--tone-bloom-ink); }
  .dl-points li.tone-sprout .dl-tone { background: var(--lvl-1-wash); color: var(--tone-sprout-ink); }
  .dl-pt-kind svg { flex: none; }
  .dl-pt-head { margin: 0; font-family: var(--font-body); font-weight: 700; font-size: var(--fs-md); line-height: 1.4; color: var(--ink-900); }
  .dl-pt-head em { font-style: normal; color: inherit; }
  .dl-pt-body { margin: 4px 0 0; font-weight: 600; font-size: var(--fs-sm); line-height: 1.5; color: var(--ink-600); }
  /* point kinds: warnings get an amber dot (always listed first), the activity a green one */
  .dl-pt-body .dl-ptlink { font-weight: 700; font-size: var(--fs-sm); }
  .dl-sample { margin-left: 4px; vertical-align: 1px; }
  .dl-source { margin: 10px 0 22px; font-weight: 600; font-size: var(--fs-xs); color: var(--text-meta); }
  /* Legend + what a ring's colour means, under the actions (always in view) */
  .dl-key { margin: 14px 0 0; text-align: center; }   /* under the dandelion */
  .dl-key .ui-legend { justify-content: center; }
  .dl-keynote { margin: 8px auto 0; max-width: 460px; font-weight: 600; font-size: var(--fs-xs); line-height: 1.5; color: var(--text-meta); }
  /* Under the points: Ask Tilli (primary button) + See outcomes (text link — Outcomes isn't in the nav) */
  .dl-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin: 16px 0 0; }
  .dl-out { font-weight: 700; font-size: var(--fs-sm); }
  /* Ask Tilli inside the Overview: a soft button under the story; open, the chat replaces the story */
  .ov-dl { --dla-h: max(460px, calc(100dvh - var(--topbar-h) - 80px)); --dla-h-phone: 380px; --dla-col: 1fr; }   /* chat height (desktop / phone), chat column share */
  /* Asking: the chat takes a full-height column and the dandelion shrinks to fit the
     same height beside it (the SVG letterboxes inside, so the whole branch stays in view). */
  .ov-dl.asking { grid-template-columns: minmax(340px, var(--dla-col)) minmax(0, 1.25fr); }
  .ov-dl.asking .dl-viz { height: calc(100dvh - var(--topbar-h)); }
  .ov-dl.asking .dl-viz > #dl-viz { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ov-dl.asking .dl-stage { flex: 1; min-height: 0; }
  .ov-dl.asking .dl-svg { height: 100%; }
  .dla { display: flex; flex-direction: column; height: var(--dla-h); background: var(--white); border: 1px solid var(--line-200); border-radius: var(--radius-xl); box-shadow: var(--shadow-pop); overflow: hidden; }
  .dla-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--line-200); }
  .dla-hmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dla-hmeta b { display: flex; align-items: center; gap: 7px; font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-lg); color: var(--ink-900); }
  .dla-hmeta > span { font-size: var(--fs-xs); font-weight: 600; color: var(--text-meta); }
  .dla-thread { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .dla-thread [data-askgo="overview"] { display: none; }   /* already here */
  .dla-note { margin-top: 6px; font-size: var(--fs-xs); font-weight: 700; color: var(--green-700); }
  .dla-compose { padding: 10px 12px 12px; border-top: 1px solid var(--line-200); }
  @media (prefers-reduced-motion: reduce) {
    .dl-spoke, .dl-kid, .dl-hub, .dl-name, .dl-points li { transition: none; }
  }
  @media (max-width: 860px) {
    .ov-dl { grid-template-columns: minmax(0, 1fr); min-height: 0; }
    .dl-viz { order: 1; padding: 20px 16px 24px; }   /* phone: dandelion above the story */
    .dl-story { order: 2; padding: 24px 16px 40px; }
    .dla { height: var(--dla-h-phone); }   /* phone: chat under the dandelion */
    .ov-dl.asking { grid-template-columns: minmax(0, 1fr); }
    .ov-dl.asking .dl-viz { height: auto; display: block; }
    .ov-dl.asking .dl-svg { height: auto; }
  }

  /* Roster: Students / Your team tabs (.ui-tabs), with a small count after each label */
  .ad-rostertabs { margin: 4px 0 20px; }
  .ad-rostertabs .ui-tab { font-size: var(--fs-md); padding: 10px 16px; }
  .ad-tabn { margin-left: 4px; font-weight: 600; font-size: var(--fs-xs); color: var(--text-meta); }
  /* Roster: quiet year-end row */
  .ad-yearend { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 18px; border: 1px dashed var(--line-200); border-radius: var(--radius-md); }
  .ad-yearend b { display: block; font-size: var(--fs-sm); color: var(--ink-700); }
  .ad-yearend span { font-size: var(--fs-sm); color: var(--ink-450); font-weight: 600; }

  /* ---- Band-bar target marker (feedback §2) — "compared to what?" ----
     Secure is the right-most segment, so a target of N% Secure sits at
     (100−N)% from the left: the green should reach this line. */
  .ad-barwrap { position: relative; }
  .ad-bar-target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-700); border-radius: 2px; pointer-events: none; }
  .ad-bar-target::after { content: ''; position: absolute; top: -3px; left: -2px; border: 3px solid transparent; border-top-color: var(--ink-700); }
  .ad-targetdelta { display: inline-block; margin-top: 6px; font-weight: 700; font-size: var(--fs-xs); color: var(--ink-450); }
  .ad-targetdelta.met { color: var(--green-700); }

  /* ============================================================
     Ask Tilli — floating assistant + full screen (feedback §5).
     A chat surface that answers from the school's own dashboard data.
     ============================================================ */
  /* Floating Ask Tilli + Need help bubbles: assets/float-help.js (styles in tilli.css).
     Lift them above the mobile bottom nav. */
  @media (max-width: 860px) { :root { --tf-bottom: 78px; --tf-right: 14px; } }

  /* Ask Tilli full screen — same .askx layout as the teacher view (tilli.css).

  .ad-app.ask-mode .ui-header { display: none; }
  .ad-app.ask-mode .ad-main { flex: 1; min-height: 0; padding: 0; display: flex; }

  /* Floating chat window look = .ask-panel / .ask-* (tilli.css, shared with teacher).
     Admin has no bubble-anchored positioning, so on tablet/phone it sits above the bottom nav. */
  @media (max-width: 860px) { .ask-panel { right: 8px; left: 8px; bottom: 74px; width: auto; max-width: none; height: min(72dvh, 560px); } }
  /* Admin-only extras inside a Tilli answer */
  .ask-src { margin-top: 8px; font-size: var(--fs-xs); font-weight: 700; color: var(--text-meta); }
  .ask-quote { margin: 8px 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--white); border-radius: var(--radius-sm); font-weight: 600; color: var(--ink-700); }
  .ask-sugs { display: flex; flex-wrap: wrap; gap: 7px; align-self: flex-start; }

     floats above the bottom nav when the sidebar is hidden. */
  .ad-statepanel.float { left: 8px; bottom: 74px; width: 200px; }
